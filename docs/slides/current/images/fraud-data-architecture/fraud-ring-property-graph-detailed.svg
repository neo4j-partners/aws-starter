<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="670" fill="#FFFFFF"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0E2A33">Fraud Ring — Property Graph</text>

  <!-- outer container -->
  <rect x="40" y="70" width="920" height="524" rx="16" fill="#FFFFFF" stroke="#1B3139" stroke-width="2"/>

  <!-- ================= property cards ================= -->
  <g font-size="13">
    <rect x="68" y="96" width="250" height="104" rx="8" fill="#F2F7FA" stroke="#1B3139" stroke-width="1.5"/>
    <text x="88" y="122" fill="#3D5A63">account_id: <tspan fill="#1B3139" font-weight="600">"ACC-1001"</tspan></text>
    <text x="88" y="143" fill="#3D5A63">customer_name: <tspan fill="#1B3139" font-weight="600">"Dan Morris"</tspan></text>
    <text x="88" y="164" fill="#3D5A63">status: <tspan fill="#1B3139" font-weight="600">"active"</tspan></text>
    <text x="88" y="185" fill="#3D5A63">opened_date: <tspan fill="#1B3139" font-weight="600">"2024-01-15"</tspan></text>

    <rect x="682" y="96" width="250" height="104" rx="8" fill="#F2F7FA" stroke="#1B3139" stroke-width="1.5"/>
    <text x="702" y="122" fill="#3D5A63">account_id: <tspan fill="#1B3139" font-weight="600">"ACC-2047"</tspan></text>
    <text x="702" y="143" fill="#3D5A63">customer_name: <tspan fill="#1B3139" font-weight="600">"Ann Chen"</tspan></text>
    <text x="702" y="164" fill="#3D5A63">status: <tspan fill="#1B3139" font-weight="600">"active"</tspan></text>
    <text x="702" y="185" fill="#3D5A63">opened_date: <tspan fill="#1B3139" font-weight="600">"2024-03-22"</tspan></text>

    <rect x="310" y="498" width="380" height="76" rx="8" fill="#F2F7FA" stroke="#1B3139" stroke-width="1.5"/>
    <text x="334" y="522" fill="#3D5A63">street: <tspan fill="#1B3139" font-weight="600">"742 Evergreen Terrace"</tspan></text>
    <text x="334" y="543" fill="#3D5A63">city: <tspan fill="#1B3139" font-weight="600">"Springfield"</tspan></text>
    <text x="334" y="564" fill="#3D5A63">state: <tspan fill="#1B3139" font-weight="600">"IL"</tspan>, zip: <tspan fill="#1B3139" font-weight="600">"62704"</tspan></text>
  </g>

  <!-- card-to-node tethers -->
  <g stroke="#3D5A63" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="193" y1="200" x2="193" y2="224"/>
    <line x1="807" y1="200" x2="807" y2="224"/>
    <line x1="500" y1="488" x2="500" y2="498"/>
  </g>

  <!-- ================= relationships ================= -->
  <g stroke="#0E5A8A" stroke-width="2" fill="#0E5A8A">
    <!-- TRANSFERRED_TO: left to right -->
    <line x1="265" y1="244" x2="734" y2="244"/>
    <polygon points="741,244 731,239 731,249"/>
    <!-- TRANSFERRED_TO: right to left -->
    <line x1="735" y1="296" x2="266" y2="296"/>
    <polygon points="259,296 269,291 269,301"/>
    <!-- REGISTERED_AT: left account to address -->
    <line x1="253" y1="301" x2="425.6" y2="405.3"/>
    <polygon points="435,411 423,409.6 428.2,401"/>
    <!-- REGISTERED_AT: right account to address -->
    <line x1="747" y1="301" x2="574.4" y2="405.3"/>
    <polygon points="565,411 571.8,401 577,409.6"/>
  </g>

  <!-- ================= nodes ================= -->
  <g>
    <ellipse cx="193" cy="270" rx="80" ry="46" fill="#B7DF7A" stroke="#6FA82E" stroke-width="2"/>
    <text x="193" y="270" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1B3139">Account</text>

    <ellipse cx="807" cy="270" rx="80" ry="46" fill="#B7DF7A" stroke="#6FA82E" stroke-width="2"/>
    <text x="807" y="270" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1B3139">Account</text>

    <ellipse cx="500" cy="442" rx="88" ry="46" fill="#CFE6F2" stroke="#0E5A8A" stroke-width="2"/>
    <text x="500" y="442" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1B3139">Address</text>
  </g>

  <!-- ================= relationship labels ================= -->
  <g text-anchor="middle">
    <rect x="392" y="227" width="216" height="34" rx="6" fill="#FFFFFF" stroke="#0E5A8A" stroke-width="1.2"/>
    <text x="500" y="241" font-size="12" font-weight="700" fill="#0E5A8A" letter-spacing="0.4">TRANSFERRED_TO</text>
    <text x="500" y="255" font-size="11" fill="#3D5A63">$4,200 · wire</text>

    <rect x="392" y="279" width="216" height="34" rx="6" fill="#FFFFFF" stroke="#0E5A8A" stroke-width="1.2"/>
    <text x="500" y="293" font-size="12" font-weight="700" fill="#0E5A8A" letter-spacing="0.4">TRANSFERRED_TO</text>
    <text x="500" y="307" font-size="11" fill="#3D5A63">$3,800 · ACH</text>

    <rect x="246" y="339" width="196" height="34" rx="6" fill="#FFFFFF" stroke="#0E5A8A" stroke-width="1.2"/>
    <text x="344" y="353" font-size="12" font-weight="700" fill="#0E5A8A" letter-spacing="0.4">REGISTERED_AT</text>
    <text x="344" y="367" font-size="11" fill="#3D5A63">address_type: "mailing"</text>

    <rect x="558" y="339" width="196" height="34" rx="6" fill="#FFFFFF" stroke="#0E5A8A" stroke-width="1.2"/>
    <text x="656" y="353" font-size="12" font-weight="700" fill="#0E5A8A" letter-spacing="0.4">REGISTERED_AT</text>
    <text x="656" y="367" font-size="11" fill="#3D5A63">address_type: "billing"</text>
  </g>

  <!-- caption -->
  <text x="500" y="624" text-anchor="middle" font-size="14" fill="#1B3139"><tspan font-weight="700">Two accounts, one address.</tspan> Reciprocal transfers and the shared address are</text>
  <text x="500" y="646" text-anchor="middle" font-size="14" fill="#1B3139">stored as relationships, so the ring is one traversal rather than a chain of joins.</text>
</svg>
