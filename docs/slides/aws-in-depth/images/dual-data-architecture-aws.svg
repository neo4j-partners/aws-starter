<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="510" viewBox="16 88 1148 510" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#146EB4"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9900"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- AWS data lake -->
  <rect x="40" y="104" width="470" height="472" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#shadow)"/>
  <path d="M40,148 V118 a14,14 0 0 1 14,-14 H496 a14,14 0 0 1 14,14 V148 Z" fill="#232F3E"/>
  <text x="62" y="133" font-size="14.5" font-weight="700" fill="#FFFFFF">AWS Data Lake and Analytics</text>
  <text x="488" y="133" text-anchor="end" font-size="10" fill="#FF9900">Amazon S3 + AWS Glue</text>

  <text x="275" y="184" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Operational fleet data in open tables</text>

  <rect x="60" y="204" width="430" height="218" rx="10" fill="#F2F8FC" stroke="#9CC9E4" stroke-width="1.3"/>
  <text x="80" y="232" font-size="12.5" font-weight="700" fill="#146EB4">AMAZON S3 TABLES</text>
  <text x="472" y="232" text-anchor="end" font-size="9.5" font-style="italic" fill="#5E97C9">cataloged by AWS Glue</text>

  <g fill="#FFFFFF" stroke="#6FAED2" stroke-width="1.2">
    <rect x="80" y="260" width="178" height="42" rx="7"/>
    <rect x="292" y="260" width="178" height="42" rx="7"/>
    <rect x="80" y="322" width="178" height="42" rx="7"/>
    <rect x="292" y="322" width="178" height="42" rx="7"/>
  </g>
  <g font-size="13" font-weight="700" fill="#16233A" text-anchor="middle">
    <text x="169" y="286">aircraft</text>
    <text x="381" y="286">sensor_readings</text>
    <text x="169" y="348">flights</text>
    <text x="381" y="348">maintenance_events</text>
  </g>
  <text x="80" y="397" font-size="11" font-style="italic" fill="#5E6B78">+ components · airports · delays · removals</text>

  <rect x="60" y="444" width="430" height="100" rx="10" fill="#FFF7E8" stroke="#FF9900" stroke-width="1.5"/>
  <text x="80" y="470" font-size="12.5" font-weight="700" fill="#9B5C00">CURATED RESULTS IN AMAZON S3</text>
  <rect x="80" y="488" width="188" height="32" rx="7" fill="#FFFFFF" stroke="#F2BA60"/>
  <text x="174" y="509" text-anchor="middle" font-size="12.5" font-family="Menlo, monospace" font-weight="700" fill="#9B5C00">maintenance_impact</text>
  <text x="282" y="509" font-size="10.5" fill="#8E6B35">graph findings for analytics</text>

  <!-- Neo4j graph -->
  <rect x="670" y="104" width="470" height="472" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#shadow)"/>
  <path d="M670,148 V118 a14,14 0 0 1 14,-14 H1126 a14,14 0 0 1 14,14 V148 Z" fill="#018BFF"/>
  <path d="M690,123 L695,128 L690,133 L685,128 Z" fill="#FFFFFF"/>
  <text x="706" y="133" font-size="14.5" font-weight="700" fill="#FFFFFF">Neo4j Fleet Knowledge Graph</text>

  <rect x="690" y="168" width="430" height="398" rx="10" fill="#E5F1FF" stroke="#018BFF" stroke-width="1.4"/>
  <text x="710" y="198" font-size="12.5" font-weight="700" fill="#0166BC">OPERATIONAL FLEET GRAPH</text>
  <text x="1100" y="198" text-anchor="end" font-size="9.5" font-style="italic" fill="#5E97C9">connected fleet data</text>
  <text x="710" y="228" font-size="11" font-style="italic" fill="#5E97C9">Aircraft, components, sensors, flights, and maintenance events</text>
  <line x1="804" y1="298" x2="904" y2="298" stroke="#3D82C4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="854" y="289" text-anchor="middle" font-size="8.5" fill="#3D82C4">HAS_COMPONENT</text>
  <line x1="758" y1="312" x2="758" y2="370" stroke="#3D82C4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="766" y="344" font-size="8.5" fill="#3D82C4">HAS_SENSOR</text>
  <line x1="960" y1="312" x2="960" y2="370" stroke="#3D82C4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="968" y="344" font-size="8.5" fill="#3D82C4">HAS_EVENT</text>
  <g fill="#FFFFFF" stroke="#66AEE8" stroke-width="1.3">
    <rect x="712" y="281" width="92" height="30" rx="15"/>
    <rect x="908" y="281" width="104" height="30" rx="15"/>
    <rect x="712" y="371" width="92" height="30" rx="15"/>
    <rect x="908" y="371" width="154" height="30" rx="15"/>
  </g>
  <g font-size="12" fill="#0B4C7F" text-anchor="middle">
    <text x="758" y="301">Aircraft</text>
    <text x="960" y="301">Component</text>
    <text x="758" y="391">Sensor</text>
    <text x="985" y="391">Maintenance Event</text>
  </g>

  <!-- Bidirectional connector -->
  <text x="590" y="395" text-anchor="middle" font-size="9" fill="#146EB4">ingest: S3 tables → graph</text>
  <line x1="510" y1="407" x2="670" y2="407" stroke="#146EB4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="590" y="429" text-anchor="middle" font-size="10.5" font-weight="700" fill="#146EB4">AWS Glue + Neo4j Spark</text>
  <text x="590" y="442" text-anchor="middle" font-size="10.5" font-weight="700" fill="#146EB4">Connector</text>
  <line x1="670" y1="462" x2="510" y2="462" stroke="#146EB4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="590" y="479" text-anchor="middle" font-size="9" fill="#146EB4">write-back: graph findings → S3 results</text>
</svg>
