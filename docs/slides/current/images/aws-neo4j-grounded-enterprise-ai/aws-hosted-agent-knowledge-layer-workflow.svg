<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title description">
  <title id="title">AWS-hosted agent workflow grounded by an Enterprise Knowledge Layer</title>
  <desc id="description">A user request enters an AWS-hosted agent. AgentCore Gateway connects the agent to an Enterprise Knowledge Layer that interprets meaning, applies policy, selects sources and tools, connects evidence, and reuses memory. Approved tools query Neo4j, AWS data, documents, and enterprise APIs before a grounded answer is returned.</desc>

  <defs>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 1.6px; }
      .title { fill: #0f172a; font-size: 25px; font-weight: 760; }
      .pill-title { fill: #0f172a; font-size: 21px; font-weight: 760; }
      .runtime-title { fill: #0f172a; font-size: 23px; font-weight: 760; text-anchor: middle; }
      .copy { fill: #475569; font-size: 17px; }
      .small { fill: #64748b; font-size: 15px; }
      .chip-title { fill: #0f172a; font-size: 18px; font-weight: 750; }
      .chip-copy { fill: #475569; font-size: 14px; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow-slate); }
      .flow-teal { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1600" height="660" fill="#ffffff"/>

  <!-- Request and answer -->
  <g filter="url(#shadow)">
    <rect x="30" y="42" width="245" height="64" rx="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="30" y="542" width="245" height="64" rx="32" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <text x="152" y="81" text-anchor="middle" class="pill-title">User question</text>
  <text x="152" y="572" text-anchor="middle" class="pill-title">Grounded answer</text>
  <text x="152" y="592" text-anchor="middle" class="small">evidence + provenance</text>

  <!-- AWS-hosted agent -->
  <g filter="url(#shadow)">
    <rect x="30" y="152" width="245" height="334" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  </g>
  <text x="58" y="187" class="eyebrow" fill="#c2410c">AWS-HOSTED AGENT</text>
  <text x="152" y="226" class="runtime-title">AgentCore Runtime</text>
  <text x="58" y="251" class="copy">Runs the agent securely</text>

  <rect x="58" y="280" width="189" height="72" rx="13" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="76" y="310" class="chip-title">Strands agent</text>
  <text x="76" y="335" class="chip-copy">Plans and invokes tools</text>

  <rect x="58" y="372" width="189" height="72" rx="13" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="76" y="402" class="chip-title">Amazon Bedrock</text>
  <text x="76" y="427" class="chip-copy">Reasons over context</text>

  <path class="flow" d="M152 106V142"/>
  <path class="flow-teal" d="M152 486V532"/>

  <!-- Secure tool plane -->
  <g filter="url(#shadow)">
    <rect x="310" y="205" width="310" height="226" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="338" y="240" class="eyebrow" fill="#475569">SECURE TOOL PLANE</text>
  <text x="338" y="278" class="title">AgentCore Gateway</text>
  <text x="338" y="306" class="copy">Authentication and tool access</text>
  <rect x="338" y="337" width="254" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="465" y="371" text-anchor="middle" class="chip-title">Neo4j MCP</text>

  <path class="flow" d="M275 318H300"/>

  <!-- Enterprise Knowledge Layer -->
  <g filter="url(#shadow)">
    <rect x="650" y="42" width="910" height="314" rx="24" fill="#0f766e"/>
  </g>
  <text x="686" y="82" class="eyebrow" fill="#99f6e4">SHARED, GOVERNED CONTEXT</text>
  <text x="686" y="124" fill="#ffffff" font-size="31" font-weight="780">Enterprise Knowledge Layer</text>
  <text x="686" y="153" fill="#ccfbf1" font-size="18">Ground the request before execution; connect evidence after execution.</text>

  <g>
    <rect x="686" y="184" width="200" height="128" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="899" y="184" width="200" height="128" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="1112" y="184" width="200" height="128" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="1325" y="184" width="199" height="128" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>
  <text x="706" y="218" class="chip-title">Meaning</text>
  <text x="706" y="244" class="chip-copy">Resolve concepts,</text>
  <text x="706" y="265" class="chip-copy">entities, and intent</text>

  <text x="919" y="218" class="chip-title">Policy</text>
  <text x="919" y="244" class="chip-copy">Apply permissions</text>
  <text x="919" y="265" class="chip-copy">and business rules</text>

  <text x="1132" y="218" class="chip-title">Mappings</text>
  <text x="1132" y="244" class="chip-copy">Select sources, tools,</text>
  <text x="1132" y="265" class="chip-copy">and query patterns</text>

  <text x="1345" y="218" class="chip-title">Memory</text>
  <text x="1345" y="244" class="chip-copy">Reuse decisions,</text>
  <text x="1345" y="265" class="chip-copy">evidence, and outcomes</text>

  <path class="flow-teal" d="M620 258H640"/>

  <path class="flow-teal" d="M650 326H630"/>
  <path class="flow-teal" d="M310 358H285"/>

  <!-- Governed sources -->
  <text x="650" y="405" class="eyebrow" fill="#475569">GOVERNED SOURCES AND ACTION TOOLS</text>
  <text x="650" y="432" class="small">The plan selects authoritative systems; each source enforces access.</text>

  <g filter="url(#shadow)">
    <rect x="650" y="461" width="208" height="104" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="873" y="461" width="208" height="104" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1096" y="461" width="208" height="104" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1319" y="461" width="241" height="104" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="674" y="497" class="chip-title">Neo4j graph</text>
  <text x="674" y="524" class="chip-copy">Cypher over connected</text>
  <text x="674" y="545" class="chip-copy">facts and relationships</text>

  <text x="897" y="497" class="chip-title">AWS data</text>
  <text x="897" y="524" class="chip-copy">Athena over S3 and</text>
  <text x="897" y="545" class="chip-copy">governed tables</text>

  <text x="1120" y="497" class="chip-title">Documents</text>
  <text x="1120" y="524" class="chip-copy">Retrieve policies,</text>
  <text x="1120" y="545" class="chip-copy">records, and evidence</text>

  <text x="1343" y="497" class="chip-title">Enterprise APIs</text>
  <text x="1343" y="524" class="chip-copy">Read data or perform</text>
  <text x="1343" y="545" class="chip-copy">approved actions</text>

  <path class="flow" d="M620 387C632 387 634 513 640 513"/>

  <path class="flow-teal" d="M1439 451V366"/>

  <!-- Outcome -->
  <rect x="650" y="596" width="910" height="42" rx="12" fill="#ecfeff" stroke="#99f6e4" stroke-width="2"/>
  <text x="1105" y="623" text-anchor="middle" fill="#0f766e" font-size="17" font-weight="760">AWS hosts the agent and secures tool traffic; every target still enforces its own data access.</text>
</svg>
