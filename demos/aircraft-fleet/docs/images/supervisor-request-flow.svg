  <text x="455.0" y="688" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">history, entities, preferences</text>
  <text x="455.0" y="710" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">separate from the fleet graph</text>
  <text x="455.0" y="738" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">On a rejected password, the request</text>
  <text x="455.0" y="756" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">reads the secret again and rebuilds.</text>
  <path d="M455,560 V626" fill="none" stroke="#C11574" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#a-pink)" marker-end="url(#a-pink)"/>
