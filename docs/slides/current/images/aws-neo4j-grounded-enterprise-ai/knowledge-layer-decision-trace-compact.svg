<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">A decision trace combines multiple kinds of governed context</title>
  <desc id="description">Meaning, sources and lineage, policy checks, current evidence, and optional precedent contribute independently to a result, action, or outcome. Useful traces flow into memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-18%" y="-22%" width="136%" height="155%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .label { fill: #0f172a; font-size: 20px; font-weight: 750; }
      .copy { fill: #475569; font-size: 14px; font-weight: 500; }
      .result-title { fill: #ffffff; font-size: 29px; font-weight: 800; text-anchor: middle; }
      .result-copy { fill: #ccfbf1; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .memory-title { fill: #0f172a; font-size: 23px; font-weight: 750; }
      .memory-copy { fill: #475569; font-size: 15px; font-weight: 500; }
      .link { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
      .optional-link { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 7; marker-end: url(#arrow-slate); }
      .flow { fill: none; stroke: #0f766e; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Independent contributors -->
  <g filter="url(#shadow)">
    <rect x="25" y="26" width="340" height="82" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="25" y="130" width="340" height="82" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="25" y="234" width="340" height="82" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="25" y="338" width="340" height="82" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="25" y="442" width="340" height="82" rx="17" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  </g>

  <circle cx="64" cy="67" r="17" fill="#ccfbf1"/>
  <path d="M56 67h16M64 59v16" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="92" y="64">Meaning</text>
  <text class="copy" x="92" y="88">Terms, entities, relationships</text>

  <circle cx="64" cy="171" r="17" fill="#ccfbf1"/>
  <path d="M56 166h16v13H56Zm4-6h8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
  <text class="label" x="92" y="168">Sources + lineage</text>
  <text class="copy" x="92" y="192">Origin, ownership, freshness</text>

  <circle cx="64" cy="275" r="17" fill="#ccfbf1"/>
  <path d="M56 275l6 6 10-12" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="92" y="272">Policy checks</text>
  <text class="copy" x="92" y="296">Access, purpose, business rules</text>

  <circle cx="64" cy="379" r="17" fill="#ccfbf1"/>
  <path d="M56 382l6-7 6 4 7-10" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="92" y="376">Current evidence</text>
  <text class="copy" x="92" y="400">Facts resolved for this request</text>

  <circle cx="64" cy="483" r="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <path d="M57 479a9 9 0 1 1 1 11M57 479v8h8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="92" y="480">Optional precedent</text>
  <text class="copy" x="92" y="504">Relevant prior decisions + outcomes</text>

  <!-- Each contributor links directly to the resolved result -->
  <path class="link" d="M365 67H548V120"/>
  <path class="link" d="M365 171H410"/>
  <path class="link" d="M365 275H410"/>
  <path class="link" d="M365 379H410"/>
  <path class="optional-link" d="M365 483H410"/>

  <g filter="url(#shadow)">
    <rect x="420" y="130" width="255" height="394" rx="24" fill="#0f766e"/>
  </g>
  <text class="result-title" x="548" y="264">Result</text>
  <text x="548" y="302" fill="#99f6e4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">·</text>
  <text class="result-title" x="548" y="340">Action</text>
  <text x="548" y="378" fill="#99f6e4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">·</text>
  <text class="result-title" x="548" y="416">Outcome</text>
  <text class="result-copy" x="548" y="456">Grounded in context</text>
  <text class="result-copy" x="548" y="479">used at decision time</text>

  <!-- Useful traces become reusable memory -->
  <path class="flow" d="M548 524V641"/>
  <rect x="494" y="567" width="108" height="24" rx="12" fill="#ffffff"/>
  <text x="548" y="584" text-anchor="middle" fill="#0f766e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="750">USEFUL TRACE</text>
  <g filter="url(#shadow)">
    <rect x="105" y="650" width="490" height="84" rx="18" fill="#ecfeff" stroke="#14b8a6" stroke-width="2.5"/>
  </g>
  <circle cx="146" cy="692" r="19" fill="#ccfbf1"/>
  <path d="M138 688a10 10 0 1 1 1 12M138 688v9h9" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="memory-title" x="178" y="687">Memory</text>
  <text class="memory-copy" x="178" y="712">Reviewed traces inform future resolution</text>
</svg>
