  <rect x="957" y="345" width="86" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1000" y="360" font-size="12" font-weight="600" fill="#1E3A5F" text-anchor="middle">HAS_SYSTEM</text>
  <path d="M1130,470 H1266" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="1146" y="445" width="108" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1200" y="460" font-size="12" font-weight="600" fill="#1E3A5F" text-anchor="middle">HAS_COMPONENT</text>
