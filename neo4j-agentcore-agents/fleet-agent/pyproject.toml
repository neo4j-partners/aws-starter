[project]
name = "neo4j-fleet-agent"
version = "0.1.0"
description = "Neo4j fleet agent — Strands, direct-to-Neo4j GraphRAG over an agent/ core"
requires-python = ">=3.10"
dependencies = [
    # Shared core — direct-to-Neo4j GraphRAG (no MCP, no Gateway)
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    "neo4j-graphrag[bedrock]>=1.16.0",
    "neo4j>=5.17.0",
    "boto3>=1.42.0",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Observability - ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.10.0",
    # Strands agent framework
    "strands-agents",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop) — it is never backgrounded by a script. The
# clients are thin wire callers. `fleet-server` defaults to port 7070 for
# local dev (AGENT_PORT still overrides); the cloud container uses
# runtime_app's __main__ (fixed 8080).
[project.scripts]
fleet-server = "runtime_app:main"
fleet-cli = "client.cli:main"
fleet-demo = "client.demo:main"
fleet-invoke = "client.invoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package the `agent` core plus `client` and the top-level `runtime_app`
# module into the venv so the console scripts resolve `runtime_app:main`
# and `client.*:main`, and runtime_app can `from agent import ...` without
# any sys.path manipulation. Deployment uses direct_code_deploy (it zips
# the source tree), so packaging client here only affects the local venv.
[tool.hatch.build.targets.wheel]
packages = ["agent", "client"]

[tool.hatch.build.targets.wheel.force-include]
"runtime_app.py" = "runtime_app.py"
