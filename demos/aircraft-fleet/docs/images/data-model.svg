  <rect x="1153" y="187" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1200" y="202" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">HAS_REMOVAL</text>
  <path d="M1400,280 V426" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1332" y="345" width="136" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1400" y="360" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">REMOVED_COMPONENT</text>
  <path d="M1400,560 V706" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1361" y="625" width="79" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1400" y="640" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">HAS_EVENT</text>
  <path d="M1270,745 H1200 V528 H1134" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1143" y="635" width="115" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1200" y="650" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">AFFECTS_SYSTEM</text>
  <path d="M1530,775 H1565 V122 H1000 V146" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1225" y="113" width="129" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1290" y="128" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">AFFECTS_AIRCRAFT</text>
  <rect x="870" y="990" width="260" height="130" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.0" y="1022" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">OperatingLimit</text>
  <text x="1000.0" y="1048" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">name, parameterName, regime</text>
  <text x="1000.0" y="1070" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">aircraftType, unit</text>
  <text x="1000.0" y="1092" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">minValue, maxValue</text>
  <path d="M1000,840 V986" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="964" y="895" width="72" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1000" y="910" font-size="12" font-weight="600" fill="#4A2EB0" text-anchor="middle">HAS_LIMIT</text>
  <rect x="70" y="430" width="260" height="174" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="90" y="460" font-size="16" font-weight="700" fill="#344054" text-anchor="start">Key</text>
  <rect x="90" y="470" width="22" height="16" rx="4" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="122" y="483" font-size="14" font-weight="400" fill="#344054" text-anchor="start">fleet structure</text>
  <rect x="90" y="494" width="22" height="16" rx="4" fill="#E8F6F2" stroke="#008C72" stroke-width="1.5"/>
  <text x="122" y="507" font-size="14" font-weight="400" fill="#344054" text-anchor="start">sensor telemetry</text>
  <rect x="90" y="518" width="22" height="16" rx="4" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="122" y="531" font-size="14" font-weight="400" fill="#344054" text-anchor="start">flight operations</text>
  <rect x="90" y="542" width="22" height="16" rx="4" fill="#FDF2FA" stroke="#C11574" stroke-width="1.5"/>
  <text x="122" y="555" font-size="14" font-weight="400" fill="#344054" text-anchor="start">maintenance and removals</text>
  <rect x="90" y="566" width="22" height="16" rx="4" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="122" y="579" font-size="14" font-weight="400" fill="#344054" text-anchor="start">operating limits</text>
  <text x="800" y="1180" font-size="15" font-weight="400" fill="#5C6470" text-anchor="middle">Arrows point in the relationship direction. The knowledge graph connects to Aircraft, System, Component, and OperatingLimit.</text>
  <text x="800" y="1204" font-size="15" font-weight="400" fill="#5C6470" text-anchor="middle">dual-graph.svg shows those links. Enrich links each OperatingLimit by FROM_CHUNK to the chunks that state it.</text>
</svg>
