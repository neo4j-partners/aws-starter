<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Enterprise knowledge layer reference architecture</title>
  <desc id="description">Source-system schemas and enterprise records form a schema graph and business ontology. Semantic links create an enterprise knowledge graph, which guides agent context, records execution history, and invokes native source queries and API calls.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#64748b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.2px; fill: #0f766e; }
      .title { font-size: 42px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 19px; fill: #475569; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #64748b; }
      .node-title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .node-copy { font-size: 16px; fill: #475569; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .center-title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .center-copy { font-size: 17px; fill: #334155; }
      .flow { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="48" y="38" width="1504" height="824" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="90" y="92" class="eyebrow">NEOCARTA · TECHNICAL REFERENCE</text>
  <text x="90" y="140" class="title">Enterprise Knowledge Layer</text>
  <text x="90" y="171" class="subtitle">Business meaning, technical metadata, and proven execution paths, connected without copying source data.</text>

  <text x="105" y="229" class="section">01 · INPUTS</text>
  <text x="606" y="229" class="section">02 · SEMANTIC FOUNDATION</text>
  <text x="1030" y="229" class="section">03 · AGENT EXECUTION</text>

  <!-- Flow edges sit behind nodes. -->
  <path d="M420 330H590" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M420 580H590" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M770 410V460" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M930 555H1010" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1230 622V666H408V706" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1230 622V666H902V706" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M624 766H710" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1094 766H1174" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1334 704V655Q1334 638 1317 638H1278" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/>
  <text x="946" y="452" class="flow">SEMANTIC LINKS</text>
  <text x="481" y="654" class="flow">DECISION CONTEXT</text>
  <text x="809" y="654" class="flow">PERSISTENT MEMORY</text>
  <text x="1360" y="680" class="flow">TRACE + FEEDBACK</text>

  <!-- Input nodes. -->
  <g filter="url(#shadow)">
    <rect x="105" y="265" width="315" height="130" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="105" y="515" width="315" height="130" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <rect x="126" y="284" width="95" height="24" rx="12" fill="#dbeafe"/>
  <text x="173" y="301" text-anchor="middle" class="small" fill="#1d4ed8">TECHNICAL</text>
  <text x="126" y="341" class="node-title">Source systems</text>
  <text x="126" y="370" class="node-copy">APIs · databases · warehouses</text>
  <text x="126" y="391" class="node-copy">documents · repositories</text>

  <rect x="126" y="534" width="91" height="24" rx="12" fill="#ede9fe"/>
  <text x="171" y="551" text-anchor="middle" class="small" fill="#6d28d9">BUSINESS</text>
  <text x="126" y="591" class="node-title">Enterprise records</text>
  <text x="126" y="620" class="node-copy">Documentation · data dictionary</text>
  <text x="126" y="641" class="node-copy">query logs · process &amp; audit data</text>

  <!-- Semantic foundation. -->
  <g filter="url(#shadow)">
    <rect x="590" y="265" width="340" height="145" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="590" y="460" width="340" height="145" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="1010" y="300" width="440" height="322" rx="22" fill="#ecfeff" stroke="#14b8a6" stroke-width="2.5"/>
  </g>
  <text x="620" y="314" class="node-title">Schema graph</text>
  <text x="620" y="344" class="node-copy">Sources → tables → columns</text>
  <text x="620" y="367" class="node-copy">APIs → operations → parameters</text>
  <text x="620" y="390" class="small">Metadata-only discovery</text>

  <text x="620" y="509" class="node-title">Business ontology</text>
  <text x="620" y="539" class="node-copy">Terms · processes · policies</text>
  <text x="620" y="562" class="node-copy">Domain-expert curation</text>
  <text x="620" y="585" class="small">Business-to-technical bindings</text>

  <rect x="1040" y="325" width="184" height="28" rx="14" fill="#ccfbf1"/>
  <text x="1132" y="344" text-anchor="middle" class="small" fill="#0f766e">SEMANTIC CONTROL PLANE</text>
  <g fill="#99f6e4" stroke="#0f766e" stroke-width="2">
    <circle cx="1082" cy="410" r="12"/><circle cx="1152" cy="382" r="12"/><circle cx="1228" cy="420" r="12"/><circle cx="1302" cy="388" r="12"/><circle cx="1360" cy="448" r="12"/><circle cx="1264" cy="488" r="12"/><circle cx="1164" cy="480" r="12"/>
    <path d="M1082 410L1152 382L1228 420L1302 388L1360 448L1264 488L1164 480L1082 410M1152 382L1164 480M1228 420L1264 488M1302 388L1264 488" fill="none"/>
  </g>
  <text x="1230" y="535" text-anchor="middle" class="center-title">Enterprise knowledge graph</text>
  <text x="1230" y="565" text-anchor="middle" class="center-copy">Semantics · metadata · provenance</text>
  <text x="1230" y="590" text-anchor="middle" class="center-copy">A traversable map for grounded decisions</text>

  <!-- Agent execution. -->
  <g filter="url(#shadow)">
    <rect x="192" y="706" width="432" height="120" rx="16" fill="#ecfdf5" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="710" y="706" width="384" height="120" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <rect x="1174" y="706" width="320" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  </g>
  <text x="220" y="751" class="node-title">Agent context &amp; routing</text>
  <text x="220" y="780" class="node-copy">Relevant sources, constraints, and</text>
  <text x="220" y="802" class="node-copy">native retrieval instructions</text>

  <text x="738" y="751" class="node-title">Execution history</text>
  <text x="738" y="780" class="node-copy">Traces · evidence · evaluations</text>
  <text x="738" y="802" class="node-copy">Path weights and expert rationale</text>

  <text x="1202" y="751" class="node-title">Native execution</text>
  <text x="1202" y="780" class="node-copy">SQL queries · API calls</text>
  <text x="1202" y="802" class="node-copy">Systems of record stay in place</text>
</svg>
