<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

  <!-- title -->
  <text x="480" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#0E2A33">Enterprise Knowledge Layer</text>

  <!-- outer container -->
  <rect x="110" y="102" width="740" height="390" rx="16" fill="#FFFFFF" stroke="#1B3139" stroke-width="2"/>

  <!-- consumers -->
  <g>
    <rect x="140" y="124" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.5"/>
    <text x="240" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600" fill="#1B3139">Apps</text>

    <rect x="380" y="124" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.5"/>
    <text x="480" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600" fill="#1B3139">Agents</text>

    <rect x="620" y="124" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.5"/>
    <text x="720" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600" fill="#1B3139">Tools</text>
  </g>

  <!-- bidirectional arrows into the knowledge layer -->
  <g stroke="#0E5A8A" stroke-width="2" fill="#0E5A8A">
    <line x1="228" y1="180" x2="228" y2="205"/><polygon points="228,212 224,203 232,203"/>
    <line x1="252" y1="212" x2="252" y2="187"/><polygon points="252,180 248,189 256,189"/>

    <line x1="468" y1="180" x2="468" y2="205"/><polygon points="468,212 464,203 472,203"/>
    <line x1="492" y1="212" x2="492" y2="187"/><polygon points="492,180 488,189 496,189"/>

    <line x1="708" y1="180" x2="708" y2="205"/><polygon points="708,212 704,203 712,203"/>
    <line x1="732" y1="212" x2="732" y2="187"/><polygon points="732,180 728,189 736,189"/>
  </g>

  <!-- knowledge layer panel -->
  <rect x="140" y="214" width="680" height="256" rx="12" fill="#F2F7FA" stroke="#1B3139" stroke-width="1.5"/>
  <text x="480" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#0E2A33">Enterprise Knowledge Layer</text>
  <text x="480" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A63">(In Agentic Era)</text>

  <!-- pillar 1: Ontologies -->
  <g>
    <rect x="165" y="284" width="190" height="36" rx="6" fill="#B7DF7A" stroke="#6FA82E" stroke-width="1.5"/>
    <text x="260" y="302" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1B3139">Ontology</text>

    <rect x="165" y="330" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="260" y="347" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Domain</text>

    <rect x="165" y="370" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="260" y="387" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Technical</text>

    <rect x="165" y="410" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="260" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Policy + process</text>
  </g>

  <!-- pillar 2: Data -->
  <g>
    <rect x="385" y="284" width="190" height="36" rx="6" fill="#B7DF7A" stroke="#6FA82E" stroke-width="1.5"/>
    <text x="480" y="302" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1B3139">Enterprise data</text>

    <rect x="385" y="330" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="480" y="347" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Reference</text>

    <rect x="385" y="370" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="480" y="387" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Domain data</text>

    <rect x="385" y="410" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="480" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Virtual Graphs</text>
  </g>

  <!-- pillar 3: Memory -->
  <g>
    <rect x="605" y="284" width="190" height="36" rx="6" fill="#B7DF7A" stroke="#6FA82E" stroke-width="1.5"/>
    <text x="700" y="302" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1B3139">Memory</text>

    <rect x="605" y="330" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="700" y="347" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Long &amp; Short Term</text>

    <rect x="605" y="370" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="700" y="387" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Procedural</text>

    <rect x="605" y="410" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.2"/>
    <text x="700" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1B3139">Context Graph</text>
  </g>

  <!-- caption -->
  <text x="480" y="530" text-anchor="middle" font-size="14" fill="#1B3139"><tspan font-weight="700">The Enterprise Knowledge Layer</tspan> provides the shared meaning and relational context</text>
  <text x="480" y="552" text-anchor="middle" font-size="14" fill="#1B3139">necessary for agents to move from simple pattern matching to accurate, grounded reasoning.</text>
</svg>
