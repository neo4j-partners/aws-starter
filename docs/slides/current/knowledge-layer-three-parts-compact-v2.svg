<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">Three peer components of the Knowledge Layer</title>
  <desc id="description">The Knowledge Layer ontology, Enterprise data, and Memory are three peer components that ground each request. Decision traces are contained within Memory.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { fill: #ccfbf1; font-size: 15px; font-weight: 750; letter-spacing: 1.7px; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 31px; font-weight: 750; text-anchor: middle; }
      .component-title { fill: #0f172a; font-size: 19px; font-weight: 750; text-anchor: middle; }
      .component-copy { fill: #475569; font-size: 15px; font-weight: 500; text-anchor: middle; }
      .trace-title { fill: #0f766e; font-size: 14px; font-weight: 750; text-anchor: middle; }
      .trace-copy { fill: #475569; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Knowledge Layer boundary -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="640" height="563" rx="24" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
    <path d="M54 30h592a24 24 0 0 1 24 24v106H30V54a24 24 0 0 1 24-24Z" fill="#0f766e"/>
  </g>
  <text class="eyebrow" x="350" y="75">ONE SHARED SUBSTRATE</text>
  <text class="layer-title" x="350" y="119">Knowledge Layer</text>
  <text x="350" y="145" text-anchor="middle" fill="#ccfbf1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15">Three components work together as peers</text>

  <!-- Peer component cards -->
  <g filter="url(#shadow)">
    <rect x="50" y="190" width="190" height="344" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="255" y="190" width="190" height="344" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="460" y="190" width="190" height="344" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>

  <!-- Knowledge Layer ontology -->
  <circle cx="145" cy="244" r="31" fill="#ccfbf1"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <line x1="127" y1="246" x2="147" y2="229"/>
    <line x1="127" y1="246" x2="149" y2="264"/>
    <line x1="147" y1="229" x2="166" y2="247"/>
    <line x1="149" y1="264" x2="166" y2="247"/>
    <circle cx="127" cy="246" r="5"/>
    <circle cx="147" cy="229" r="5"/>
    <circle cx="149" cy="264" r="5"/>
    <circle cx="166" cy="247" r="5"/>
  </g>
  <text class="component-title" x="145" y="304">Knowledge Layer</text>
  <text class="component-title" x="145" y="328">ontology</text>
  <line x1="79" y1="350" x2="211" y2="350" stroke="#ccfbf1" stroke-width="2"/>
  <text class="component-copy" x="145" y="382">Defines meaning,</text>
  <text class="component-copy" x="145" y="404">connections, mappings,</text>
  <text class="component-copy" x="145" y="426">rules + accountability</text>
  <rect x="76" y="466" width="138" height="39" rx="19" fill="#ecfeff"/>
  <text x="145" y="491" text-anchor="middle" fill="#0f766e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="750">WHAT IS POSSIBLE</text>

  <!-- Enterprise data -->
  <circle cx="350" cy="244" r="31" fill="#e2e8f0"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="2.5">
    <ellipse cx="350" cy="232" rx="20" ry="7"/>
    <path d="M330 232v28c0 5 9 8 20 8s20-3 20-8v-28"/>
    <path d="M330 246c0 5 9 8 20 8s20-3 20-8" fill="none"/>
  </g>
  <text class="component-title" x="350" y="304">Enterprise data</text>
  <line x1="284" y1="350" x2="416" y2="350" stroke="#e2e8f0" stroke-width="2"/>
  <text class="component-copy" x="350" y="382">Supplies authoritative</text>
  <text class="component-copy" x="350" y="404">facts from governed</text>
  <text class="component-copy" x="350" y="426">enterprise systems</text>
  <rect x="281" y="466" width="138" height="39" rx="19" fill="#f1f5f9"/>
  <text x="350" y="491" text-anchor="middle" fill="#475569" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="750">WHAT IS TRUE NOW</text>

  <!-- Memory, including decision traces -->
  <circle cx="555" cy="244" r="31" fill="#ccfbf1"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="538" y1="233" x2="554" y2="246"/>
    <line x1="561" y1="226" x2="554" y2="246"/>
    <line x1="573" y1="245" x2="554" y2="246"/>
    <line x1="559" y1="264" x2="554" y2="246"/>
    <line x1="538" y1="257" x2="554" y2="246"/>
    <line x1="538" y1="233" x2="561" y2="226"/>
    <line x1="561" y1="226" x2="573" y2="245"/>
    <line x1="573" y1="245" x2="559" y2="264"/>
    <line x1="559" y1="264" x2="538" y2="257"/>
    <circle cx="538" cy="233" r="4"/>
    <circle cx="561" cy="226" r="4"/>
    <circle cx="573" cy="245" r="4"/>
    <circle cx="559" cy="264" r="4"/>
    <circle cx="538" cy="257" r="4"/>
    <circle cx="554" cy="246" r="4.5"/>
  </g>
  <text class="component-title" x="555" y="304">Memory</text>
  <line x1="489" y1="350" x2="621" y2="350" stroke="#ccfbf1" stroke-width="2"/>
  <text class="component-copy" x="555" y="382">Captures actions,</text>
  <text class="component-copy" x="555" y="404">decisions, outcomes</text>
  <text class="component-copy" x="555" y="426">+ reasoning</text>
  <rect x="482" y="450" width="146" height="68" rx="13" fill="#ecfeff" stroke="#99f6e4" stroke-width="1.5"/>
  <text class="trace-title" x="555" y="476">DECISION TRACES</text>
  <text class="trace-copy" x="555" y="498">evidence · reasoning · result</text>

  <!-- Combined grounding -->
  <g fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M145 594v35q0 19 19 19h165"/>
    <path d="M350 594v54"/>
    <path d="M555 594v35q0 19-19 19H371"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="165" y="666" width="370" height="64" rx="32" fill="#ecfeff" stroke="#14b8a6" stroke-width="2.5"/>
  </g>
  <text x="350" y="706" text-anchor="middle" fill="#0f172a" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="750">Grounded request</text>
</svg>
