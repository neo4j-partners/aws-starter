  <text x="1420.0" y="207" font-size="18" font-weight="700" fill="#851651" text-anchor="middle">Memory database</text>
  <text x="1420.0" y="233" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">neo4j-agent-memory</text>
  <text x="1420.0" y="255" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">sessions, messages,</text>
  <text x="1420.0" y="277" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">entities, preferences</text>
  <text x="1420.0" y="299" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">kept apart from</text>
  <text x="1420.0" y="321" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the fleet graph</text>
