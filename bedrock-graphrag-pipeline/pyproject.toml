[project]
name = "bedrock-graphrag-pipeline"
version = "0.1.0"
description = "A GraphRAG ingestion pipeline on Amazon Bedrock: generate an operational graph, enrich it from unstructured documents with Titan embeddings and Claude entity extraction, and fuse the two into a single Neo4j knowledge graph"
requires-python = ">=3.11"
dependencies = [
    # generator
    "faker>=24.0.0",
    "numpy>=1.26.0",
    # loader + GraphRAG enrichment
    "neo4j>=5.17.0",
    # Bedrock is the default provider; openai kept as a fallback extra
    "neo4j-graphrag[openai,bedrock]>=1.16.0",
    # boto3 is also imported directly (agent_samples.py Bedrock path)
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    # shared
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.49.0",
    "neo4j-graphrag[anthropic]>=1.15.0",
]

[project.scripts]
generate-data = "generator.main:app"
populate-aircraft-db = "populate_aircraft_db.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator", "src/populate_aircraft_db"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
