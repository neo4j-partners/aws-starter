<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Supervisor Agent Request Flow</title>
  <desc>The client posts a question to the supervisor. The supervisor calls the Maintenance Agent, the Operations Agent, or both. The specialists query the Neo4j fleet graph directly with two graph tools. graph_query_tool writes read-only Cypher from the live schema with Text2Cypher. vector_search_tool runs hybrid vector and fulltext search over the manual chunks. It can filter the chunks by aircraft type. Only the Maintenance Agent has vector_search_tool. The Neo4j password comes from the .env file locally or from Secrets Manager in the cloud. A local run with the secret ARN set also reads the secret. Neo4j can reject the fleet login as Unauthorized. The driver then reads the secret again. It retries once, and only when the login changed. Memory lives in its own database. Neo4j can also reject the memory password. The request then reads that secret again and builds the agent once more.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="940" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Supervisor Agent Request Flow</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">The supervisor routes each question to one or both specialists. They query Neo4j directly with two graph tools.</text>
