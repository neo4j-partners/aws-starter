[project]
name = "neo4j-mcp-server"
version = "0.1.0"
description = "Neo4j MCP server deployment for Amazon Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "botocore[crt]",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "image"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
# The image entrypoint lives in image/ and deploy.py at the root, outside any package.
pythonpath = ["image", "."]
testpaths = ["tests"]
