<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">A Context Graph is what one request pulls out of the Knowledge Layer</title>
  <desc id="description">The standing Knowledge Layer, holding ontology, enterprise data, and memory, combines with the situation of a single request to assemble a Context Graph scoped to that request.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { fill: #ccfbf1; font-size: 15px; font-weight: 750; letter-spacing: 1.7px; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 31px; font-weight: 750; text-anchor: middle; }
      .component-title { fill: #0f172a; font-size: 20px; font-weight: 750; text-anchor: middle; }
      .component-copy { fill: #475569; font-size: 14.5px; font-weight: 500; text-anchor: middle; }
      .chip { fill: #0f766e; font-size: 13.5px; font-weight: 650; text-anchor: middle; }
      .badge-teal { fill: #0f766e; font-size: 13px; font-weight: 750; letter-spacing: 0.8px; text-anchor: middle; }
      .badge-slate { fill: #475569; font-size: 13px; font-weight: 750; letter-spacing: 0.8px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Input cards -->
  <g filter="url(#shadow)">
    <rect x="50" y="60" width="290" height="340" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="360" y="60" width="290" height="340" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- The standing Knowledge Layer -->
  <circle cx="195" cy="118" r="31" fill="#ccfbf1"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <line x1="177" y1="120" x2="197" y2="103"/>
    <line x1="177" y1="120" x2="199" y2="138"/>
    <line x1="197" y1="103" x2="216" y2="121"/>
    <line x1="199" y1="138" x2="216" y2="121"/>
    <circle cx="177" cy="120" r="5"/>
    <circle cx="197" cy="103" r="5"/>
    <circle cx="199" cy="138" r="5"/>
    <circle cx="216" cy="121" r="5"/>
  </g>
  <text class="component-title" x="195" y="184">Knowledge Layer</text>
  <line x1="95" y1="206" x2="295" y2="206" stroke="#ccfbf1" stroke-width="2"/>
  <rect x="85" y="226" width="220" height="34" rx="17" fill="#ecfeff"/>
  <text class="chip" x="195" y="248">Knowledge Layer ontology</text>
  <rect x="85" y="268" width="220" height="34" rx="17" fill="#ecfeff"/>
  <text class="chip" x="195" y="290">Enterprise data</text>
  <rect x="85" y="310" width="220" height="34" rx="17" fill="#ecfeff"/>
  <text class="chip" x="195" y="332">Memory</text>
  <rect x="105" y="356" width="180" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text class="badge-teal" x="195" y="378">STANDING · SHARED</text>

  <!-- The situation of one request -->
  <circle cx="505" cy="118" r="31" fill="#e2e8f0"/>
  <g fill="none" stroke="#475569" stroke-width="2.5">
    <circle cx="505" cy="118" r="18"/>
    <circle cx="505" cy="118" r="8"/>
    <circle cx="505" cy="118" r="2.5" fill="#475569"/>
  </g>
  <text class="component-title" x="505" y="184">This request&#8217;s situation</text>
  <line x1="405" y1="206" x2="605" y2="206" stroke="#e2e8f0" stroke-width="2"/>
  <text class="component-copy" x="505" y="243">The question actually asked</text>
  <text class="component-copy" x="505" y="271">The user and their permissions</text>
  <text class="component-copy" x="505" y="299">The task and workflow state</text>
  <text class="component-copy" x="505" y="327">Facts true at this moment</text>
  <rect x="415" y="356" width="180" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="badge-slate" x="505" y="378">PER REQUEST</text>

  <!-- Assembly -->
  <g fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round">
    <path d="M195 408v26q0 18 18 18h137"/>
    <path d="M505 408v26q0 18-18 18H350"/>
  </g>
  <circle cx="350" cy="452" r="5.5" fill="#0f766e"/>
  <path d="M350 452v24" fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="490" width="600" height="240" rx="24" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
    <path d="M74 490h552a24 24 0 0 1 24 24v76H50v-76a24 24 0 0 1 24-24Z" fill="#0f766e"/>
  </g>
  <text class="eyebrow" x="350" y="530">ASSEMBLED, THEN DISCARDED</text>
  <text class="layer-title" x="350" y="572">Context Graph</text>
  <text x="350" y="634" text-anchor="middle" fill="#475569" font-size="15" font-weight="500">The slice of the layer this request is allowed to use</text>
  <rect x="175" y="658" width="350" height="52" rx="26" fill="#ecfeff" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="350" y="692" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="750">What matters right now?</text>
</svg>
