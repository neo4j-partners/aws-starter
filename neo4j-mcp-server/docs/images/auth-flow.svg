<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Authentication Flow</title>
  <desc>An agent gets an M2M token from Cognito. The Gateway validates it, swaps it for a Runtime token from the OAuth2 credential provider, and forwards the request. The Runtime validates that token and the MCP server queries Neo4j.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1360" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Authentication Flow</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">Two JWT checks: one at the Gateway and one at the Runtime</text>
  <rect x="20" y="210" width="1560" height="180" rx="12" fill="#FFF7ED" fill-opacity="0.75" stroke="#D97706" stroke-opacity="0.35"/>
  <rect x="20" y="406" width="1560" height="180" rx="12" fill="#EEF4FB" fill-opacity="0.75" stroke="#2E6DB4" stroke-opacity="0.35"/>
  <rect x="20" y="602" width="1560" height="418" rx="12" fill="#F3F0FF" fill-opacity="0.75" stroke="#7A5AF8" stroke-opacity="0.35"/>
  <rect x="20" y="1036" width="1560" height="288" rx="12" fill="#E8F6F2" fill-opacity="0.75" stroke="#008C72" stroke-opacity="0.35"/>
  <line x1="125" y1="171" x2="125" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="30" y="115" width="190" height="56" rx="12" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="149" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">AI agent</text>
  <line x1="350" y1="171" x2="350" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="255" y="115" width="190" height="56" rx="12" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="149" font-size="17" font-weight="700" fill="#8A4B08" text-anchor="middle">Cognito</text>
  <line x1="575" y1="171" x2="575" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="480" y="115" width="190" height="56" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="149" font-size="17" font-weight="700" fill="#1E3A5F" text-anchor="middle">Gateway</text>
  <line x1="800" y1="171" x2="800" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="705" y="115" width="190" height="56" rx="12" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="149" font-size="17" font-weight="700" fill="#4A2EB0" text-anchor="middle">OAuth2 provider</text>
  <line x1="1025" y1="171" x2="1025" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="930" y="115" width="190" height="56" rx="12" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="149" font-size="17" font-weight="700" fill="#00594A" text-anchor="middle">Runtime</text>
  <line x1="1250" y1="171" x2="1250" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="1155" y="115" width="190" height="56" rx="12" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1250" y="149" font-size="17" font-weight="700" fill="#00594A" text-anchor="middle">MCP server</text>
  <line x1="1475" y1="171" x2="1475" y2="1340" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="1380" y="115" width="190" height="56" rx="12" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1475" y="149" font-size="17" font-weight="700" fill="#851651" text-anchor="middle">Neo4j</text>
  <rect x="28" y="218" width="183" height="28" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="40" y="237" font-size="15" font-weight="700" fill="#8A4B08" text-anchor="start">1. Get an M2M token</text>
  <rect x="28" y="414" width="183" height="28" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="40" y="433" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="start">2. Call the Gateway</text>
  <rect x="28" y="610" width="201" height="28" rx="14" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="40" y="629" font-size="15" font-weight="700" fill="#4A2EB0" text-anchor="start">3. Gateway to Runtime</text>
  <rect x="28" y="1044" width="158" height="28" rx="14" fill="#FFFFFF" stroke="#008C72" stroke-width="1.5"/>
  <text x="40" y="1063" font-size="15" font-weight="700" fill="#00594A" text-anchor="start">4. Run the query</text>
  <path d="M125 308 H346" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="166" y="263" width="144" height="21" rx="5" fill="#F7F8FA"/>
  <text x="237.5" y="278" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">POST /oauth2/token</text>
  <rect x="140" y="283" width="194" height="21" rx="5" fill="#F7F8FA"/>
  <text x="237.5" y="298" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">grant: client_credentials</text>
  <path d="M350 362 H129" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-orange)"/>
  <rect x="166" y="337" width="144" height="21" rx="5" fill="#F7F8FA"/>
  <text x="237.5" y="352" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">access token (JWT)</text>
  <path d="M125 504 H571" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="303" y="459" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="350.0" y="474" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">MCP request</text>
  <rect x="253" y="479" width="194" height="21" rx="5" fill="#F7F8FA"/>
  <text x="350.0" y="494" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Authorization: Bearer JWT</text>
  <path d="M575 534 H619 V564 H579" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="626" y="527" width="100" height="21" rx="5" fill="#F7F8FA"/>
  <text x="633" y="542" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="start">validate JWT</text>
  <rect x="626" y="547" width="165" height="21" rx="5" fill="#F7F8FA"/>
  <text x="633" y="562" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="start">allowed client + JWKS</text>
  <path d="M575 678 H796" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="608" y="653" width="158" height="21" rx="5" fill="#F7F8FA"/>
  <text x="687.5" y="668" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">get token for target</text>
  <path d="M800 754 H354" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="503" y="709" width="144" height="21" rx="5" fill="#F7F8FA"/>
  <text x="575.0" y="724" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">client_credentials</text>
  <rect x="482" y="729" width="187" height="21" rx="5" fill="#F7F8FA"/>
  <text x="575.0" y="744" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">scope {stack}-mcp/invoke</text>
  <path d="M350 808 H796" fill="none" stroke="#7A5AF8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-purple)"/>
  <rect x="525" y="783" width="100" height="21" rx="5" fill="#F7F8FA"/>
  <text x="575.0" y="798" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">access token</text>
  <path d="M800 862 H579" fill="none" stroke="#7A5AF8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-purple)"/>
  <rect x="634" y="837" width="108" height="21" rx="5" fill="#F7F8FA"/>
  <text x="687.5" y="852" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">Runtime token</text>
  <path d="M575 938 H1021" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="753" y="893" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="800.0" y="908" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">MCP request</text>
  <rect x="721" y="913" width="158" height="21" rx="5" fill="#F7F8FA"/>
  <text x="800.0" y="928" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">Bearer Runtime token</text>
  <path d="M1025 968 H1069 V998 H1029" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="1076" y="961" width="100" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1083" y="976" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="start">validate JWT</text>
  <rect x="1076" y="981" width="165" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1083" y="996" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="start">allowed client + JWKS</text>
  <path d="M1025 1112 H1246" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="1080" y="1087" width="115" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1137.5" y="1102" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">POST :8000/mcp</text>
  <path d="M1250 1188 H1471" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="1298" y="1143" width="129" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1362.5" y="1158" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">read-only Cypher</text>
  <rect x="1251" y="1163" width="223" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1362.5" y="1178" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">password from Secrets Manager</text>
  <path d="M1475 1242 H1254" fill="none" stroke="#008C72" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-teal)"/>
  <rect x="1330" y="1217" width="64" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1362.5" y="1232" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">results</text>
  <path d="M1250 1296 H129" fill="none" stroke="#008C72" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-teal)"/>
  <rect x="500" y="1271" width="374" height="21" rx="5" fill="#F7F8FA"/>
  <text x="687.5" y="1286" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">MCP response, back through the Runtime and Gateway</text>
</svg>
