<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Fleet Deployment Topology</title>
  <desc>One stack in one AWS account. AgentCore-fleetsupervisor-default holds the supervisor Runtime, which runs the supervisor and both specialists. The Runtime reads the fleet graph and the memory database with direct Neo4j drivers. It calls Claude and Titan on Bedrock and reads both Neo4j logins from Secrets Manager at startup. Each secret holds a username and a password. When Neo4j rejects a password, the Runtime reads that secret again. Two Neo4j Aura databases hold the fleet graph and agent memory.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="640" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Fleet Deployment Topology</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">One stack, two Neo4j databases. The Runtime reads both Neo4j passwords from Secrets Manager.</text>
  <rect x="30" y="120" width="360" height="490" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="152" font-size="17" font-weight="700" fill="#344054" text-anchor="start">Developer machine, in order</text>
  <rect x="50" y="175" width="320" height="128" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="207" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">1  Load the graph</text>
  <text x="210.0" y="233" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">pipeline/setup.sh</text>
  <text x="210.0" y="255" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fleet graph, manual chunks,</text>
  <text x="210.0" y="277" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">vector + fulltext indexes</text>
  <rect x="50" y="323" width="320" height="128" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="355" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">2  Supervisor agent</text>
  <text x="210.0" y="381" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor-agent/agent.sh deploy</text>
  <text x="210.0" y="403" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j settings and secret ARNs</text>
  <text x="210.0" y="425" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">from ../.env</text>
  <rect x="50" y="471" width="320" height="118" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="210.0" y="503" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Teardown</text>
  <text x="210.0" y="529" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor-agent/agent.sh destroy</text>
  <text x="210.0" y="551" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">removes the Runtime and its logs</text>
  <rect x="410" y="120" width="830" height="490" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="430" y="152" font-size="17" font-weight="700" fill="#8A4B08" text-anchor="start">AWS account, us-east-1</text>
  <rect x="440" y="170" width="770" height="242" rx="14" fill="#FAFCFF" stroke="#2E6DB4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="460" y="198" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="start">AgentCore-fleetsupervisor-default (AgentCore CLI)</text>
  <rect x="460" y="215" width="340" height="185" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="247" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Runtime settings</text>
  <text x="630.0" y="273" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">from agentcore/cdk/lib/cdk-stack.ts</text>
  <text x="630.0" y="295" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">NEO4J_* and MEM_NEO4J_* vars</text>
  <text x="630.0" y="317" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">copied from ../.env at deploy</text>
  <text x="630.0" y="339" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">role reads only the two secrets</text>
  <rect x="830" y="215" width="360" height="185" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010.0" y="247" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">supervisor Runtime</text>
  <text x="1010.0" y="273" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">CodeZip, Python 3.12, arm64</text>
  <text x="1010.0" y="295" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor and both specialists</text>
  <text x="1010.0" y="317" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">direct Neo4j drivers</text>
  <text x="1010.0" y="339" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">port 8080</text>
  <rect x="460" y="455" width="340" height="130" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="487" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Secrets Manager</text>
  <text x="630.0" y="513" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fleet and memory passwords</text>
  <text x="630.0" y="535" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">JSON with username and password</text>
  <text x="630.0" y="557" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">read at startup, again on rejection</text>
  <rect x="830" y="455" width="360" height="130" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010.0" y="487" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Amazon Bedrock</text>
  <text x="1010.0" y="513" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Claude Sonnet 5.5</text>
  <text x="1010.0" y="535" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Titan Text Embeddings v2</text>
  <text x="1010.0" y="557" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">1024 dimensions</text>
  <path d="M1010,400 V451" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <path d="M900,400 V433 H630 V451" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="706" y="415" width="117" height="21" rx="5" fill="#F7F8FA"/>
  <text x="765" y="438" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">GetSecretValue</text>
  <rect x="1270" y="120" width="300" height="490" rx="14" fill="#FFFFFF" stroke="#008C72" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1290" y="152" font-size="17" font-weight="700" fill="#00594A" text-anchor="start">Neo4j Aura</text>
  <rect x="1290" y="175" width="260" height="190" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1420.0" y="207" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">Fleet graph</text>
  <text x="1420.0" y="233" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">operational graph</text>
  <text x="1420.0" y="255" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">knowledge graph</text>
  <text x="1420.0" y="277" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">loaded by the pipeline</text>
  <text x="1420.0" y="299" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the supervisor only reads it</text>
  <rect x="1290" y="395" width="260" height="195" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1420.0" y="427" font-size="18" font-weight="700" fill="#851651" text-anchor="middle">Memory database</text>
  <text x="1420.0" y="453" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">neo4j-agent-memory</text>
  <text x="1420.0" y="475" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">sessions, messages,</text>
  <text x="1420.0" y="497" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">entities, preferences</text>
  <text x="1420.0" y="519" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">kept apart from</text>
  <text x="1420.0" y="541" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the fleet graph</text>
  <path d="M1190,260 H1286" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="1216" y="237" width="45" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1238" y="252" font-size="12" font-weight="600" fill="#00594A" text-anchor="middle">read</text>
  <path d="M1190,360 H1240 V480 H1286" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1184" y="430" width="104" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1236" y="445" font-size="12" font-weight="600" fill="#851651" text-anchor="middle">read and write</text>
</svg>
