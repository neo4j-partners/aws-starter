<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="640" fill="#f4f6f8"/>

  <!-- Title -->
  <text x="490" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#263238">Neo4j MCP Server on Amazon Bedrock AgentCore</text>
  <text x="490" y="64" text-anchor="middle" font-size="14" fill="#607d8b">Simplified High-Level Architecture</text>

  <!-- AWS Cloud grouping box -->
  <rect x="300" y="100" width="500" height="500" rx="16" fill="#eef4fb" stroke="#1976d2" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="320" y="128" font-size="16" font-weight="700" fill="#1565c0">AWS Cloud</text>

  <!-- Client: AI Agent -->
  <g filter="url(#shadow)">
    <rect x="50" y="280" width="190" height="90" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  </g>
  <text x="145" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#4527a0">AI Agent</text>
  <text x="145" y="338" text-anchor="middle" font-size="12" fill="#5e35b1">Claude / Strands</text>
  <text x="145" y="354" text-anchor="middle" font-size="12" fill="#5e35b1">(client)</text>

  <!-- Amazon Cognito -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="200" height="80" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  </g>
  <text x="450" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Amazon Cognito</text>
  <text x="450" y="204" text-anchor="middle" font-size="12" fill="#ef6c00">Authentication</text>
  <text x="450" y="219" text-anchor="middle" font-size="12" fill="#ef6c00">(M2M JWT)</text>

  <!-- AgentCore Gateway -->
  <g filter="url(#shadow)">
    <rect x="350" y="300" width="200" height="80" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  </g>
  <text x="450" y="333" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">AgentCore Gateway</text>
  <text x="450" y="354" text-anchor="middle" font-size="12" fill="#1976d2">JWT Authorizer</text>
  <text x="450" y="369" text-anchor="middle" font-size="12" fill="#1976d2">+ Routing</text>

  <!-- AgentCore Runtime + Container -->
  <g filter="url(#shadow)">
    <rect x="600" y="430" width="180" height="130" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  </g>
  <text x="690" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">AgentCore Runtime</text>
  <text x="690" y="476" text-anchor="middle" font-size="11" fill="#2e7d32">MicroVM Isolation</text>
  <rect x="620" y="490" width="140" height="56" rx="10" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="690" y="513" text-anchor="middle" font-size="13" font-weight="600" fill="#2e7d32">Neo4j MCP Server</text>
  <text x="690" y="531" text-anchor="middle" font-size="11" fill="#43a047">Container · Port 8000</text>

  <!-- External: Neo4j Database -->
  <g filter="url(#shadow)">
    <path d="M850 440 a90 18 0 0 1 90 18 v84 a90 18 0 0 1 -180 0 v-84 a90 18 0 0 1 90 -18 z" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
    <ellipse cx="850" cy="458" rx="90" ry="18" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  </g>
  <text x="850" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Neo4j Database</text>
  <text x="850" y="514" text-anchor="middle" font-size="11" fill="#546e7a">External</text>
  <text x="850" y="529" text-anchor="middle" font-size="11" fill="#546e7a">Aura / Self-hosted</text>

  <!-- ============ FLOW ARROWS ============ -->

  <!-- 1: Agent -> Cognito (get JWT) -->
  <path d="M205 282 C 250 220, 300 200, 348 195" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="218" y="206" width="118" height="22" rx="6" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="277" y="221" text-anchor="middle" font-size="12" fill="#37474f">1. Request JWT</text>

  <!-- 2: Cognito -> Agent (JWT token) -->
  <path d="M348 215 C 290 250, 250 270, 210 290" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowReturn)"/>
  <rect x="232" y="251" width="120" height="22" rx="6" fill="#ffffff" stroke="#c8e6c9"/>
  <text x="292" y="266" text-anchor="middle" font-size="12" fill="#2e7d32">2. M2M JWT token</text>

  <!-- 3: Agent -> Gateway (MCP request + JWT) -->
  <path d="M242 333 L 345 335" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="246" y="298" width="92" height="22" rx="6" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="292" y="313" text-anchor="middle" font-size="11" fill="#37474f">3. MCP + JWT</text>

  <!-- Gateway validates JWT with Cognito (dotted, supporting) -->
  <path d="M450 298 L 450 234" fill="none" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="460" y="270" font-size="11" fill="#78909c">validate JWT</text>

  <!-- 4: Gateway -> Runtime (forward request) -->
  <path d="M500 382 C 540 410, 580 425, 615 435" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="396" width="116" height="22" rx="6" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="558" y="411" text-anchor="middle" font-size="12" fill="#37474f">4. Forward request</text>

  <!-- 5: MCP -> Neo4j (Cypher queries) -->
  <path d="M762 506 C 800 502, 815 500, 805 480" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="745" y="556" width="130" height="22" rx="6" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="810" y="571" text-anchor="middle" font-size="12" fill="#37474f">5. Cypher queries</text>

  <!-- 6: Neo4j -> MCP (results) -->
  <path d="M895 480 C 905 510, 890 522, 762 522" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowReturn)"/>
  <text x="828" y="600" text-anchor="middle" font-size="12" fill="#2e7d32">6. Results flow back to Agent</text>

  <!-- Legend -->
  <g transform="translate(50, 470)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#455a64">Legend</text>
    <rect x="0" y="12" width="16" height="12" rx="3" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="24" y="22" font-size="12" fill="#455a64">Client</text>
    <rect x="0" y="34" width="16" height="12" rx="3" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="24" y="44" font-size="12" fill="#455a64">AWS Cloud service</text>
    <rect x="0" y="56" width="16" height="12" rx="3" fill="#eceff1" stroke="#455a64"/>
    <text x="24" y="66" font-size="12" fill="#455a64">External system</text>
    <line x1="0" y1="84" x2="20" y2="84" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="28" y="88" font-size="12" fill="#455a64">Request</text>
    <line x1="92" y1="84" x2="112" y2="84" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowReturn)"/>
    <text x="120" y="88" font-size="12" fill="#455a64">Response</text>
  </g>
</svg>
