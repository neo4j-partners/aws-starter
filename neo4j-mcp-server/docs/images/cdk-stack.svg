<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>CDK Stack Resources</title>
  <desc>The resources in cdk/neo4j_mcp_stack.py and the order CloudFormation creates them in. The Gateway target is created last, after the Runtime reports ready and the OAuth2 credential provider exists.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1520" height="1040" fill="#F7F8FA"/>
  <text x="760" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">CDK Stack Resources</text>
  <text x="760" y="84" text-anchor="middle" font-size="17" fill="#5C6470">cdk/neo4j_mcp_stack.py: what it creates and what each piece waits on</text>
  <rect x="60" y="120" width="400" height="210" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="152" font-size="18" font-weight="700" fill="#344054" text-anchor="start">Stack parameters</text>
  <text x="82" y="172" font-size="12.5" font-weight="600" fill="#667085" text-anchor="start" font-family="Menlo, Consolas, monospace">CfnParameter</text>
  <text x="82" y="200" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">EcrImageUri</text>
  <text x="82" y="222" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">Neo4jUri, Neo4jDatabase, Neo4jUsername</text>
  <text x="82" y="244" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">Neo4jPasswordSecretArn</text>
  <text x="82" y="266" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">NetworkMode (PUBLIC or PRIVATE)</text>
  <rect x="550" y="120" width="400" height="210" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="152" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="start">Cognito</text>
  <text x="572" y="172" font-size="12.5" font-weight="600" fill="#D97706" text-anchor="start" font-family="Menlo, Consolas, monospace">aws_cognito</text>
  <text x="572" y="200" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">User pool, no self sign-up</text>
  <text x="572" y="222" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Domain {stack}-{account}</text>
  <text x="572" y="244" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Resource server, scope {stack}-mcp/invoke</text>
  <text x="572" y="266" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Machine client, client_credentials</text>
  <text x="572" y="288" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Access tokens valid for 24 hours</text>
  <rect x="1040" y="120" width="400" height="210" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062" y="152" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="start">IAM roles</text>
  <text x="1062" y="172" font-size="12.5" font-weight="600" fill="#7A5AF8" text-anchor="start" font-family="Menlo, Consolas, monospace">aws_iam</text>
  <text x="1062" y="200" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Agent execution role (Runtime)</text>
  <text x="1062" y="222" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Gateway execution role (Gateway)</text>
  <text x="1062" y="244" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Custom resource role (both Lambdas)</text>
  <text x="1062" y="266" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Least privilege, scoped to the Runtime ARN</text>
  <rect x="60" y="420" width="400" height="170" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="452" font-size="18" font-weight="700" fill="#00594A" text-anchor="start">AgentCore Runtime</text>
  <text x="82" y="472" font-size="12.5" font-weight="600" fill="#008C72" text-anchor="start" font-family="Menlo, Consolas, monospace">CfnRuntime</text>
  <text x="82" y="500" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">MCP protocol, JWT authorizer</text>
  <text x="82" y="522" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">mcp-neo4j-cypher on port 8000</text>
  <text x="82" y="544" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">NEO4J_READ_ONLY=true</text>
  <rect x="550" y="420" width="400" height="170" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="452" font-size="18" font-weight="700" fill="#851651" text-anchor="start">OAuth2 credential provider</text>
  <text x="572" y="472" font-size="12.5" font-weight="600" fill="#C11574" text-anchor="start" font-family="Menlo, Consolas, monospace">Custom resource + Lambda</text>
  <text x="572" y="500" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Lambda {stack}-oauth-provider</text>
  <text x="572" y="522" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Creates the AgentCore Identity provider</text>
  <text x="572" y="544" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Returns ProviderArn</text>
  <rect x="1040" y="420" width="400" height="170" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062" y="452" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="start">AgentCore Gateway</text>
  <text x="1062" y="472" font-size="12.5" font-weight="600" fill="#2E6DB4" text-anchor="start" font-family="Menlo, Consolas, monospace">CfnGateway</text>
  <text x="1062" y="500" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">MCP protocol, version 2025-03-26</text>
  <text x="1062" y="522" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">CUSTOM_JWT authorizer</text>
  <text x="1062" y="544" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Same machine client as the Runtime</text>
  <rect x="60" y="680" width="400" height="150" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="712" font-size="18" font-weight="700" fill="#851651" text-anchor="start">Runtime health check</text>
  <text x="82" y="732" font-size="12.5" font-weight="600" fill="#C11574" text-anchor="start" font-family="Menlo, Consolas, monospace">Custom resource + Lambda</text>
  <text x="82" y="760" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Lambda {stack}-runtime-health-check</text>
  <text x="82" y="782" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Waits until the Runtime is ready</text>
  <rect x="1100" y="680" width="380" height="170" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122" y="712" font-size="18" font-weight="700" fill="#344054" text-anchor="start">Stack outputs (13)</text>
  <text x="1122" y="732" font-size="12.5" font-weight="600" fill="#667085" text-anchor="start" font-family="Menlo, Consolas, monospace">CfnOutput</text>
  <text x="1122" y="760" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Gateway URL, ID, and target name</text>
  <text x="1122" y="782" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Cognito pool, client, token URL, scope</text>
  <text x="1122" y="804" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Runtime ID, ARN, and invocation URL</text>
  <text x="1122" y="826" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Agent and Gateway role ARNs</text>
  <rect x="550" y="860" width="400" height="150" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="892" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="start">Gateway target</text>
  <text x="572" y="912" font-size="12.5" font-weight="600" fill="#2E6DB4" text-anchor="start" font-family="Menlo, Consolas, monospace">CfnGatewayTarget</text>
  <text x="572" y="940" font-size="13" font-weight="400" fill="#5C6470" text-anchor="start" font-family="Menlo, Consolas, monospace">neo4j-mcp-server-target</text>
  <text x="572" y="962" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Endpoint: Runtime invocation URL</text>
  <text x="572" y="984" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">OAUTH: ProviderArn + mcp/invoke scope</text>
  <path d="M260 330 V420" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="90" y="366" width="165" height="21" rx="5" fill="#F7F8FA"/>
  <text x="248" y="381" font-size="13" font-weight="600" fill="#344054" text-anchor="end">image, Neo4j settings</text>
  <path d="M550 290 H505 V385 H380 V420" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="385" y="362" width="115" height="21" rx="5" fill="#F7F8FA"/>
  <text x="442" y="377" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">allowed client</text>
  <path d="M750 330 V420" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="755" y="366" width="187" height="21" rx="5" fill="#F7F8FA"/>
  <text x="762" y="381" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="start">client ID, discovery URL</text>
  <path d="M950 290 H995 V385 H1120 V420" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="1001" y="362" width="115" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1058" y="377" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">allowed client</text>
  <path d="M260 590 V680" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="265" y="626" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="272" y="641" font-size="13" font-weight="600" fill="#00594A" text-anchor="start">Runtime ARN</text>
  <path d="M460 755 H505 V935 H550" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="505" y="830" width="50" height="21" rx="5" fill="#F7F8FA"/>
  <text x="512" y="845" font-size="13" font-weight="600" fill="#851651" text-anchor="start">ready</text>
  <path d="M750 590 V860" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="755" y="715" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="762" y="730" font-size="13" font-weight="600" fill="#851651" text-anchor="start">ProviderArn</text>
  <path d="M1070 590 V935 H950" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="929" y="715" width="136" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1058" y="730" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="end">GatewayIdentifier</text>
</svg>
