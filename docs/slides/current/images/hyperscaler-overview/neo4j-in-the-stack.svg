<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Where Neo4j fits in the stack</title>
  <desc id="description">The same six-layer stack with the Neo4j role on each layer: apps and coding through MCP, the Neo4j MCP Server and Agent Memory for agents, a customer-owned context graph, and a graph built from lakehouse tables.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .canvas { fill: #ffffff; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 2.5px; fill: #64748b; }
      .title { font-size: 40px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 21px; fill: #475569; }
      .head { fill: #0f172a; }
      .head-text { font-size: 22px; font-weight: 750; fill: #ffffff; }
      .label { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .label-text { font-size: 21px; font-weight: 750; fill: #0f172a; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cell-iceberg { fill: #ecfeff; stroke: #14b8a6; stroke-width: 2; }
      .cell-delta { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .cell-text { font-size: 19px; font-weight: 600; fill: #334155; }
      .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .layer-name { font-size: 24px; font-weight: 750; fill: #0f172a; }
      .ai-chip { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .data-chip { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; }
      .gov { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .gov-chip { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .chip-text { font-size: 20px; font-weight: 620; fill: #1e293b; }
      .pill-text { font-size: 15px; font-weight: 750; }
      .legend-text { font-size: 17px; font-weight: 600; fill: #475569; }
      .foot { font-size: 18px; fill: #475569; }
      .layer-dim { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; }
      .layer-name-dim { font-size: 24px; font-weight: 750; fill: #94a3b8; }
      .neo-chip { fill: #ecfeff; stroke: #14b8a6; stroke-width: 2; }
      .neo-chip-strong { fill: #ccfbf1; stroke: #0d9488; stroke-width: 3; }
      .neo-text { font-size: 21px; font-weight: 680; fill: #0c4a6e; }
      .dim-text { font-size: 20px; font-style: italic; fill: #94a3b8; }
      .gov-dim { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 8 6; }
      .gov-chip-dim { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="60" y="92">Where Neo4j Fits in the Stack</text>
  <text class="subtitle" x="60" y="130">A graph adds connected context to the AI layers and the lakehouse. The vendor keeps the rest.</text>
  <text class="eyebrow" x="60" y="200">AI LAYERS</text>
  <rect class="layer" x="60" y="216" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="267.4">Apps</tspan></text>
  <rect class="neo-chip" x="380" y="234" width="840" height="50" rx="12"/>
  <text class="neo-text" text-anchor="middle"><tspan x="800" y="266.4">Chat and coding tools reach the graph through MCP</tspan></text>
  <rect class="layer" x="60" y="312" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="363.4">Agents</tspan></text>
  <rect class="neo-chip" x="380" y="330" width="840" height="50" rx="12"/>
  <text class="neo-text" text-anchor="middle"><tspan x="800" y="362.4">Neo4j MCP Server for graph queries, Neo4j Agent Memory</tspan></text>
  <rect class="layer" x="60" y="408" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="459.4">Context</tspan></text>
  <rect class="neo-chip-strong" x="380" y="426" width="840" height="50" rx="12"/>
  <text class="neo-text" text-anchor="middle"><tspan x="800" y="458.4">A customer-owned context graph across all five clouds</tspan></text>
  <text class="eyebrow" x="60" y="540">DATA LAYERS</text>
  <rect class="layer-dim" x="60" y="556" width="1190" height="86" rx="16"/>
  <text class="layer-name-dim" text-anchor="start"><tspan x="92" y="607.4">Operational data</tspan></text>
  <text class="dim-text" text-anchor="start"><tspan x="380" y="606.0">Stays with the vendor</tspan></text>
  <rect class="layer" x="60" y="652" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="703.4">Lakehouse</tspan></text>
  <rect class="neo-chip" x="380" y="670" width="840" height="50" rx="12"/>
  <text class="neo-text" text-anchor="middle"><tspan x="800" y="702.4">A graph built from lakehouse tables adds the links</tspan></text>
  <rect class="layer-dim" x="60" y="748" width="1190" height="86" rx="16"/>
  <text class="layer-name-dim" text-anchor="start"><tspan x="92" y="799.4">Infrastructure</tspan></text>
  <text class="dim-text" text-anchor="start"><tspan x="380" y="798.0">Stays with the vendor</tspan></text>
  <text class="eyebrow" x="1284" y="200">ACROSS EVERY LAYER</text>
  <rect class="gov-dim" x="1284" y="216" width="256" height="618" rx="16"/>
  <text class="layer-name-dim" text-anchor="middle"><tspan x="1412" y="259.4">Agent</tspan><tspan x="1412" y="289.4">governance</tspan></text>
  <rect class="gov-chip-dim" x="1316" y="356" width="192" height="60" rx="12"/>
  <text class="dim-text" text-anchor="middle"><tspan x="1412" y="393.0">Identity</tspan></text>
  <rect class="gov-chip-dim" x="1316" y="476" width="192" height="60" rx="12"/>
  <text class="dim-text" text-anchor="middle"><tspan x="1412" y="513.0">Registry</tspan></text>
  <rect class="gov-chip-dim" x="1316" y="596" width="192" height="60" rx="12"/>
  <text class="dim-text" text-anchor="middle"><tspan x="1412" y="633.0">Gateway</tspan></text>
  <rect class="gov-chip-dim" x="1316" y="716" width="192" height="60" rx="12"/>
  <text class="dim-text" text-anchor="middle"><tspan x="1412" y="753.0">Policy</tspan></text>
</svg>
