<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Fleet Operational Data Model</title>
  <desc>The operational graph that populate-aircraft-db loads from the generator's CSVs and stamp. It has twelve node labels and fourteen relationship types. Aircraft have systems. Systems have components and sensors. Sensors have hourly readings. Each sensor links by HAS_LIMIT to the operating limits of its aircraft's model. Components have maintenance events. Each event also points at its system and its aircraft. Aircraft operate flights between airports. Flights can have delays. Aircraft have removals. Each removal points at the component it removed. One Dataset node records the generator stamp.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1240" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Fleet Operational Data Model</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">Twelve node labels and fourteen relationship types, loaded from the generator&#x27;s CSV files and stamp.</text>
  <rect x="70" y="150" width="260" height="130" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.0" y="182" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Airport</text>
  <text x="200.0" y="208" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">iata, icao, name</text>
  <text x="200.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">city, country</text>
  <text x="200.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">lat, lon</text>
  <rect x="470" y="150" width="260" height="130" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="600.0" y="182" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Flight</text>
  <text x="600.0" y="208" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">flight_number, operator, origin</text>
  <text x="600.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">destination, scheduled_departure</text>
  <text x="600.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">scheduled_arrival</text>
  <rect x="870" y="150" width="260" height="130" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.0" y="182" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Aircraft</text>
  <text x="1000.0" y="208" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">tail_number, icao24</text>
  <text x="1000.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">model, manufacturer</text>
  <text x="1000.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">operator</text>
  <rect x="1270" y="150" width="260" height="130" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1400.0" y="182" font-size="18" font-weight="700" fill="#851651" text-anchor="middle">Removal</text>
  <text x="1400.0" y="208" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">reason, removal_date</text>
  <text x="1400.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">part_number, serial_number</text>
  <text x="1400.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">flight_hours_at_removal</text>
  <rect x="470" y="430" width="260" height="130" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="600.0" y="462" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Delay</text>
  <text x="600.0" y="488" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">cause, minutes</text>
  <rect x="870" y="430" width="260" height="130" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.0" y="462" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">System</text>
  <text x="1000.0" y="488" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">type, name</text>
  <text x="1000.0" y="510" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Engine, Avionics,</text>
  <text x="1000.0" y="532" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">or Hydraulics</text>
  <rect x="1270" y="430" width="260" height="130" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1400.0" y="462" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Component</text>
  <text x="1400.0" y="488" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">type, name</text>
  <rect x="70" y="710" width="260" height="130" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="200.0" y="742" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Dataset</text>
  <text x="200.0" y="768" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">id: &#x27;current&#x27;</text>
  <text x="200.0" y="790" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">generator_hash, stamp</text>
  <text x="200.0" y="812" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">loaded_at</text>
  <rect x="470" y="710" width="260" height="130" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="600.0" y="742" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">Reading</text>
  <text x="600.0" y="768" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">reading_id, sensor_id</text>
  <text x="600.0" y="790" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">timestamp, value</text>
  <rect x="870" y="710" width="260" height="130" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.0" y="742" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">Sensor</text>
  <text x="1000.0" y="768" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">type, name, unit</text>
  <rect x="1270" y="710" width="260" height="130" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1400.0" y="742" font-size="18" font-weight="700" fill="#851651" text-anchor="middle">MaintenanceEvent</text>
  <text x="1400.0" y="768" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fault, severity</text>
  <text x="1400.0" y="790" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">reported_at</text>
  <text x="1400.0" y="812" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">corrective_action</text>
  <path d="M870,215 H734" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="739" y="187" width="122" height="21" rx="5" fill="#F7F8FA"/>
  <text x="800" y="202" font-size="12" font-weight="600" fill="#8A4B08" text-anchor="middle">OPERATES_FLIGHT</text>
  <path d="M470,192 H334" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="350" y="167" width="100" height="21" rx="5" fill="#F7F8FA"/>
  <text x="400" y="182" font-size="12" font-weight="600" fill="#8A4B08" text-anchor="middle">DEPARTS_FROM</text>
