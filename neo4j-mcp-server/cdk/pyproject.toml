[project]
name = "neo4j-mcp-cdk"
version = "0.1.0"
description = "CDK stack for Neo4j MCP server on AgentCore"
requires-python = ">=3.10"
dependencies = [
    "aws-cdk-lib>=2.202.0",
    "constructs>=10.4.4",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]
# Leave the Python blocks in Markdown docs as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
