<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1152" viewBox="0 0 1600 1152" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>End-to-End Request</title>
  <desc>A user asks the supervisor about the most common faults. Claude on Bedrock picks the maintenance_specialist tool. The supervisor builds a new Maintenance Agent, which loops with Claude and calls graph_query_tool until Claude has an answer. The tool asks Claude to write Cypher from the live schema, checks it with EXPLAIN, and runs it read-only against Neo4j with the driver. The specialist answer returns to the supervisor, Claude writes the final answer, and the supervisor streams it to the user as SSE events.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1152" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">End-to-End Request</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">One supervisor question, one specialist call, and the tool loop inside it.</text>
  <line x1="120" y1="168" x2="120" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="391" y1="168" x2="391" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="662" y1="168" x2="662" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="934" y1="168" x2="934" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1205" y1="168" x2="1205" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1476" y1="168" x2="1476" y2="1137" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="15" y="110" width="210" height="58" rx="12" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="145" font-size="16" font-weight="700" fill="#344054" text-anchor="middle">User</text>
  <rect x="286" y="110" width="210" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="391" y="145" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="middle">Supervisor</text>
  <rect x="557" y="110" width="210" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="662" y="135" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="middle">Claude</text>
  <text x="662" y="155" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle">on Bedrock</text>
  <rect x="829" y="110" width="210" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="934" y="145" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="middle">Maintenance Agent</text>
  <rect x="1100" y="110" width="210" height="58" rx="12" fill="#FFFFFF" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="135" font-size="15" font-weight="700" fill="#00594A" text-anchor="middle">graph_query_tool</text>
  <text x="1205" y="155" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle">Text2Cypher</text>
  <rect x="1371" y="110" width="210" height="58" rx="12" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1476" y="135" font-size="15" font-weight="700" fill="#00594A" text-anchor="middle">Neo4j</text>
  <text x="1476" y="155" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle">fleet graph</text>
  <rect x="40" y="190" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="209" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">1. Route</text>
  <path d="M120,250 H385" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a-slate)"/>
  <rect x="132" y="226" width="246" height="21" rx="5" fill="#F7F8FA"/>
  <text x="255.5" y="241" font-size="13" font-weight="600" fill="#344054" text-anchor="middle">What are the most common faults?</text>
  <path d="M391,292 H656" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="396" y="268" width="261" height="21" rx="5" fill="#F7F8FA"/>
  <text x="526.5" y="283" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">supervisor prompt, question, tools</text>
  <path d="M662,334 H397" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="422" y="310" width="210" height="21" rx="5" fill="#F7F8FA"/>
  <text x="526.5" y="325" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">call maintenance_specialist</text>
  <rect x="40" y="358" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="377" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">2. Build the specialist</text>
  <path d="M391,418 H928" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="522" y="394" width="282" height="21" rx="5" fill="#F7F8FA"/>
  <text x="662.5" y="409" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">a new Maintenance Agent for this call</text>
  <path d="M934,460 H668" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="657" y="436" width="282" height="21" rx="5" fill="#F7F8FA"/>
  <text x="798.0" y="451" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">prompt with the live schema, question</text>
  <rect x="40" y="484" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="503" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">3. Tool loop, until Claude answers</text>
  <rect x="552" y="520" width="1008" height="380" rx="10" fill="none" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="566" y="540" font-size="13" font-weight="700" fill="#5C6470" text-anchor="start">loop</text>
  <path d="M662,572 H928" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="714" y="548" width="167" height="21" rx="5" fill="#F7F8FA"/>
  <text x="798.0" y="563" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">call graph_query_tool</text>
  <path d="M934,614 H1199" fill="none" stroke="#008C72" stroke-width="2" marker-end="url(#a-teal)"/>
  <rect x="1032" y="590" width="74" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1069.5" y="605" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">question</text>
  <path d="M1205,656 H668" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="806" y="632" width="254" height="21" rx="5" fill="#F7F8FA"/>
  <text x="933.5" y="647" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">schema and question: write Cypher</text>
  <path d="M662,698 H1199" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="904" y="674" width="59" height="21" rx="5" fill="#F7F8FA"/>
  <text x="933.5" y="689" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Cypher</text>
  <path d="M1205,740 H1470" fill="none" stroke="#008C72" stroke-width="2" marker-end="url(#a-teal)"/>
  <rect x="1236" y="716" width="210" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1340.5" y="731" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">EXPLAIN, then run read-only</text>
  <path d="M1476,782 H1211" fill="none" stroke="#008C72" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-teal)"/>
  <rect x="1278" y="758" width="124" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1340.5" y="773" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">records, capped</text>
  <path d="M1205,824 H940" fill="none" stroke="#008C72" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-teal)"/>
  <rect x="1022" y="800" width="95" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1069.5" y="815" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">tool result</text>
  <path d="M934,866 H668" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="750" y="842" width="95" height="21" rx="5" fill="#F7F8FA"/>
  <text x="798.0" y="857" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">tool result</text>
  <rect x="40" y="914" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="933" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">4. Answer</text>
  <path d="M662,966 H928" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="729" y="942" width="138" height="21" rx="5" fill="#F7F8FA"/>
  <text x="798.0" y="957" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">specialist answer</text>
  <path d="M934,1006 H397" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="615" y="982" width="95" height="21" rx="5" fill="#F7F8FA"/>
  <text x="662.5" y="997" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">tool result</text>
  <path d="M391,1046 H656" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="458" y="1022" width="138" height="21" rx="5" fill="#F7F8FA"/>
  <text x="526.5" y="1037" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">specialist answer</text>
  <path d="M662,1086 H397" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="476" y="1062" width="102" height="21" rx="5" fill="#F7F8FA"/>
  <text x="526.5" y="1077" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">final answer</text>
  <path d="M391,1126 H126" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="190" y="1102" width="131" height="21" rx="5" fill="#F7F8FA"/>
  <text x="255.5" y="1117" font-size="13" font-weight="600" fill="#344054" text-anchor="middle">SSE chunk events</text>
</svg>
