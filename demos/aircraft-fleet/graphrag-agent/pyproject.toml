[project]
name = "aircraft-fleet-graphrag-agent"
version = "0.1.0"
description = "Aircraft Fleet GraphRAG Agent: Strands, direct-to-Neo4j GraphRAG"
requires-python = ">=3.12"
dependencies = [
    # Shared core: direct-to-Neo4j GraphRAG, with no MCP and no Gateway
    "bedrock-agentcore>=1.26",
    "neo4j-graphrag[bedrock]>=1.24",
    "neo4j>=6.3.1",
    "boto3>=1.43.127",
    "httpx>=0.28",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
    # Observability - ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.23",
    # Strands agent framework
    "strands-agents>=1.65",
    # Strands needs mcp. The agent does not import it. The floor keeps the 2.x line.
    # strands-agents 1.65 caps mcp below 2.4, so 2.4 waits on a Strands release.
    "mcp>=2.2.0,<3",
    # The fleet fork of 0.8.0. [tool.uv.sources] says where the wheel is.
    "neo4j-agent-memory[strands]==0.8.0+fleet.8",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop). It is never backgrounded by a script. The
# clients are thin wire callers. `fleet-server` defaults to port 7070 for
# local dev (AGENT_PORT still overrides). AgentCore Runtime runs the root
# main.py, which serves 8080.
[project.scripts]
fleet-server = "fleet_graphrag.server:main"
fleet-cli = "fleet_graphrag.client.cli:main"
fleet-demo = "fleet_graphrag.client.demo:main"
fleet-invoke = "fleet_graphrag.client.invoke:main"

[tool.uv.sources]
neo4j-agent-memory = { url = "https://github.com/neo4j-partners/agent-memory/releases/download/python-v0.8.0%2Bfleet.8/neo4j_agent_memory-0.8.0%2Bfleet.8-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One package. The editable install puts it on the venv path for the console
# scripts and the tests. AgentCore runs main.py as a file, and CodeZip
# installs the dependencies but not the project. fleet_graphrag imports there
# because its folder sits next to main.py.
[tool.hatch.build.targets.wheel]
packages = ["fleet_graphrag"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
