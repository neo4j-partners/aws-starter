  <text x="460" y="678" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="start">FleetUi stack, from the CDK app in ui/infra</text>
  <rect x="460" y="700" width="220" height="130" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.0" y="732" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Function URL</text>
  <text x="570.0" y="758" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">public, auth NONE</text>
  <text x="570.0" y="780" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">RESPONSE_STREAM</text>
  <text x="570.0" y="802" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the app checks the session</text>
  <rect x="760" y="700" width="430" height="130" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="975.0" y="732" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">UI function</text>
  <text x="975.0" y="758" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">arm64 container image, 2048 MB</text>
  <text x="975.0" y="780" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Lambda Web Adapter, port 8080</text>
  <text x="975.0" y="802" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">relays the supervisor's stream</text>
  <rect x="460" y="870" width="240" height="145" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.0" y="902" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Cognito user pool</text>
  <text x="580.0" y="928" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">managed login page</text>
  <text x="580.0" y="950" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">admin-created users only</text>
  <text x="580.0" y="972" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">public client, code + PKCE</text>
  <text x="580.0" y="994" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">a sign-in lasts one hour</text>
  <rect x="760" y="870" width="240" height="145" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="880.0" y="902" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">SSM parameter</text>
  <text x="880.0" y="928" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">/fleet-ui/FleetUi/</text>
  <text x="880.0" y="950" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">cognito-client-id</text>
  <text x="880.0" y="972" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the app client ID</text>
  <text x="880.0" y="994" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">read once at startup</text>
