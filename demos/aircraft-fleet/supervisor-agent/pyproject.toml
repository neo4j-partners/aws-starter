[project]
name = "aircraft-fleet-supervisor-agent"
version = "0.1.0"
description = "Strands supervisor for the Neo4j MCP server with Maintenance and Operations specialists"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.65",
    "bedrock-agentcore[strands-agents]>=1.26",
    "mcp>=1.28,<2",
    "httpx>=0.28.0",
    "boto3>=1.43.127",
    # Observability: ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.23.0",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop). `fleet-supervisor-cli` asks the local server one
# question. `fleet-supervisor-invoke` is the cloud invocation and load-test
# client.
[project.scripts]
fleet-supervisor-server = "server.runtime_app:main"
fleet-supervisor-cli = "client.cli:main"
fleet-supervisor-invoke = "client.invoke:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package the shared `core` plus `client`/`server` into the venv so the
# console scripts resolve `client.*`/`server.*` and `from core import ...`
# works without any sys.path manipulation.
[tool.hatch.build.targets.wheel]
packages = ["core", "client", "server"]

# Read by the AgentCore CLI to find the runtime entrypoint.
[tool.agentcore]
entrypoint = "server/runtime_app.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
