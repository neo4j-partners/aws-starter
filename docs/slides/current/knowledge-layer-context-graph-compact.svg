<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">A Context Graph assembles the right context for one request</title>
  <desc id="description">Knowledge graph, situational context, and memory and traces combine into a Context Graph scoped to a specific user, task, workflow, or decision.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { fill: #ccfbf1; font-size: 15px; font-weight: 750; letter-spacing: 1.7px; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 31px; font-weight: 750; text-anchor: middle; }
      .component-title { fill: #0f172a; font-size: 19px; font-weight: 750; text-anchor: middle; }
      .component-copy { fill: #475569; font-size: 14px; font-weight: 500; text-anchor: middle; }
      .badge-teal { fill: #0f766e; font-size: 13px; font-weight: 750; letter-spacing: 0.6px; text-anchor: middle; }
      .badge-slate { fill: #475569; font-size: 13px; font-weight: 750; letter-spacing: 0.6px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Source cards -->
  <g filter="url(#shadow)">
    <rect x="50" y="60" width="190" height="350" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="255" y="60" width="190" height="350" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="460" y="60" width="190" height="350" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>

  <!-- Knowledge graph -->
  <circle cx="145" cy="118" r="31" fill="#ccfbf1"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <line x1="127" y1="120" x2="147" y2="103"/>
    <line x1="127" y1="120" x2="149" y2="138"/>
    <line x1="147" y1="103" x2="166" y2="121"/>
    <line x1="149" y1="138" x2="166" y2="121"/>
    <circle cx="127" cy="120" r="5"/>
    <circle cx="147" cy="103" r="5"/>
    <circle cx="149" cy="138" r="5"/>
    <circle cx="166" cy="121" r="5"/>
  </g>
  <text class="component-title" x="145" y="182">Knowledge</text>
  <text class="component-title" x="145" y="206">graph</text>
  <line x1="79" y1="228" x2="211" y2="228" stroke="#ccfbf1" stroke-width="2"/>
  <text class="component-copy" x="145" y="260">Business meaning,</text>
  <text class="component-copy" x="145" y="282">entities, relationships,</text>
  <text class="component-copy" x="145" y="304">source mappings + policy</text>
  <rect x="67" y="342" width="156" height="38" rx="19" fill="#ecfeff"/>
  <text class="badge-teal" x="145" y="366">WHAT THINGS MEAN</text>

  <!-- Situational context -->
  <circle cx="350" cy="118" r="31" fill="#e2e8f0"/>
  <g fill="none" stroke="#475569" stroke-width="2.5">
    <circle cx="350" cy="118" r="18"/>
    <circle cx="350" cy="118" r="8"/>
    <circle cx="350" cy="118" r="2.5" fill="#475569"/>
  </g>
  <text class="component-title" x="350" y="182">Situational</text>
  <text class="component-title" x="350" y="206">context</text>
  <line x1="284" y1="228" x2="416" y2="228" stroke="#e2e8f0" stroke-width="2"/>
  <text class="component-copy" x="350" y="260">The request, user,</text>
  <text class="component-copy" x="350" y="282">permissions, workflow</text>
  <text class="component-copy" x="350" y="304">state + current facts</text>
  <rect x="272" y="342" width="156" height="38" rx="19" fill="#f1f5f9"/>
  <text class="badge-slate" x="350" y="366">WHAT IS HAPPENING</text>

  <!-- Memory and traces -->
  <circle cx="555" cy="118" r="31" fill="#ccfbf1"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="538" y1="107" x2="554" y2="120"/>
    <line x1="561" y1="100" x2="554" y2="120"/>
    <line x1="573" y1="119" x2="554" y2="120"/>
    <line x1="559" y1="138" x2="554" y2="120"/>
    <line x1="538" y1="131" x2="554" y2="120"/>
    <line x1="538" y1="107" x2="561" y2="100"/>
    <line x1="561" y1="100" x2="573" y2="119"/>
    <line x1="573" y1="119" x2="559" y2="138"/>
    <line x1="559" y1="138" x2="538" y2="131"/>
    <circle cx="538" cy="107" r="4"/>
    <circle cx="561" cy="100" r="4"/>
    <circle cx="573" cy="119" r="4"/>
    <circle cx="559" cy="138" r="4"/>
    <circle cx="538" cy="131" r="4"/>
    <circle cx="554" cy="120" r="4.5"/>
  </g>
  <text class="component-title" x="555" y="182">Memory</text>
  <text class="component-title" x="555" y="206">and traces</text>
  <line x1="489" y1="228" x2="621" y2="228" stroke="#ccfbf1" stroke-width="2"/>
  <text class="component-copy" x="555" y="260">Prior interactions,</text>
  <text class="component-copy" x="555" y="282">evidence, decisions,</text>
  <text class="component-copy" x="555" y="304">outcomes + feedback</text>
  <rect x="477" y="342" width="156" height="38" rx="19" fill="#ecfeff"/>
  <text class="badge-teal" x="555" y="366">WHAT WE LEARNED</text>

  <!-- Assembly into the Context Graph -->
  <g fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M145 418v54"/>
    <path d="M350 418v54"/>
    <path d="M555 418v54"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="490" width="600" height="240" rx="24" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
    <path d="M74 490h552a24 24 0 0 1 24 24v76H50v-76a24 24 0 0 1 24-24Z" fill="#0f766e"/>
  </g>
  <text class="eyebrow" x="350" y="530">FOR ONE USER · TASK · DECISION</text>
  <text class="layer-title" x="350" y="572">Context Graph</text>
  <text x="350" y="634" text-anchor="middle" fill="#475569" font-size="15" font-weight="500">Governed knowledge, current state, and relevant experience</text>
  <rect x="175" y="658" width="350" height="52" rx="26" fill="#ecfeff" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="350" y="692" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="750">What matters right now?</text>
</svg>
