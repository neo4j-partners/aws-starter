  <text x="64" y="834" font-size="17" font-weight="700" fill="#16233A" text-anchor="start">Events the client receives</text>
  <text x="64" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">agent</text>
  <text x="64" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">a specialist was called</text>
  <text x="314" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">tool</text>
  <text x="314" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">a specialist called a graph tool</text>
  <text x="564" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">tool_complete</text>
  <text x="564" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">a call ended, with trace on</text>
  <text x="814" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">chunk</text>
  <text x="814" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">answer text</text>
  <text x="1064" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">complete</text>
  <text x="1064" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">the answer is done</text>
  <text x="1314" y="874" font-size="14" font-weight="600" fill="#16233A" text-anchor="start" font-family="Menlo, Consolas, monospace">error</text>
  <text x="1314" y="896" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">a generic failure message</text>
</svg>
