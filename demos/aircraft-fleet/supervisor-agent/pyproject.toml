[project]
name = "aircraft-fleet-supervisor-agent"
version = "0.1.0"
description = "Strands supervisor for the Neo4j MCP server with Maintenance and Operations specialists"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.65",
    "bedrock-agentcore[strands-agents]>=1.26",
    "mcp>=1.28,<2",
    "httpx>=0.28.0",
    "boto3>=1.43.127",
    # Observability: ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.23.0",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop). `fleet-supervisor-cli` asks the local server one
# question. `fleet-supervisor-invoke` is the cloud invocation and load-test
# client.
[project.scripts]
fleet-supervisor-server = "fleet_supervisor.server:main"
fleet-supervisor-cli = "fleet_supervisor.client.cli:main"
fleet-supervisor-invoke = "fleet_supervisor.client.invoke:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One uniquely named package holds all the code. CodeZip installs the
# dependencies but not this project, so in the runtime the package imports
# because its folder sits next to main.py. Locally, uv installs it for the
# console scripts. The runtime entrypoint is set in agentcore/agentcore.json.
[tool.hatch.build.targets.wheel]
packages = ["fleet_supervisor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
