[project]
name = "neo4j-orchestrator-agent"
version = "0.1.0"
description = "Multi-agent orchestrator for Neo4j MCP server with Maintenance and Operations specialists"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    # LangGraph for multi-agent orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-mcp-adapters>=0.2.0",
    "mcp>=1.3.0",
    "httpx>=0.28.0",
    "boto3>=1.42.0",
    "pyyaml>=6.0",
    # Observability - ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.10.0",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop); `orchestrator-invoke` is the cloud
# invocation / load-test client.
[project.scripts]
orchestrator-server = "server.runtime_app:main"
orchestrator-invoke = "client.invoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package the shared `core` plus `client`/`server` into the venv so the
# console scripts resolve `client.*`/`server.*` and `from core import ...`
# works without any sys.path manipulation.
[tool.hatch.build.targets.wheel]
packages = ["core", "client", "server"]
