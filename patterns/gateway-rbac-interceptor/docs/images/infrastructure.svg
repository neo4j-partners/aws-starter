<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Infrastructure</title>
  <desc>deploy.sh builds the arm64 image, creates the ECR repository, and pushes the image. The SimpleOAuthDemo CDK stack holds AgentCore, Cognito, three Lambdas, three IAM roles, and the test-user password secret.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1010" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Infrastructure</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">deploy.sh owns the image and the ECR repository. The CDK stack owns everything else.</text>
  <rect x="40" y="170" width="250" height="130" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.0" y="202" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">deploy.sh</text>
  <text x="165.0" y="228" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">docker buildx</text>
  <text x="165.0" y="250" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">linux/arm64 image</text>
  <text x="165.0" y="272" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">creates the ECR repo</text>
  <rect x="40" y="345" width="250" height="130" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="165.0" y="377" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">ECR repository</text>
  <text x="165.0" y="403" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">simpleoauthdemo-mcp-server</text>
  <text x="165.0" y="425" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">outside the stack</text>
  <text x="165.0" y="447" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">scan on push</text>
  <path d="M165,300 V341" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="330" y="120" width="1230" height="830" rx="18" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="356" y="154" font-size="19" font-weight="700" fill="#16233A" text-anchor="start">CDK stack: SimpleOAuthDemo</text>
  <rect x="360" y="175" width="570" height="385" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="380" y="207" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="start">AgentCore</text>
  <rect x="380" y="227" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="398" y="250" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">Gateway</text>
  <text x="398" y="270" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">MCP protocol, CUSTOM_JWT inbound auth, REQUEST interceptor</text>
  <rect x="380" y="293" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="398" y="316" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">Gateway target</text>
  <text x="398" y="336" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">mcp-server-target, OAuth outbound, scope simple-oauth/invoke</text>
  <rect x="380" y="359" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="398" y="382" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">Runtime</text>
  <text x="398" y="402" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">MCP server from the :latest image, JWT authorizer</text>
  <rect x="380" y="425" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="398" y="448" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">OAuth2 credential provider</text>
  <text x="398" y="468" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">{stack}_oauth_provider, made by a custom resource</text>
  <rect x="960" y="175" width="570" height="385" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="980" y="207" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="start">Cognito</text>
  <rect x="980" y="227" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="998" y="250" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">User pool</text>
  <text x="998" y="270" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">domain prefix {stack}-{account}</text>
  <rect x="980" y="291" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="998" y="314" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">Resource server</text>
  <text x="998" y="334" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">simple-oauth with the invoke scope</text>
  <rect x="980" y="355" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="998" y="378" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">MachineClient</text>
  <text x="998" y="398" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">client_credentials for M2M and the credential provider</text>
  <rect x="980" y="419" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="998" y="442" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">UserClient</text>
  <text x="998" y="462" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">USER_PASSWORD_AUTH, refresh tokens, code flow</text>
  <rect x="980" y="483" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="998" y="506" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">Groups</text>
  <text x="998" y="526" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">admin with precedence 5, users with precedence 10</text>
  <rect x="360" y="585" width="570" height="340" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="380" y="617" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="start">Lambda functions</text>
  <rect x="380" y="637" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="398" y="660" font-size="16" font-weight="700" fill="#4A2EB0" text-anchor="start">AuthInterceptorLambda</text>
  <text x="398" y="680" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">RBAC check and identity headers, 30 s, 128 MB</text>
  <rect x="380" y="701" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="398" y="724" font-size="16" font-weight="700" fill="#4A2EB0" text-anchor="start">OAuthProviderLambda</text>
  <text x="398" y="744" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">custom resource that creates the credential provider</text>
  <rect x="380" y="765" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="398" y="788" font-size="16" font-weight="700" fill="#4A2EB0" text-anchor="start">RuntimeHealthCheckLambda</text>
  <text x="398" y="808" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">custom resource that waits for the Runtime</text>
  <text x="380" y="859" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">Python 3.13. Each Lambda has its own one-week log group.</text>
  <rect x="960" y="585" width="570" height="340" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="1.5"/>
  <text x="980" y="617" font-size="18" font-weight="700" fill="#344054" text-anchor="start">IAM roles and secrets</text>
  <rect x="980" y="637" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="998" y="660" font-size="16" font-weight="700" fill="#344054" text-anchor="start">GatewayRole</text>
  <text x="998" y="680" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Runtime invoke, OAuth tokens, logs, Bedrock, interceptor</text>
  <rect x="980" y="701" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="998" y="724" font-size="16" font-weight="700" fill="#344054" text-anchor="start">RuntimeRole</text>
  <text x="998" y="744" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">ECR pull, CloudWatch Logs, X-Ray</text>
  <rect x="980" y="765" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="998" y="788" font-size="16" font-weight="700" fill="#344054" text-anchor="start">CustomResourceRole</text>
  <text x="998" y="808" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">used by the two custom-resource Lambdas</text>
  <rect x="980" y="829" width="530" height="56" rx="10" fill="#FFFFFF" stroke="#C11574" stroke-width="1.5"/>
  <text x="998" y="852" font-size="16" font-weight="700" fill="#851651" text-anchor="start">TestUserPassword</text>
  <text x="998" y="872" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Secrets Manager secret for the two test users</text>
  <path d="M290,387 H376" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <text x="40" y="985" font-size="14" font-weight="400" fill="#5C6470" text-anchor="start">A dashed border marks a resource made outside CloudFormation&#x27;s own types. deploy.sh makes the ECR repository. A custom resource makes the credential provider.</text>
</svg>
