<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How the Gateway Request Flow Works</title>
  <desc>An AI agent authenticates to Cognito for an M2M JWT, calls the AgentCore Gateway, which validates the token and exchanges it via an OAuth2 provider for a Runtime token, then forwards the request to the AgentCore Runtime, which invokes the Neo4j MCP server against Neo4j Aura.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F8FA"/>

  <!-- Header -->
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">How the Gateway Request Flow Works</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">Every MCP call to Neo4j passes through Cognito and the Gateway before it reaches the graph.</text>

  <!-- Cognito (auth annotation, above Agent/Gateway gap) -->
  <rect x="90" y="140" width="280" height="78" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="230" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#8A4B08">Amazon Cognito</text>
  <text x="230" y="194" text-anchor="middle" font-size="13" fill="#8A5A24">OAuth2 · client_credentials</text>

  <!-- OAuth Provider (auth annotation, above Gateway/Runtime gap) -->
  <rect x="660" y="140" width="280" height="78" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="800" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#8A4B08">OAuth2 Credential Provider</text>
  <text x="800" y="194" text-anchor="middle" font-size="13" fill="#8A5A24">Gateway to Runtime token exchange</text>

  <!-- Step 1: Agent <-> Cognito -->
  <path d="M210,330 V218" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M250,218 V330" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-orange)" transform="rotate(180 250 274)"/>
  <circle cx="230" cy="260" r="17" fill="#D97706"/>
  <text x="230" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>

  <!-- Step 3: Gateway <-> OAuth Provider -->
  <path d="M660,330 L780,218" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M830,218 L720,330" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <circle cx="800" cy="260" r="17" fill="#D97706"/>
  <text x="800" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>

  <!-- Main pipeline row -->
  <!-- Box 1: AI Agent -->
  <rect x="60" y="330" width="340" height="150" rx="18" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#1F4E86">AI Agent</text>
  <text x="230" y="406" text-anchor="middle" font-size="14" fill="#5C6470">Strands Agents on Amazon Bedrock</text>
  <text x="230" y="440" text-anchor="middle" font-size="12" fill="#667085">Holds no Neo4j credentials —</text>
  <text x="230" y="458" text-anchor="middle" font-size="12" fill="#667085">only a short-lived JWT</text>

  <!-- Box 2: AgentCore Gateway -->
  <rect x="440" y="330" width="340" height="150" rx="18" fill="#F0FBF7" stroke="#00A87A" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#155D4B">AgentCore Gateway</text>
  <text x="610" y="406" text-anchor="middle" font-size="14" fill="#477565">Validates the JWT, aggregates targets</text>
  <text x="610" y="440" text-anchor="middle" font-size="12" font-family="'SFMono-Regular', Consolas, monospace" fill="#126B59">…-target___read_neo4j_cypher</text>
  <text x="610" y="458" text-anchor="middle" font-size="12" fill="#667085">tool names are target-prefixed</text>

  <!-- Box 3: AgentCore Runtime -->
  <rect x="820" y="330" width="340" height="150" rx="18" fill="#ECFDF3" stroke="#19A974" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">AgentCore Runtime</text>
  <text x="990" y="406" text-anchor="middle" font-size="14" fill="#39715A">Hosts the Neo4j MCP server</text>
  <text x="990" y="440" text-anchor="middle" font-size="12" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">get_neo4j_schema · read_neo4j_cypher</text>
  <text x="990" y="458" text-anchor="middle" font-size="12" fill="#667085">read-only tools, isolated microVM</text>

  <!-- Box 4: Neo4j Aura -->
  <rect x="1200" y="330" width="340" height="150" rx="18" fill="#EDF5FD" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1370" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#14558A">Neo4j Aura</text>
  <text x="1370" y="406" text-anchor="middle" font-size="14" fill="#5C6470">Runs the Cypher query</text>
  <text x="1370" y="440" text-anchor="middle" font-size="12" fill="#667085">Database credentials stay in the</text>
  <text x="1370" y="458" text-anchor="middle" font-size="12" fill="#667085">container as environment variables</text>

  <!-- Step 2: Agent -> Gateway -->
  <line x1="400" y1="405" x2="428" y2="405" stroke="#667085" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <circle cx="414" cy="405" r="15" fill="#667085"/>
  <text x="414" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>

  <!-- Step 4: Gateway -> Runtime -->
  <line x1="780" y1="405" x2="808" y2="405" stroke="#008C72" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <circle cx="794" cy="405" r="15" fill="#008C72"/>
  <text x="794" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>

  <!-- Step 5: Runtime -> Neo4j -->
  <line x1="1160" y1="405" x2="1188" y2="405" stroke="#19A974" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <circle cx="1174" cy="405" r="15" fill="#19A974"/>
  <text x="1174" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>

  <!-- Return path -->
  <path d="M1370,480 V560 H230 V480" fill="none" stroke="#2E6DB4" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
  <rect x="640" y="540" width="320" height="38" rx="19" fill="#FFFFFF" stroke="#B8CDE4"/>
  <text x="800" y="565" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E86">Results return through the same path</text>

  <!-- Legend / step list -->
  <rect x="56" y="616" width="1488" height="188" rx="18" fill="#FFFFFF" stroke="#E4E7EC" filter="url(#shadow)"/>
  <text x="86" y="652" font-size="14" font-weight="700" letter-spacing="1.3" fill="#667085">THE FOUR-HOP REQUEST</text>

  <circle cx="100" cy="684" r="14" fill="#D97706"/><text x="100" y="689" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="126" y="689" font-size="15" fill="#354052">Agent gets an M2M JWT from Cognito with <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#8A4B08">client_credentials</tspan></text>

  <circle cx="100" cy="716" r="14" fill="#667085"/><text x="100" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="126" y="721" font-size="15" fill="#354052">Agent calls the Gateway with the JWT</text>

  <circle cx="100" cy="748" r="14" fill="#D97706"/><text x="100" y="753" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="126" y="753" font-size="15" fill="#354052">Gateway validates the JWT, then exchanges it for a Runtime token</text>

  <circle cx="820" cy="684" r="14" fill="#008C72"/><text x="820" y="689" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="846" y="689" font-size="15" fill="#354052">Gateway forwards the request to the Runtime</text>

  <circle cx="820" cy="716" r="14" fill="#19A974"/><text x="820" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
  <text x="846" y="721" font-size="15" fill="#354052">Runtime invokes the MCP server, which runs Cypher against Neo4j</text>

  <text x="846" y="753" font-size="15" fill="#354052">M2M only: no user accounts, no interactive login, no passwords to rotate</text>

  <!-- Footer -->
  <rect x="56" y="822" width="1488" height="56" rx="14" fill="#232F3E"/>
  <text x="800" y="857" text-anchor="middle" font-size="18" fill="#FFFFFF" font-family="'SFMono-Regular', Consolas, monospace">Cognito · AgentCore Gateway · AgentCore Runtime · Neo4j MCP Server · Neo4j Aura</text>
</svg>
