name: Check docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          lychee --version

      - name: Check links and retired names
        run: scripts/check-docs.sh
