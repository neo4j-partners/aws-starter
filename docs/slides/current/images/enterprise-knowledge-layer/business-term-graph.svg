<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">Business terms, columns, and joins connected in Neo4j</title>
  <desc id="desc">The orders table contains total_amount, which is tagged with the business term Order amount. Orders also contains customer_id, which references the id column of the customers table.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .kind { font-size: 15px; fill: #0f766e; font-weight: 700; letter-spacing: 1px; }
      .name { font-size: 24px; font-weight: 700; }
      .edge { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .rel { font-size: 17px; fill: #475569; }
      .node { fill: #ffffff; stroke: #99c9c4; stroke-width: 2; }
    </style>
  </defs>
  <path class="edge" d="M422 61 H262"/>
  <text class="rel" x="342" y="47" text-anchor="middle">tagged with</text>
  <path class="edge" d="M860 61 H704"/>
  <text class="rel" x="782" y="47" text-anchor="middle">has column</text>
  <path class="edge" d="M978 100 V162"/>
  <text class="rel" x="995" y="137">has column</text>
  <path class="edge" d="M860 203 H704"/>
  <text class="rel" x="782" y="189" text-anchor="middle">references</text>
  <path class="edge" d="M260 203 H420"/>
  <text class="rel" x="341" y="189" text-anchor="middle">has column</text>
  <rect class="node" x="22" y="22" width="238" height="78" rx="10" fill="#e0f2f1"/>
  <text class="kind" x="42" y="49">BUSINESS TERM</text>
  <text class="name" x="42" y="80">Order amount</text>
  <rect class="node" x="422" y="22" width="280" height="78" rx="10"/>
  <text class="kind" x="442" y="49">COLUMN</text>
  <text class="name" x="442" y="80">total_amount</text>
  <rect class="node" x="860" y="22" width="238" height="78" rx="10"/>
  <text class="kind" x="880" y="49">TABLE</text>
  <text class="name" x="880" y="80">orders</text>
  <rect class="node" x="22" y="164" width="238" height="78" rx="10"/>
  <text class="kind" x="42" y="191">TABLE</text>
  <text class="name" x="42" y="222">customers</text>
  <rect class="node" x="422" y="164" width="280" height="78" rx="10"/>
  <text class="kind" x="442" y="191">COLUMN</text>
  <text class="name" x="442" y="222">id</text>
  <rect class="node" x="860" y="164" width="238" height="78" rx="10"/>
  <text class="kind" x="880" y="191">COLUMN</text>
  <text class="name" x="880" y="222">customer_id</text>
</svg>
