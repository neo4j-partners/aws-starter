[project]
name = "aws-starter-sample-data"
version = "0.1.0"
description = "Generate the Aircraft Digital Twin dataset locally and load it into a Neo4j Aura instance for the fleet-agent / Neo4j MCP server"
requires-python = ">=3.11"
dependencies = [
    # generator
    "faker>=24.0.0",
    "numpy>=1.26.0",
    # loader + GraphRAG enrichment
    "neo4j>=5.17.0",
    "neo4j-graphrag[openai]>=1.15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    # shared
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.49.0",
    "neo4j-graphrag[anthropic]>=1.15.0",
]

[project.scripts]
generate-data = "generator.main:app"
populate-aircraft-db = "populate_aircraft_db.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator", "src/populate_aircraft_db"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
