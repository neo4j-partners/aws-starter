[project]
name = "neo4j-aura-agents"
version = "0.1.0"
description = "Python client for calling external Neo4j Aura Agents via REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
# Leave the Python blocks in Markdown docs as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
