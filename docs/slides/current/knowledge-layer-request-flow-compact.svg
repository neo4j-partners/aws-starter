<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">Compact Enterprise Knowledge Layer request flow</title>
  <desc id="description">A business request moves through intent, source selection, policy, and explanation before the useful outcome is saved in memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { font-size: 17px; font-weight: 800; letter-spacing: 1.9px; fill: #0f766e; }
      .number { font-size: 17px; font-weight: 800; fill: #0f766e; }
      .step { font-size: 25px; font-weight: 760; fill: #0f172a; }
      .copy { font-size: 17px; fill: #475569; }
      .flow { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- request -->
  <rect x="220" y="18" width="260" height="54" rx="27" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="350" y="52" text-anchor="middle" font-size="20" font-weight="750" fill="#0f172a">Business request</text>
  <path class="flow" d="M 350 72 V 93"/>

  <!-- knowledge layer -->
  <rect x="58" y="102" width="584" height="492" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="90" y="136">ENTERPRISE KNOWLEDGE LAYER</text>

  <g filter="url(#shadow)">
    <rect x="90" y="158" width="520" height="84" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="90" y="266" width="520" height="84" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="90" y="374" width="520" height="84" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="90" y="482" width="520" height="84" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>

  <text class="number" x="116" y="191">01</text>
  <text class="step" x="165" y="193">Interpret intent</text>
  <text class="copy" x="165" y="220">Map words to business meaning</text>

  <text class="number" x="116" y="299">02</text>
  <text class="step" x="165" y="301">Select sources and tools</text>
  <text class="copy" x="165" y="328">Choose systems and generate queries</text>

  <text class="number" x="116" y="407">03</text>
  <text class="step" x="165" y="409">Apply policy</text>
  <text class="copy" x="165" y="436">Check access and business rules</text>

  <text class="number" x="116" y="515">04</text>
  <text class="step" x="165" y="517">Explain result</text>
  <text class="copy" x="165" y="544">Return evidence and the decision path</text>

  <path class="flow" d="M 350 242 V 256"/>
  <path class="flow" d="M 350 350 V 364"/>
  <path class="flow" d="M 350 458 V 472"/>

  <!-- memory -->
  <path class="flow" d="M 350 566 V 616"/>
  <g filter="url(#shadow)">
    <rect x="90" y="626" width="520" height="104" rx="18" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <text class="section" x="118" y="660">MEMORY</text>
  <text x="118" y="694" font-size="22" font-weight="750" fill="#0f172a">Save useful outcomes for the next request</text>
</svg>
