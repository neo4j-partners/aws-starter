<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Deployment Topology</title>
  <desc>The graph loader writes the fraud graph. deploy.py --env finance builds the MCP server stack and writes Gateway credentials. agent.sh deploys the agent to AgentCore Runtime through CodeBuild with the starter toolkit. NAMS holds memory.</desc>
  <style>
    .h1 { font-size: 32px; font-weight: 700; fill: #16233A; }
    .sub { font-size: 17px; fill: #5C6470; }
    .t { font-size: 19px; font-weight: 700; }
    .s { font-size: 14px; fill: #475467; }
    .m { font-size: 13px; fill: #475467; font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 13px; font-weight: 600; fill: #344054; }
  </style>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" class="h1">Deployment Topology</text>
  <text x="800" y="84" text-anchor="middle" class="sub">Three deploy steps. The graph and agent memory are separate stores with separate credentials.</text>
  <rect x="60" y="130" width="470" height="120" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="78" y="148" width="40" height="34" rx="17" fill="#2E6DB4"/>
  <text x="98" y="171" text-anchor="middle" class="t" fill="#FFFFFF">1</text>
  <text x="134" y="172" text-anchor="start" class="t" fill="#1E3A5F">graph-loader</text>
  <text x="84" y="210" text-anchor="start" class="m">uv run fraud-graph-load</text>
  <text x="84" y="232" text-anchor="start" class="m">uv run fraud-graph-enrich</text>
  <rect x="560" y="130" width="470" height="120" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="578" y="148" width="40" height="34" rx="17" fill="#2E6DB4"/>
  <text x="598" y="171" text-anchor="middle" class="t" fill="#FFFFFF">2</text>
  <text x="634" y="172" text-anchor="start" class="t" fill="#1E3A5F">neo4j-mcp-server</text>
  <text x="584" y="210" text-anchor="start" class="m">./deploy.py --env finance</text>
  <text x="584" y="232" text-anchor="start" class="m">./deploy.py --env finance credentials</text>
  <rect x="1060" y="130" width="470" height="120" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1078" y="148" width="40" height="34" rx="17" fill="#2E6DB4"/>
  <text x="1098" y="171" text-anchor="middle" class="t" fill="#FFFFFF">3</text>
  <text x="1134" y="172" text-anchor="start" class="t" fill="#1E3A5F">fraud-memory-agent</text>
  <text x="1084" y="210" text-anchor="start" class="m">./agent.sh configure</text>
  <text x="1084" y="232" text-anchor="start" class="m">./agent.sh deploy &amp;&amp; ./agent.sh verify</text>
  <rect x="60" y="330" width="470" height="160" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="364" text-anchor="middle" class="t" fill="#00594A">Neo4j Aura (fraud database)</text>
  <text x="295" y="388" text-anchor="middle" class="s">NEO4J_* in graph-loader/.env</text>
  <text x="295" y="410" text-anchor="middle" class="s">and neo4j-mcp-server/.env.finance</text>
  <text x="295" y="432" text-anchor="middle" class="s">must name the same database</text>
  <path d="M295,250 L295,322" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="560" y="300" width="470" height="540" rx="20" fill="#FFFFFF" fill-opacity="0.6" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="582" y="330" text-anchor="start" class="lbl" fill="#1E3A5F" font-size="15">CloudFormation stack (finance env)</text>
  <rect x="590" y="350" width="410" height="90" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="384" text-anchor="middle" class="t" fill="#1E3A5F">ECR image + AgentCore Runtime</text>
  <text x="795" y="408" text-anchor="middle" class="s">Neo4j MCP server, arm64</text>
  <rect x="590" y="460" width="410" height="90" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="494" text-anchor="middle" class="t" fill="#1E3A5F">AgentCore Gateway + target</text>
  <text x="795" y="518" text-anchor="middle" class="s">OAuth2 credential provider</text>
  <rect x="590" y="570" width="410" height="90" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="604" text-anchor="middle" class="t" fill="#1E3A5F">Cognito user pool client</text>
  <text x="795" y="628" text-anchor="middle" class="s">resource server, M2M scopes</text>
  <rect x="590" y="680" width="410" height="120" rx="14" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="714" text-anchor="middle" class="t" fill="#1E3A5F">Secrets Manager</text>
  <text x="795" y="738" text-anchor="middle" class="s">Neo4j password</text>
  <text x="795" y="760" text-anchor="middle" class="s">read by the container at startup</text>
  <path d="M795,250 L795,292" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <path d="M590,395 L538,410" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="539.2" y="365" width="41.6" height="21" rx="5" fill="#F7F8FA"/>
  <text x="560" y="380" text-anchor="middle" class="lbl">Bolt</text>
  <rect x="60" y="560" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="594" text-anchor="middle" class="t" fill="#344054">.mcp-credentials.json</text>
  <text x="295" y="618" text-anchor="middle" class="s">gateway_url, client_id, client_secret,</text>
  <text x="295" y="640" text-anchor="middle" class="s">token_url, access_token</text>
  <text x="295" y="662" text-anchor="middle" class="s">copied by scripts/sync-credentials.sh</text>
  <path d="M590,615 L538,625" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="1060" y="300" width="490" height="400" rx="20" fill="#FFFFFF" fill-opacity="0.6" stroke="#7A5AF8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1082" y="330" text-anchor="start" class="lbl" fill="#4A2EB0" font-size="15">AgentCore starter toolkit (agent.sh)</text>
  <rect x="1090" y="350" width="430" height="90" rx="14" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1305" y="384" text-anchor="middle" class="t" fill="#4A2EB0">CodeBuild + S3 source bucket</text>
  <text x="1305" y="408" text-anchor="middle" class="s">bedrock-agentcore-codebuild-sources-*</text>
  <rect x="1090" y="460" width="430" height="100" rx="14" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1305" y="494" text-anchor="middle" class="t" fill="#4A2EB0">ECR image + AgentCore Runtime</text>
  <text x="1305" y="518" text-anchor="middle" class="s">fraud_memory_agent, port 8080</text>
  <text x="1305" y="540" text-anchor="middle" class="s">MEMORY_* injected at deploy</text>
  <rect x="1090" y="580" width="430" height="90" rx="14" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1305" y="614" text-anchor="middle" class="t" fill="#4A2EB0">CloudWatch Logs + traces</text>
  <text x="1305" y="638" text-anchor="middle" class="s">agent.sh logs --errors</text>
  <path d="M1295,250 L1295,292" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <path d="M1090,510 L1008,505" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="1010.7" y="475" width="78.6" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1050" y="490" text-anchor="middle" class="lbl">MCP + JWT</text>
  <path d="M295,690 L295,862 L1045,862 L1045,540 L1082,540" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="564.1" y="852" width="211.8" height="21" rx="5" fill="#F7F8FA"/>
  <text x="670" y="867" text-anchor="middle" class="lbl">copied into the agent image</text>
  <rect x="1090" y="740" width="430" height="100" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1305" y="774" text-anchor="middle" class="t" fill="#851651">NAMS</text>
  <text x="1305" y="798" text-anchor="middle" class="s">hosted memory, separate from the graph</text>
  <text x="1305" y="820" text-anchor="middle" class="s">MEMORY_API_KEY only</text>
  <path d="M1305,700 L1305,732" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
</svg>
