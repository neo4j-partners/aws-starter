<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Three parts of an Enterprise Knowledge Layer</title>
  <desc id="desc">Ontology, enterprise data, and memory flow into a shared Enterprise Knowledge Layer. The layer provides connected, governed context to agents, tools, and applications.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .heading { fill: #0f172a; font-size: 28px; font-weight: 700; }
      .detail { fill: #475569; font-size: 19px; font-weight: 500; }
      .output { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .flow { fill: none; stroke: #0f766e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .node-line { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Knowledge inputs -->
  <g filter="url(#shadow)">
    <rect x="80" y="42" width="320" height="132" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="480" y="42" width="320" height="132" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="880" y="42" width="320" height="132" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Ontology icon -->
  <g class="node-line">
    <line x1="124" y1="88" x2="155" y2="70"/>
    <line x1="124" y1="88" x2="157" y2="112"/>
    <line x1="155" y1="70" x2="157" y2="112"/>
    <circle cx="124" cy="88" r="8" fill="#ccfbf1"/>
    <circle cx="155" cy="70" r="8" fill="#ccfbf1"/>
    <circle cx="157" cy="112" r="8" fill="#ccfbf1"/>
  </g>
  <text x="190" y="91" class="heading">Ontology</text>
  <text x="190" y="123" class="detail">Meaning + rules</text>

  <!-- Enterprise data icon -->
  <g fill="#ccfbf1" stroke="#0f766e" stroke-width="3">
    <ellipse cx="530" cy="71" rx="31" ry="12"/>
    <path d="M499 71v39c0 7 14 13 31 13s31-6 31-13V71"/>
    <path d="M499 90c0 7 14 13 31 13s31-6 31-13" fill="none"/>
  </g>
  <text x="585" y="91" class="heading">Enterprise data</text>
  <text x="585" y="123" class="detail">Facts + sources</text>

  <!-- Memory icon -->
  <g fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M928 74a26 26 0 1 1-5 34"/>
    <path d="M911 94l12 14 15-11"/>
    <circle cx="928" cy="74" r="5" fill="#ccfbf1"/>
  </g>
  <text x="990" y="91" class="heading">Memory</text>
  <text x="990" y="123" class="detail">Actions + outcomes</text>

  <!-- Inputs flow into the shared layer -->
  <path class="flow" d="M240 174 V220 H515 V260"/>
  <path class="flow" d="M640 174 V260"/>
  <path class="flow" d="M1040 174 V220 H765 V260"/>

  <!-- Shared knowledge layer -->
  <g filter="url(#shadow)">
    <rect x="350" y="270" width="580" height="126" rx="24" fill="#ecfeff" stroke="#14b8a6" stroke-width="3"/>
  </g>
  <g transform="translate(402 307)" class="node-line">
    <line x1="8" y1="30" x2="45" y2="8"/>
    <line x1="8" y1="30" x2="45" y2="56"/>
    <line x1="45" y1="8" x2="82" y2="30"/>
    <line x1="45" y1="56" x2="82" y2="30"/>
    <circle cx="8" cy="30" r="8" fill="#ffffff"/>
    <circle cx="45" cy="8" r="8" fill="#ffffff"/>
    <circle cx="45" cy="56" r="8" fill="#ffffff"/>
    <circle cx="82" cy="30" r="8" fill="#ffffff"/>
  </g>
  <text x="535" y="326" fill="#0f172a" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="750">Enterprise Knowledge Layer</text>
  <text x="535" y="362" fill="#0f766e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600">Connected, governed context</text>

  <!-- Shared layer serves consumers -->
  <path class="flow" d="M515 396 V442 H240 V484"/>
  <path class="flow" d="M640 396 V484"/>
  <path class="flow" d="M765 396 V442 H1040 V484"/>

  <!-- Consumers -->
  <g filter="url(#shadow)">
    <rect x="80" y="494" width="320" height="96" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="480" y="494" width="320" height="96" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="880" y="494" width="320" height="96" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Agent icon and label -->
  <g fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="119" y="520" width="52" height="42" rx="10" fill="#ecfeff"/>
    <circle cx="135" cy="541" r="4" fill="#0f766e" stroke="none"/>
    <circle cx="155" cy="541" r="4" fill="#0f766e" stroke="none"/>
    <path d="M145 520v-9m-7 52h14"/>
  </g>
  <text x="200" y="550" class="output">Agents</text>

  <!-- Tool icon and label -->
  <g fill="#ecfeff" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M529 521a18 18 0 0 0 19 25l17 17 12-12-17-17a18 18 0 0 0-24-20l12 12-8 8z"/>
  </g>
  <text x="602" y="550" class="output">Tools</text>

  <!-- Application icon and label -->
  <g fill="#ecfeff" stroke="#0f766e" stroke-width="3" stroke-linejoin="round">
    <rect x="920" y="518" width="57" height="47" rx="6"/>
    <line x1="920" y1="531" x2="977" y2="531"/>
    <circle cx="931" cy="525" r="2" fill="#0f766e" stroke="none"/>
    <circle cx="940" cy="525" r="2" fill="#0f766e" stroke="none"/>
  </g>
  <text x="1002" y="550" class="output">Applications</text>
</svg>
