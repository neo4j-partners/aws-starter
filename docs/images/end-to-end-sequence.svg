<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>End-to-End Request</title>
  <desc>A user asks the supervisor about the most common faults. Claude on Bedrock picks the maintenance_specialist tool. The supervisor builds a new Maintenance Agent, which loops with Claude and calls read_neo4j_cypher through the AgentCore Gateway and the Neo4j MCP server until Claude has an answer. The specialist answer returns to the supervisor, Claude writes the final answer, and the supervisor streams it to the user as SSE events.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1110" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">End-to-End Request</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">One supervisor question, one specialist call, and the tool loop inside it.</text>
  <line x1="120" y1="168" x2="120" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="346" y1="168" x2="346" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="572" y1="168" x2="572" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="798" y1="168" x2="798" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1024" y1="168" x2="1024" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1250" y1="168" x2="1250" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1476" y1="168" x2="1476" y2="1095" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="25.0" y="110" width="190" height="58" rx="12" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="145" font-size="16" font-weight="700" fill="#344054" text-anchor="middle">User</text>
  <rect x="251.0" y="110" width="190" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="346" y="145" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="middle">Supervisor</text>
  <rect x="477.0" y="110" width="190" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="135" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="middle">Claude</text>
  <text x="572" y="155" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle">on Bedrock</text>
  <rect x="703.0" y="110" width="190" height="58" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="798" y="145" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="middle">Maintenance Agent</text>
  <rect x="929.0" y="110" width="190" height="58" rx="12" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024" y="145" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="middle">AgentCore Gateway</text>
  <rect x="1155.0" y="110" width="190" height="58" rx="12" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1250" y="135" font-size="15" font-weight="700" fill="#4A2EB0" text-anchor="middle">Runtime and</text>
  <text x="1250" y="155" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j MCP server</text>
  <rect x="1381.0" y="110" width="190" height="58" rx="12" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1476" y="145" font-size="16" font-weight="700" fill="#00594A" text-anchor="middle">Neo4j</text>
  <rect x="40" y="190" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="209" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">1. Route</text>
  <path d="M120,250 H340" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a-slate)"/>
  <rect x="111" y="226" width="244" height="21" rx="5" fill="#F7F8FA"/>
  <text x="233.0" y="241" font-size="13" font-weight="600" fill="#344054" text-anchor="middle">What are the most common faults?</text>
  <path d="M346,292 H566" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="330" y="268" width="259" height="21" rx="5" fill="#F7F8FA"/>
  <text x="459.0" y="283" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">supervisor prompt, question, tools</text>
  <path d="M572,334 H352" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="355" y="310" width="208" height="21" rx="5" fill="#F7F8FA"/>
  <text x="459.0" y="325" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">call maintenance_specialist</text>
  <rect x="40" y="358" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="377" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">2. Build the specialist</text>
  <path d="M346,418 H792" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="432" y="394" width="280" height="21" rx="5" fill="#F7F8FA"/>
  <text x="572.0" y="409" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">a new Maintenance Agent for this call</text>
  <path d="M798,460 H578" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="577" y="436" width="216" height="21" rx="5" fill="#F7F8FA"/>
  <text x="685.0" y="451" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">maintenance prompt, question</text>
  <rect x="40" y="484" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="503" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">3. Tool loop, until Claude answers</text>
  <rect x="462" y="520" width="1098" height="338" rx="10" fill="none" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="476" y="540" font-size="13" font-weight="700" fill="#5C6470" text-anchor="start">loop</text>
  <path d="M572,572 H792" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="599" y="548" width="172" height="21" rx="5" fill="#F7F8FA"/>
  <text x="685.0" y="563" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">call read_neo4j_cypher</text>
  <path d="M798,614 H1018" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#a-orange)"/>
  <rect x="814" y="590" width="194" height="21" rx="5" fill="#F7F8FA"/>
  <text x="911.0" y="605" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">MCP call_tool, Bearer JWT</text>
  <path d="M1024,656 H1244" fill="none" stroke="#7A5AF8" stroke-width="2" marker-end="url(#a-purple)"/>
  <rect x="1051" y="632" width="172" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1137.0" y="647" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">forward, Runtime token</text>
  <path d="M1250,698 H1470" fill="none" stroke="#008C72" stroke-width="2" marker-end="url(#a-teal)"/>
  <rect x="1298" y="674" width="129" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1363.0" y="689" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">read-only Cypher</text>
  <path d="M1476,740 H1256" fill="none" stroke="#008C72" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-teal)"/>
  <rect x="1331" y="716" width="64" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1363.0" y="731" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">records</text>
  <path d="M1250,782 H804" fill="none" stroke="#7A5AF8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-purple)"/>
  <rect x="884" y="758" width="280" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1024.0" y="773" font-size="13" font-weight="600" fill="#4A2EB0" text-anchor="middle">tool result, back through the Gateway</text>
  <path d="M798,824 H578" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="638" y="800" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="685.0" y="815" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">tool result</text>
  <rect x="40" y="872" width="1520" height="28" rx="6" fill="#E4E7EC" fill-opacity="0.6"/>
  <text x="54" y="891" font-size="14" font-weight="700" fill="#16233A" text-anchor="start">4. Answer</text>
  <path d="M572,924 H792" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="617" y="900" width="136" height="21" rx="5" fill="#F7F8FA"/>
  <text x="685.0" y="915" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">specialist answer</text>
  <path d="M798,964 H352" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="525" y="940" width="93" height="21" rx="5" fill="#F7F8FA"/>
  <text x="572.0" y="955" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">tool result</text>
  <path d="M346,1004 H566" fill="none" stroke="#2E6DB4" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="391" y="980" width="136" height="21" rx="5" fill="#F7F8FA"/>
  <text x="459.0" y="995" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">specialist answer</text>
  <path d="M572,1044 H352" fill="none" stroke="#2E6DB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="409" y="1020" width="100" height="21" rx="5" fill="#F7F8FA"/>
  <text x="459.0" y="1035" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">final answer</text>
  <path d="M346,1084 H126" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="168" y="1060" width="129" height="21" rx="5" fill="#F7F8FA"/>
  <text x="233.0" y="1075" font-size="13" font-weight="600" fill="#344054" text-anchor="middle">SSE chunk events</text>
</svg>
