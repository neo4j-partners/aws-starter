  <text x="1440.0" y="358" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j driver, read routing</text>
  <text x="1440.0" y="380" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">operational graph</text>
  <text x="1440.0" y="402" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">operating limits</text>
  <text x="1440.0" y="424" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">manual chunks</text>
  <text x="1440.0" y="446" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">chunk indexes</text>
  <path d="M1250,245 H1285 V360 H1316" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <path d="M1250,495 H1285 V420 H1316" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="1320" y="552" width="240" height="224" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="1440.0" y="584" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Neo4j login</text>
  <text x="1440.0" y="610" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">local: .env password</text>
  <text x="1440.0" y="632" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">cloud: Secrets Manager</text>
  <text x="1440.0" y="654" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">NEO4J_PASSWORD_SECRET_ARN</text>
  <text x="1440.0" y="682" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">A local run with the ARN set</text>
  <text x="1440.0" y="700" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">also reads the secret.</text>
  <text x="1440.0" y="726" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">On Unauthorized, the driver reads</text>
  <text x="1440.0" y="744" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">the secret again and retries only</text>
  <text x="1440.0" y="762" font-size="12" font-weight="400" font-style="italic" fill="#5C6470" text-anchor="middle">when the login changed.</text>
  <path d="M1440,552 V484" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="320" y="630" width="270" height="146" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
