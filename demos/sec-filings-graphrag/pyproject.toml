[project]
name = "sec-filings-graphrag"
version = "0.1.0"
description = "A small SEC-filings GraphRAG retrieval comparison using Neo4j and Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "ipykernel",
    "neo4j",
    "neo4j-graphrag[bedrock]>=1.18",
    "pypdf",
    "python-dotenv",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
# Leave the Python blocks in Markdown docs as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
