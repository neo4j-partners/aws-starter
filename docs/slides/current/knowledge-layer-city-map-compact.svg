<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">The ontology is a map to operational data</title>
  <desc id="description">Inside the Knowledge Layer ontology, the PURCHASE business concept maps to a description of the Salesforce Opportunity table. Outside the ontology boundary, a pointer leads to the actual opportunity records that remain in Salesforce.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .boundary-label { fill: #0f766e; font-size: 17px; font-weight: 800; letter-spacing: 1.4px; }
      .eyebrow { fill: #0f766e; font-size: 15px; font-weight: 800; letter-spacing: 1.2px; }
      .title { fill: #0f172a; font-size: 28px; font-weight: 780; }
      .copy { fill: #475569; font-size: 18px; }
      .small { fill: #64748b; font-size: 15px; font-weight: 650; }
      .route { fill: #0f766e; font-size: 15px; font-weight: 800; letter-spacing: 0.6px; text-anchor: middle; }
      .data-label { fill: #ffffff; font-size: 25px; font-weight: 780; }
      .data-copy { fill: #ccfbf1; font-size: 17px; font-weight: 600; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- The dashed line makes the ontology boundary explicit. -->
  <rect x="24" y="38" width="652" height="462" rx="28" fill="#f8fafc" stroke="#14b8a6" stroke-width="3" stroke-dasharray="11 9"/>
  <rect x="54" y="21" width="302" height="36" rx="18" fill="#ccfbf1"/>
  <text class="boundary-label" x="72" y="45">KNOWLEDGE LAYER ONTOLOGY</text>

  <!-- Semantic mapping route behind the two descriptions. -->
  <path d="M265 255C329 255 371 255 435 255" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="272" y="211" width="156" height="29" rx="14.5" fill="#ecfeff" stroke="#5eead4"/>
  <text class="route" x="350" y="231">SEMANTIC MAPPING</text>

  <!-- Domain description. -->
  <g filter="url(#shadow)">
    <rect x="50" y="112" width="215" height="286" rx="22" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
  </g>
  <circle cx="169" cy="166" r="30" fill="#ccfbf1"/>
  <circle cx="158" cy="165" r="6" fill="#0f766e"/>
  <circle cx="179" cy="151" r="6" fill="#0f766e"/>
  <circle cx="182" cy="179" r="6" fill="#0f766e"/>
  <path d="M163 162L174 154M164 169L176 176" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/>
  <text class="eyebrow" x="76" y="224">DOMAIN ONTOLOGY</text>
  <text class="title" x="76" y="270">PURCHASE</text>
  <text class="copy" x="76" y="306">Business concept</text>
  <text class="copy" x="76" y="330">and relationships</text>
  <rect x="85" y="351" width="149" height="28" rx="14" fill="#ccfbf1"/>
  <text class="small" x="159.5" y="370" text-anchor="middle" fill="#0f766e">MAP LEGEND</text>

  <!-- Technical description. -->
  <g filter="url(#shadow)">
    <rect x="435" y="112" width="215" height="286" rx="22" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
  </g>
  <path d="M505 148h52a8 8 0 0 1 8 8v44a8 8 0 0 1-8 8h-52a8 8 0 0 1-8-8v-44a8 8 0 0 1 8-8Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <path d="M497 167h68M514 148v60" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text class="eyebrow" x="461" y="224">TECHNICAL ONTOLOGY</text>
  <text class="title" x="461" y="270">Salesforce</text>
  <text class="copy" x="461" y="306">Opportunity table</text>
  <text class="copy" x="461" y="330">description + location</text>
  <rect x="461" y="351" width="151" height="28" rx="14" fill="#ccfbf1"/>
  <text class="small" x="536.5" y="370" text-anchor="middle" fill="#0f766e">MAP DESTINATION</text>

  <!-- Pointer crosses the ontology boundary to the actual operational system. -->
  <path d="M542 398V528" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="397" y="456" width="122" height="29" rx="14.5" fill="#ffffff" stroke="#5eead4"/>
  <text class="route" x="458" y="476">QUERY IN PLACE</text>

  <!-- Live data stays outside the ontology. -->
  <g filter="url(#shadow)">
    <rect x="58" y="538" width="584" height="180" rx="24" fill="#0f766e"/>
  </g>
  <g transform="translate(91 573)" fill="none" stroke="#ccfbf1" stroke-width="3">
    <ellipse cx="30" cy="8" rx="28" ry="9" fill="#115e59"/>
    <path d="M2 8v54c0 5 13 9 28 9s28-4 28-9V8" fill="#115e59"/>
    <path d="M2 26c0 5 13 9 28 9s28-4 28-9M2 44c0 5 13 9 28 9s28-4 28-9"/>
  </g>
  <text class="eyebrow" x="180" y="575" fill="#99f6e4">ENTERPRISE DATA</text>
  <text class="data-label" x="180" y="615">Actual opportunity records</text>
  <text class="data-copy" x="180" y="648">Live rows remain in the Salesforce operational system.</text>
  <text class="data-copy" x="180" y="676">The ontology describes where to find and how to use them.</text>
</svg>
