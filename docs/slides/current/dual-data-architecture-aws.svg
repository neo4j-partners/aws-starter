<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="510" viewBox="16 88 1148 510" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#146EB4"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9900"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A87E0D"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- AWS data lake -->
  <rect x="40" y="104" width="470" height="472" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#shadow)"/>
  <path d="M40,148 V118 a14,14 0 0 1 14,-14 H496 a14,14 0 0 1 14,14 V148 Z" fill="#232F3E"/>
  <text x="62" y="133" font-size="14.5" font-weight="700" fill="#FFFFFF">Amazon SageMaker Lakehouse</text>
  <text x="488" y="133" text-anchor="end" font-size="10" fill="#FF9900">AWS Glue Data Catalog + Lake Formation</text>

  <text x="275" y="184" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Financial activity in open tables</text>

  <rect x="60" y="204" width="430" height="218" rx="10" fill="#F2F8FC" stroke="#9CC9E4" stroke-width="1.3"/>
  <text x="80" y="232" font-size="12.5" font-weight="700" fill="#146EB4">AMAZON S3 TABLES</text>
  <text x="472" y="232" text-anchor="end" font-size="9.5" font-style="italic" fill="#5E97C9">mounted in AWS Glue Data Catalog</text>

  <g fill="#FFFFFF" stroke="#6FAED2" stroke-width="1.2">
    <rect x="80" y="260" width="178" height="42" rx="7"/>
    <rect x="292" y="260" width="178" height="42" rx="7"/>
    <rect x="80" y="322" width="178" height="42" rx="7"/>
    <rect x="292" y="322" width="178" height="42" rx="7"/>
  </g>
  <g font-size="13" font-weight="700" fill="#16233A" text-anchor="middle">
    <text x="169" y="286">customers</text>
    <text x="381" y="286">accounts</text>
    <text x="169" y="348">transactions</text>
    <text x="381" y="348">merchants</text>
  </g>
  <text x="80" y="397" font-size="11" font-style="italic" fill="#5E6B78">+ alerts · cases · channels · review outcomes</text>

  <rect x="60" y="444" width="430" height="100" rx="10" fill="#FFF7E8" stroke="#FF9900" stroke-width="1.5"/>
  <text x="80" y="470" font-size="12.5" font-weight="700" fill="#9B5C00">CURATED RESULTS IN AMAZON S3</text>
  <rect x="80" y="488" width="188" height="32" rx="7" fill="#FFFFFF" stroke="#F2BA60"/>
  <text x="174" y="509" text-anchor="middle" font-size="12.5" font-family="Menlo, monospace" font-weight="700" fill="#9B5C00">fraud_candidates</text>
  <text x="282" y="509" font-size="10.5" fill="#8E6B35">graph findings for analytics</text>

  <!-- Neo4j graph -->
  <rect x="670" y="104" width="470" height="472" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#shadow)"/>
  <path d="M670,148 V118 a14,14 0 0 1 14,-14 H1126 a14,14 0 0 1 14,14 V148 Z" fill="#018BFF"/>
  <path d="M690,123 L695,128 L690,133 L685,128 Z" fill="#FFFFFF"/>
  <text x="706" y="133" font-size="14.5" font-weight="700" fill="#FFFFFF">Neo4j Fraud Knowledge Graph</text>

  <!-- Knowledge layer: policies and typologies provide meaning for the fraud graph. -->
  <rect x="690" y="156" width="430" height="158" rx="10" fill="#FFFAEC" stroke="#D4A017" stroke-width="1.4"/>
  <text x="708" y="176" font-size="12.5" font-weight="700" fill="#92660A">KNOWLEDGE LAYER</text>
  <text x="1102" y="176" text-anchor="end" font-size="9.5" font-style="italic" fill="#B79A4E">policies, typologies &amp; investigation guidance</text>
  <text x="844" y="193" text-anchor="middle" font-size="9" fill="#A87E0D">HAS_CHUNK</text>

  <rect x="712" y="199" width="120" height="34" rx="17" fill="#FFEFC2" stroke="#D4A017" stroke-width="1.3"/>
  <text x="772" y="221" text-anchor="middle" font-size="12.5" fill="#6B4E07">Policy</text>
  <rect x="856" y="199" width="120" height="34" rx="17" fill="#FFEFC2" stroke="#D4A017" stroke-width="1.3"/>
  <text x="916" y="221" text-anchor="middle" font-size="12.5" fill="#6B4E07">Document Chunk</text>
  <rect x="1000" y="199" width="120" height="34" rx="17" fill="#FFEFC2" stroke="#D4A017" stroke-width="1.3"/>
  <text x="1060" y="221" text-anchor="middle" font-size="12.5" fill="#6B4E07">Playbook</text>
  <line x1="834" y1="216" x2="854" y2="216" stroke="#A87E0D" stroke-width="1.4" marker-end="url(#arrow-gold)"/>
  <text x="1060" y="248" text-anchor="middle" font-size="9" font-style="italic" fill="#B79A4E">rule &#183; version &#183; applicability</text>

  <line x1="916" y1="235" x2="916" y2="253" stroke="#A87E0D" stroke-width="1.4" marker-end="url(#arrow-gold)"/>
  <text x="924" y="248" font-size="9" fill="#A87E0D">DESCRIBES</text>
  <rect x="836" y="255" width="160" height="34" rx="17" fill="#FFFFFF" stroke="#66AEE8" stroke-width="1.3"/>
  <text x="916" y="277" text-anchor="middle" font-size="12" fill="#0B4C7F">Customer &#183; Account</text>
  <text x="708" y="306" font-size="11" font-style="italic" fill="#B79A4E">document_type: policy &#183; typology &#183; playbook &#183; regulation</text>

  <!-- The two bindings make investigation guidance actionable and traceable. -->
  <line x1="800" y1="316" x2="800" y2="384" stroke="#4B5563" stroke-width="2.8" marker-end="url(#arrow-slate)"/>
  <line x1="1012" y1="384" x2="1012" y2="316" stroke="#4B5563" stroke-width="2.8" marker-end="url(#arrow-slate)"/>
  <rect x="714" y="326" width="172" height="44" rx="8" fill="#EEF1F5" stroke="#C3CAD3" stroke-width="1"/>
  <text x="800" y="341" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E3540">GOVERNS</text>
  <text x="800" y="354" text-anchor="middle" font-size="9" fill="#4B5563">risk rules apply to</text>
  <text x="800" y="365" text-anchor="middle" font-size="9" fill="#4B5563">accounts and activity</text>
  <rect x="926" y="326" width="172" height="44" rx="8" fill="#EEF1F5" stroke="#C3CAD3" stroke-width="1"/>
  <text x="1012" y="341" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E3540">CITES</text>
  <text x="1012" y="354" text-anchor="middle" font-size="9" fill="#4B5563">alerts retain source</text>
  <text x="1012" y="365" text-anchor="middle" font-size="9" fill="#4B5563">rule and version</text>

  <!-- Operational fraud instance graph -->
  <rect x="690" y="384" width="430" height="182" rx="10" fill="#E5F1FF" stroke="#018BFF" stroke-width="1.4"/>
  <text x="708" y="407" font-size="12.5" font-weight="700" fill="#0166BC">OPERATIONAL FRAUD GRAPH</text>
  <text x="1102" y="407" text-anchor="end" font-size="9.5" font-style="italic" fill="#5E97C9">connected financial data</text>
  <line x1="804" y1="449" x2="904" y2="449" stroke="#3D82C4" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="854" y="442" text-anchor="middle" font-size="9" fill="#3D82C4">OWNS</text>
  <line x1="758" y1="462" x2="758" y2="507" stroke="#3D82C4" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="764" y="489" font-size="9" fill="#3D82C4">USED_DEVICE</text>
  <line x1="960" y1="462" x2="960" y2="507" stroke="#3D82C4" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="968" y="489" font-size="9" fill="#3D82C4">PAID</text>
  <g fill="#FFFFFF" stroke="#66AEE8" stroke-width="1.3">
    <rect x="712" y="432" width="92" height="30" rx="15"/>
    <rect x="908" y="432" width="104" height="30" rx="15"/>
    <rect x="712" y="508" width="92" height="30" rx="15"/>
    <rect x="908" y="508" width="154" height="30" rx="15"/>
  </g>
  <g font-size="12" fill="#0B4C7F" text-anchor="middle">
    <text x="758" y="452">Customer</text>
    <text x="960" y="452">Account</text>
    <text x="758" y="528">Device</text>
    <text x="985" y="528">Merchant</text>
  </g>
  <text x="708" y="555" font-size="11" font-style="italic" fill="#5E97C9">+ phones &#183; addresses &#183; identity tokens &#183; suspicious transfers</text>

  <!-- Investigation guidance governs the source records as well as the graph. -->
  <line x1="686" y1="262" x2="498" y2="272" stroke="#A87E0D" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-gold)"/>
  <text x="592" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92660A">GOVERNS the source data</text>
  <text x="592" y="236" text-anchor="middle" font-size="10" fill="#92660A">investigation guidance binds the tables:</text>
  <text x="592" y="249" text-anchor="middle" font-size="10" fill="#92660A">rules, thresholds, and escalation criteria</text>

  <!-- Bidirectional connector -->
  <text x="590" y="395" text-anchor="middle" font-size="9" fill="#146EB4">ingest: S3 Tables → graph</text>
  <line x1="510" y1="407" x2="670" y2="407" stroke="#146EB4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="590" y="429" text-anchor="middle" font-size="10.5" font-weight="700" fill="#146EB4">Neo4j Connector</text>
  <text x="590" y="442" text-anchor="middle" font-size="10.5" font-weight="700" fill="#146EB4">for AWS Glue</text>
  <line x1="670" y1="462" x2="510" y2="462" stroke="#146EB4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="590" y="479" text-anchor="middle" font-size="9" fill="#146EB4">write-back: graph findings → S3 results</text>
</svg>
