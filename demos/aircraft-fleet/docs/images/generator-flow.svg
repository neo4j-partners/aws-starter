<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Fleet Data Generator</title>
  <desc>generate-data seeds one Python and one NumPy random generator, then writes six stages in order into a temp directory: fleet topology, hourly sensor readings, maintenance events from band crossings, flight operations grounded by CRITICAL events, component removals with reasons from earlier faults, and the stamp. A publish step moves the CSVs into the output directory and the stamp last. validate checks every reference column.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="990" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Fleet Data Generator</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">One seed drives every stage. Each stage reads what the stages before it produced.</text>
  <rect x="40" y="150" width="270" height="210" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.0" y="182" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">GeneratorConfig</text>
  <text x="175.0" y="208" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">aircraft, airports, days</text>
  <text x="175.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">seed (default 42)</text>
  <text x="175.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">random.Random(seed)</text>
  <text x="175.0" y="274" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">default_rng(seed)</text>
  <text x="175.0" y="296" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">setup.sh: 30 aircraft, 90 days</text>
  <path d="M310,255 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="150" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <circle cx="390" cy="182.0" r="15" fill="#2E6DB4"/>
  <text x="390" y="187.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="418" y="174" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">Fleet topology</text>
  <text x="418" y="194" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Aircraft with Engine, Avionics, and Hydraulics systems, their components and sensors</text>
  <rect x="1043" y="169.0" width="163" height="26" rx="13" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="1124.7" y="187.0" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">4 node + 3 rel CSVs</text>
  <rect x="360" y="250" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#008C72" stroke-width="1.5"/>
  <circle cx="390" cy="282.0" r="15" fill="#008C72"/>
  <text x="390" y="287.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="418" y="274" font-size="16" font-weight="700" fill="#00594A" text-anchor="start">Sensor readings</text>
  <text x="418" y="294" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Hourly values: baseline, drift toward the bad side scaled by the operator, noise, spikes</text>
  <rect x="1051" y="269.0" width="155" height="26" rx="13" fill="#E8F6F2" stroke="#008C72" stroke-width="1.5"/>
  <text x="1128.3999999999999" y="287.0" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">nodes_readings.csv</text>
  <path d="M390,214 V246" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="350" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#C11574" stroke-width="1.5"/>
  <circle cx="390" cy="382.0" r="15" fill="#C11574"/>
  <text x="390" y="387.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="418" y="374" font-size="16" font-weight="700" fill="#851651" text-anchor="start">Maintenance events</text>
  <text x="418" y="394" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Entering a higher band may raise an event. The crossing side picks the fault and part.</text>
  <rect x="1006" y="369.0" width="200" height="26" rx="13" fill="#FDF2FA" stroke="#C11574" stroke-width="1.5"/>
  <text x="1106.2" y="387.0" font-size="13" font-weight="600" fill="#851651" text-anchor="middle">MINOR / MAJOR / CRITICAL</text>
  <path d="M390,314 V346" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="450" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="390" cy="482.0" r="15" fill="#D97706"/>
  <text x="390" y="487.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="418" y="474" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">Flight operations</text>
  <text x="418" y="494" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Hub-and-spoke legs. A CRITICAL event grounds the aircraft for the rest of that day.</text>
  <rect x="999" y="469.0" width="207" height="26" rx="13" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="1102.5" y="487.0" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="middle">airports, flights, delays</text>
  <path d="M390,414 V446" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="550" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#C11574" stroke-width="1.5"/>
  <circle cx="390" cy="582.0" r="15" fill="#C11574"/>
  <text x="390" y="587.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="418" y="574" font-size="16" font-weight="700" fill="#851651" text-anchor="start">Component removals</text>
  <text x="418" y="594" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Rate rises with CRITICAL events. The reason is the part&#x27;s earlier fault, or inspection.</text>
  <rect x="1051" y="569.0" width="155" height="26" rx="13" fill="#FDF2FA" stroke="#C11574" stroke-width="1.5"/>
  <text x="1128.3999999999999" y="587.0" font-size="13" font-weight="600" fill="#851651" text-anchor="middle">nodes_removals.csv</text>
  <path d="M390,514 V546" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="650" width="860" height="64" rx="12" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <circle cx="390" cy="682.0" r="15" fill="#667085"/>
  <text x="390" y="687.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="418" y="674" font-size="16" font-weight="700" fill="#344054" text-anchor="start">Stamp</text>
  <text x="418" y="694" font-size="13.5" font-weight="400" fill="#5C6470" text-anchor="start">Config, generator code hash, and runtime versions, written after every CSV</text>
  <rect x="1103" y="669.0" width="103" height="26" rx="13" fill="#F2F4F7" stroke="#667085" stroke-width="1.5"/>
  <text x="1154.3" y="687.0" font-size="13" font-weight="600" fill="#344054" text-anchor="middle">.stamp.json</text>
  <path d="M390,614 V646" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <path d="M1220,282 H1250 V370 H1224" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <text x="1262" y="324" font-size="13" font-weight="600" fill="#00594A" text-anchor="start">series per system</text>
  <path d="M1220,396 H1290 V582 H1224" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <path d="M1290,482 H1224" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <text x="1302" y="440" font-size="13" font-weight="600" fill="#851651" text-anchor="start">maintenance rows</text>
  <text x="1302" y="458" font-size="13" font-weight="600" fill="#851651" text-anchor="start">ground flights and</text>
  <text x="1302" y="476" font-size="13" font-weight="600" fill="#851651" text-anchor="start">drive removals</text>
  <rect x="40" y="400" width="270" height="320" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="175" y="432" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">Atomic output</text>
  <text x="175" y="462" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">An exclusive lock blocks a</text>
  <text x="175" y="488" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">second generate or a load.</text>
  <text x="175" y="514" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Stages write into</text>
  <text x="175" y="540" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">generated/.generating-*.</text>
  <text x="175" y="566" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Publish clears the old stamp,</text>
  <text x="175" y="592" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">moves the CSVs, then moves</text>
  <text x="175" y="618" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the stamp last.</text>
  <text x="175" y="644" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">A failed run leaves the old</text>
  <text x="175" y="670" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">output and stamp in place.</text>
  <text x="790" y="770" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">Checks on the published output</text>
  <rect x="360" y="790" width="400" height="120" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.0" y="822" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">generate-data validate</text>
  <text x="560.0" y="848" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">every rels_* column and readings&#x27; sensor_id,</text>
  <text x="560.0" y="870" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">duplicate IDs, missing files; exits 1</text>
  <rect x="820" y="790" width="400" height="120" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="822" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">generate --if-stale</text>
  <text x="1020.0" y="848" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">skips the run when .stamp.json matches;</text>
  <text x="1020.0" y="870" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">load records it; verify --strict checks it</text>
  <text x="800" y="955" font-size="15" font-weight="400" fill="#5C6470" text-anchor="middle">Same seed, same config, same code: the same CSVs. The stamp is what lets later steps tell a current dataset from a stale one.</text>
</svg>
