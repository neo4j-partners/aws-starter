<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">Applications, agents, and tools continuously query the Knowledge Layer</title>
  <desc id="description">Applications, agents, and tools exchange queries and responses with a shared Knowledge Layer composed of the Knowledge Layer ontology, Enterprise data, and Memory.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .consumer { fill: #0f172a; font-size: 22px; font-weight: 750; text-anchor: middle; }
      .consumer-detail { fill: #64748b; font-size: 15px; font-weight: 500; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 31px; font-weight: 750; text-anchor: middle; }
      .layer-copy { fill: #ccfbf1; font-size: 16px; font-weight: 500; text-anchor: middle; }
      .component-title { fill: #0f172a; font-size: 20px; font-weight: 750; text-anchor: middle; }
      .component-detail { fill: #475569; font-size: 14px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Consumers -->
  <g filter="url(#shadow)">
    <rect x="30" y="28" width="200" height="104" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="250" y="28" width="200" height="104" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="470" y="28" width="200" height="104" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <g fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5">
    <rect x="112" y="47" width="36" height="28" rx="4"/>
    <path d="M118 54h24M118 61h17M118 68h20" fill="none"/>
    <circle cx="350" cy="61" r="17"/>
    <path d="M341 61h18M350 52v18" fill="none" stroke-linecap="round"/>
    <path d="M558 49h24v24h-24zM564 43v6M576 43v6M564 73v6M576 73v6M552 55h6M552 67h6M582 55h6M582 67h6" fill="none" stroke-linecap="round"/>
  </g>
  <text class="consumer" x="130" y="103">Apps</text>
  <text class="consumer-detail" x="130" y="123">query the layer</text>
  <text class="consumer" x="350" y="103">Agents</text>
  <text class="consumer-detail" x="350" y="123">query the layer</text>
  <text class="consumer" x="570" y="103">Tools</text>
  <text class="consumer-detail" x="570" y="123">query the layer</text>

  <!-- Continuous exchange -->
  <g fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M130 145v80"/>
    <path d="M350 145v80"/>
    <path d="M570 145v80"/>
  </g>
  <rect x="237" y="163" width="226" height="42" rx="21" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <text x="350" y="190" text-anchor="middle" fill="#0f766e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="750">CONTINUOUS QUERY + RESPONSE</text>

  <!-- Knowledge Layer -->
  <g filter="url(#shadow)">
    <rect x="30" y="238" width="640" height="440" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <path d="M54 238h592a24 24 0 0 1 24 24v82H30v-82a24 24 0 0 1 24-24Z" fill="#0f766e"/>
  </g>
  <text class="layer-title" x="350" y="285">Knowledge Layer</text>
  <text class="layer-copy" x="350" y="316">One shared, governed substrate</text>

  <!-- Three peer components -->
  <g filter="url(#shadow)">
    <rect x="52" y="375" width="188" height="188" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="256" y="375" width="188" height="188" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="460" y="375" width="188" height="188" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>

  <!-- Ontology icon -->
  <g fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <line x1="118" y1="425" x2="146" y2="409"/>
    <line x1="118" y1="425" x2="148" y2="447"/>
    <line x1="146" y1="409" x2="148" y2="447"/>
    <circle cx="118" cy="425" r="7"/>
    <circle cx="146" cy="409" r="7"/>
    <circle cx="148" cy="447" r="7"/>
  </g>
  <text class="component-title" x="146" y="489">Knowledge Layer</text>
  <text class="component-title" x="146" y="514">ontology</text>
  <text class="component-detail" x="146" y="543">Meaning, mappings,</text>
  <text class="component-detail" x="146" y="561">rules + accountability</text>

  <!-- Enterprise data icon -->
  <g fill="#e2e8f0" stroke="#475569" stroke-width="2.5">
    <ellipse cx="350" cy="410" rx="28" ry="10"/>
    <path d="M322 410v38c0 6 13 11 28 11s28-5 28-11v-38"/>
    <path d="M322 429c0 6 13 11 28 11s28-5 28-11" fill="none"/>
  </g>
  <text class="component-title" x="350" y="489">Enterprise data</text>
  <text class="component-detail" x="350" y="527">Authoritative facts</text>
  <text class="component-detail" x="350" y="547">from governed systems</text>

  <!-- Memory icon -->
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M555 404a27 27 0 1 1-8 37"/>
    <path d="M538 429l9 12 14-9"/>
    <circle cx="555" cy="404" r="5" fill="#ccfbf1"/>
  </g>
  <text class="component-title" x="554" y="489">Memory</text>
  <text class="component-detail" x="554" y="527">Previous actions,</text>
  <text class="component-detail" x="554" y="547">decisions + outcomes</text>

  <line x1="70" y1="599" x2="630" y2="599" stroke="#99f6e4" stroke-width="2"/>
  <text x="350" y="633" text-anchor="middle" fill="#0f172a" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700">SHARED · GOVERNED · QUERYABLE · ACTIONABLE</text>

  <text x="350" y="727" text-anchor="middle" fill="#0f766e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="750">Context stays current because consumers query while they work.</text>
</svg>
