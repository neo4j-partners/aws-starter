<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The cloud data and AI stack</title>
  <desc id="description">Six layers in two groups. AI layers: apps, agents, context. Data layers: operational data, lakehouse, infrastructure. Agent governance runs across every layer.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .canvas { fill: #ffffff; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 2.5px; fill: #64748b; }
      .title { font-size: 40px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 21px; fill: #475569; }
      .head { fill: #0f172a; }
      .head-text { font-size: 22px; font-weight: 750; fill: #ffffff; }
      .label { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .label-text { font-size: 21px; font-weight: 750; fill: #0f172a; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cell-iceberg { fill: #ecfeff; stroke: #14b8a6; stroke-width: 2; }
      .cell-delta { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .cell-text { font-size: 19px; font-weight: 600; fill: #334155; }
      .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .layer-name { font-size: 24px; font-weight: 750; fill: #0f172a; }
      .ai-chip { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .data-chip { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; }
      .gov { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .gov-chip { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .chip-text { font-size: 20px; font-weight: 620; fill: #1e293b; }
      .pill-text { font-size: 15px; font-weight: 750; }
      .legend-text { font-size: 17px; font-weight: 600; fill: #475569; }
      .foot { font-size: 18px; fill: #475569; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="60" y="92">The Cloud Data and AI Stack</text>
  <text class="subtitle" x="60" y="130">Each layer depends on the one below it. Agents need context, context needs data, data needs compute.</text>
  <text class="eyebrow" x="60" y="200">AI LAYERS</text>
  <rect class="layer" x="60" y="216" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="267.4">Apps</tspan></text>
  <rect class="ai-chip" x="380" y="236" width="205" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="482.5" y="266.0">Enterprise chat</tspan></text>
  <rect class="ai-chip" x="601" y="236" width="172" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="687.0" y="266.0">App builders</tspan></text>
  <rect class="ai-chip" x="789" y="236" width="227" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="902.5" y="266.0">Coding assistants</tspan></text>
  <rect class="layer" x="60" y="312" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="363.4">Agents</tspan></text>
  <rect class="ai-chip" x="380" y="332" width="194" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="477.0" y="362.0">Agent platform</tspan></text>
  <rect class="ai-chip" x="590" y="332" width="106" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="643.0" y="362.0">Models</tspan></text>
  <rect class="ai-chip" x="712" y="332" width="106" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="765.0" y="362.0">Memory</tspan></text>
  <rect class="ai-chip" x="834" y="332" width="150" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="909.0" y="362.0">Evaluation</tspan></text>
  <rect class="layer" x="60" y="408" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="459.4">Context</tspan></text>
  <rect class="ai-chip" x="380" y="428" width="183" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="471.5" y="458.0">Context graph</tspan></text>
  <rect class="ai-chip" x="579" y="428" width="194" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="676.0" y="458.0">Semantic layer</tspan></text>
  <rect class="ai-chip" x="789" y="428" width="216" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="897.0" y="458.0">Business catalog</tspan></text>
  <text class="eyebrow" x="60" y="540">DATA LAYERS</text>
  <rect class="layer" x="60" y="556" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="607.4">Operational data</tspan></text>
  <rect class="data-chip" x="380" y="576" width="260" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="510.0" y="606.0">Operational database</tspan></text>
  <rect class="data-chip" x="656" y="576" width="139" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="725.5" y="606.0">Streaming</tspan></text>
  <rect class="layer" x="60" y="652" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="703.4">Lakehouse</tspan></text>
  <rect class="data-chip" x="380" y="672" width="161" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="460.5" y="702.0">Open tables</tspan></text>
  <rect class="data-chip" x="557" y="672" width="172" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="643.0" y="702.0">Data catalog</tspan></text>
  <rect class="layer" x="60" y="748" width="1190" height="86" rx="16" filter="url(#shadow)"/>
  <text class="layer-name" text-anchor="start"><tspan x="92" y="799.4">Infrastructure</tspan></text>
  <rect class="data-chip" x="380" y="768" width="172" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="466.0" y="798.0">Custom chips</tspan></text>
  <rect class="data-chip" x="568" y="768" width="161" height="46" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="648.5" y="798.0">NVIDIA GPUs</tspan></text>
  <text class="eyebrow" x="1284" y="200">ACROSS EVERY LAYER</text>
  <rect class="gov" x="1284" y="216" width="256" height="618" rx="16"/>
  <text class="layer-name" text-anchor="middle"><tspan x="1412" y="259.4">Agent</tspan><tspan x="1412" y="289.4">governance</tspan></text>
  <rect class="gov-chip" x="1316" y="356" width="192" height="60" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="1412" y="393.0">Identity</tspan></text>
  <rect class="gov-chip" x="1316" y="476" width="192" height="60" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="1412" y="513.0">Registry</tspan></text>
  <rect class="gov-chip" x="1316" y="596" width="192" height="60" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="1412" y="633.0">Gateway</tspan></text>
  <rect class="gov-chip" x="1316" y="716" width="192" height="60" rx="12"/>
  <text class="chip-text" text-anchor="middle"><tspan x="1412" y="753.0">Policy</tspan></text>
</svg>
