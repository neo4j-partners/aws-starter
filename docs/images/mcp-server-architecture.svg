<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Neo4j MCP Server on AgentCore</title>
  <desc>An agent gets a JWT from Amazon Cognito with the client credentials grant and sends an MCP request to the AgentCore Gateway. The Gateway validates the JWT. The Gateway Target gets a Runtime token from the OAuth2 credential provider and forwards the request to the AgentCore Runtime. The Neo4j MCP server runs read-only Cypher on Neo4j. A custom resource Lambda creates the provider and a second one waits for the Runtime. ECR holds the image, Secrets Manager holds the Neo4j password, and CloudWatch receives logs and traces.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="840" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Neo4j MCP Server on AgentCore</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">One stack per deployment. Agents call the Gateway, and the Gateway calls the Runtime with its own token.</text>
  <rect x="40" y="345" width="240" height="140" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="377" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Agent or MCP client</text>
  <text x="160.0" y="403" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">quickstart, supervisor</text>
  <text x="160.0" y="425" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fraud agent, Databricks</text>
  <rect x="380" y="130" width="300" height="150" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.0" y="162" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Amazon Cognito</text>
  <text x="530.0" y="188" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">user pool, no users</text>
  <text x="530.0" y="210" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">machine client</text>
  <text x="530.0" y="232" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">{stack}-mcp/invoke scope</text>
  <rect x="420" y="340" width="280" height="150" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.0" y="372" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">AgentCore Gateway</text>
  <text x="560.0" y="398" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">JWT authorizer</text>
  <text x="560.0" y="420" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">allows the machine client</text>
  <text x="560.0" y="442" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">MCP 2025-03-26</text>
  <rect x="780" y="130" width="260" height="150" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="910.0" y="162" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">OAuth2 provider</text>
  <text x="910.0" y="188" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">AgentCore Identity</text>
  <text x="910.0" y="210" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">holds the client secret</text>
  <rect x="780" y="340" width="260" height="150" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="910.0" y="372" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Gateway Target</text>
  <text x="910.0" y="398" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">neo4j-mcp-server-target</text>
  <text x="910.0" y="420" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">OAuth2 credentials</text>
  <text x="910.0" y="442" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Runtime invocation URL</text>
  <rect x="1100" y="130" width="260" height="150" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230.0" y="162" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Custom resources</text>
  <text x="1230.0" y="188" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Lambda: OAuth provider</text>
  <text x="1230.0" y="210" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Lambda: health check</text>
  <rect x="1100" y="320" width="260" height="190" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230.0" y="352" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">AgentCore Runtime</text>
  <text x="1230.0" y="378" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">microVM per session</text>
  <text x="1230.0" y="400" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">JWT authorizer</text>
  <text x="1230.0" y="422" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j MCP server</text>
  <text x="1230.0" y="444" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">port 8000, read-only</text>
  <rect x="1410" y="355" width="170" height="120" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1495.0" y="387" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">Neo4j</text>
  <text x="1495.0" y="413" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Aura or</text>
  <text x="1495.0" y="435" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">self-hosted</text>
  <rect x="760" y="600" width="260" height="120" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0" y="632" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">CloudWatch</text>
  <text x="890.0" y="658" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Runtime logs</text>
  <text x="890.0" y="680" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">X-Ray traces, metrics</text>
  <rect x="1100" y="600" width="260" height="120" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230.0" y="632" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Amazon ECR</text>
  <text x="1230.0" y="658" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">MCP server image</text>
  <text x="1230.0" y="680" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">arm64, SHA and latest</text>
  <rect x="1395" y="600" width="185" height="120" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="1487.5" y="632" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Secrets Manager</text>
  <text x="1487.5" y="658" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j</text>
  <text x="1487.5" y="680" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">password</text>
  <path d="M160,345 V205 H376" fill="none" stroke="#D97706" stroke-width="2.5" marker-start="url(#a-orange)" marker-end="url(#a-orange)"/>
  <circle cx="270" cy="205" r="14" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
  <text x="270" y="210" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <path d="M280,415 H416" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <circle cx="348" cy="415" r="14" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
  <text x="348" y="420" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <path d="M560,340 V284" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-orange)"/>
  <circle cx="560" cy="312" r="14" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
  <text x="560" y="317" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <path d="M700,415 H776" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <path d="M910,340 V284" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <circle cx="910" cy="312" r="14" fill="#7A5AF8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="910" y="317" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <path d="M1040,415 H1096" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <circle cx="1068" cy="415" r="14" fill="#7A5AF8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1068" y="420" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <path d="M1360,415 H1406" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <circle cx="1384" cy="415" r="14" fill="#008C72" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1384" y="420" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <path d="M1100,205 H1044" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <text x="1072" y="192" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">creates</text>
  <path d="M1230,280 V316" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="1227" y="288" width="122" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1288" y="303" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">waits for READY</text>
  <path d="M1160,510 V560 H890 V596" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="959" y="541" width="122" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1020" y="556" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">logs and traces</text>
  <path d="M1250,600 V514" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="1225" y="561" width="50" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1250" y="576" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">image</text>
  <path d="M1487,600 V560 H1320 V514" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-slate)"/>
  <rect x="1368" y="541" width="144" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1440" y="556" font-size="12" font-weight="600" fill="#344054" text-anchor="middle">resolved at deploy</text>
  <rect x="40" y="580" width="680" height="230" rx="16" fill="#FFFFFF" stroke="#667085" stroke-width="1"/>
  <text x="64" y="614" font-size="17" font-weight="700" fill="#16233A" text-anchor="start">Request path</text>
  <circle cx="76" cy="645" r="10" fill="#667085"/>
  <text x="76" y="650" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="96" y="650" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The agent posts client_credentials to Cognito and gets a JWT.</text>
  <circle cx="76" cy="671" r="10" fill="#667085"/>
  <text x="76" y="676" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="96" y="676" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The agent sends the MCP request to the Gateway with the JWT.</text>
  <circle cx="76" cy="697" r="10" fill="#667085"/>
  <text x="76" y="702" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="96" y="702" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The Gateway validates the JWT against the Cognito discovery URL.</text>
  <circle cx="76" cy="723" r="10" fill="#667085"/>
  <text x="76" y="728" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="96" y="728" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The Target gets a Runtime token from the OAuth2 provider.</text>
  <circle cx="76" cy="749" r="10" fill="#667085"/>
  <text x="76" y="754" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="96" y="754" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The Target forwards the request to the Runtime with that token.</text>
  <circle cx="76" cy="775" r="10" fill="#667085"/>
  <text x="76" y="780" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="96" y="780" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The MCP server runs read-only Cypher on Neo4j.</text>
</svg>
