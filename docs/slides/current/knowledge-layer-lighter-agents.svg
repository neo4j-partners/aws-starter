<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Lighter agents use one Enterprise Knowledge Layer</title>
  <desc id="description">Four focused agents share a governed Enterprise Knowledge Layer. The layer provides common meaning, governed sources, policy, and memory, so each agent only needs its task and tools.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #0f766e; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #0f172a; font-size: 48px; font-weight: 700; }
      .subheading { fill: #475569; font-size: 24px; }
      .agent-title { fill: #0f172a; font-size: 25px; font-weight: 700; text-anchor: middle; }
      .agent-copy { fill: #64748b; font-size: 19px; text-anchor: middle; }
      .flow-label { fill: #475569; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 34px; font-weight: 700; }
      .layer-copy { fill: #ccfbf1; font-size: 20px; }
      .pillar-title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .pillar-copy { fill: #475569; font-size: 18px; }
      .outcome { fill: #0f172a; font-size: 24px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="eyebrow" x="90" y="74">SHARED CONTEXT</text>
  <text class="heading" x="90" y="130">Lighter agents use one smarter layer</text>
  <text class="subheading" x="90" y="172">Each agent keeps a clear task. Shared knowledge arrives when the agent needs it.</text>

  <!-- Focused agents -->
  <g filter="url(#shadow)">
    <rect x="90" y="230" width="310" height="150" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="245" cy="270" r="19" fill="#14b8a6"/>
    <path d="M235 270h20M245 260v20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text class="agent-title" x="245" y="321">Research agent</text>
    <text class="agent-copy" x="245" y="352">Task + tools</text>

    <rect x="460" y="230" width="310" height="150" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="615" cy="270" r="19" fill="#14b8a6"/>
    <path d="M605 270h20M615 260v20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text class="agent-title" x="615" y="321">Service agent</text>
    <text class="agent-copy" x="615" y="352">Task + tools</text>

    <rect x="830" y="230" width="310" height="150" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="985" cy="270" r="19" fill="#14b8a6"/>
    <path d="M975 270h20M985 260v20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text class="agent-title" x="985" y="321">Risk agent</text>
    <text class="agent-copy" x="985" y="352">Task + tools</text>

    <rect x="1200" y="230" width="310" height="150" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="1355" cy="270" r="19" fill="#14b8a6"/>
    <path d="M1345 270h20M1355 260v20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text class="agent-title" x="1355" y="321">Operations agent</text>
    <text class="agent-copy" x="1355" y="352">Task + tools</text>
  </g>

  <!-- Every agent requests and receives the same governed context -->
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-down)">
    <path d="M245 382V448"/>
    <path d="M615 382V448"/>
    <path d="M985 382V448"/>
    <path d="M1355 382V448"/>
  </g>
  <g>
    <rect x="151" y="403" width="188" height="34" rx="17" fill="#ffffff"/>
    <text class="flow-label" x="245" y="426">Ask for context</text>
    <rect x="521" y="403" width="188" height="34" rx="17" fill="#ffffff"/>
    <text class="flow-label" x="615" y="426">Ask for context</text>
    <rect x="891" y="403" width="188" height="34" rx="17" fill="#ffffff"/>
    <text class="flow-label" x="985" y="426">Ask for context</text>
    <rect x="1261" y="403" width="188" height="34" rx="17" fill="#ffffff"/>
    <text class="flow-label" x="1355" y="426">Ask for context</text>
  </g>

  <!-- Shared substrate -->
  <g filter="url(#shadow)">
    <rect x="90" y="462" width="1420" height="340" rx="26" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <path d="M116 462h1368a26 26 0 0 1 26 26v82H90v-82a26 26 0 0 1 26-26Z" fill="#0f766e"/>
  </g>
  <text class="layer-title" x="130" y="510">Enterprise Knowledge Layer</text>
  <text class="layer-copy" x="130" y="544">One governed place for meaning, data access, rules, and experience</text>

  <g>
    <rect x="125" y="610" width="315" height="148" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="167" cy="651" r="19" fill="#ccfbf1"/>
    <path d="M157 651h20M167 641v20" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <text class="pillar-title" x="200" y="660">Common meaning</text>
    <text class="pillar-copy" x="155" y="704">Terms, relationships,</text>
    <text class="pillar-copy" x="155" y="730">and business definitions</text>

    <rect x="470" y="610" width="315" height="148" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="512" cy="651" r="19" fill="#ccfbf1"/>
    <path d="M502 645h20v14h-20Zm3-6h14" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
    <text class="pillar-title" x="545" y="660">Governed sources</text>
    <text class="pillar-copy" x="500" y="704">Approved data, documents,</text>
    <text class="pillar-copy" x="500" y="730">and provenance</text>

    <rect x="815" y="610" width="315" height="148" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="857" cy="651" r="19" fill="#ccfbf1"/>
    <path d="M850 651l5 5 10-12" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="pillar-title" x="890" y="660">Policy</text>
    <text class="pillar-copy" x="845" y="704">Access rules, controls,</text>
    <text class="pillar-copy" x="845" y="730">and approved actions</text>

    <rect x="1160" y="610" width="315" height="148" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="1202" cy="651" r="19" fill="#ccfbf1"/>
    <path d="M1194 647a10 10 0 1 1 1 12M1194 647v9h9" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="pillar-title" x="1235" y="660">Memory</text>
    <text class="pillar-copy" x="1190" y="704">Past actions, decisions,</text>
    <text class="pillar-copy" x="1190" y="730">and results</text>
  </g>

  <text class="outcome" x="800" y="855">Build shared context once. Reuse it across every agent.</text>
</svg>
