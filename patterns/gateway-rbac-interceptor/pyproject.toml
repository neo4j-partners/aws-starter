# CDK app + client tooling for the Simple OAuth2 M2M demo.
# Managed with uv: `uv sync` to install, `uv run cdk deploy` to deploy.
# The mcp-server container has its own pyproject.toml (built into the image).
[project]
name = "gateway-rbac-interceptor"
version = "0.1.0"
description = "Simple OAuth2 M2M demo: AgentCore Gateway + Cognito with group-based RBAC"
requires-python = ">=3.11"
dependencies = [
    # CDK
    "aws-cdk-lib>=2.220.0",
    "constructs>=10.0.0",
    # Client / setup tooling (client/demo.py, setup_users.py)
    "boto3>=1.34.0",
    "botocore[crt]",
    "requests>=2.31.0",
    "mcp>=2.2.0,<3",
    # client/demo.py configures the MCP HTTP client directly. It is already
    # a dependency of mcp 2.x; declared here only to make the import explicit.
    "httpx2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
# Leave the Python blocks in Markdown docs as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# raise ... from e would change the traceback the demo prints; left as is.
"client/demo.py" = ["B904"]
