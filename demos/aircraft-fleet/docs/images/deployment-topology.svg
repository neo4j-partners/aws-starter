<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Fleet Deployment Topology</title>
  <desc>Two stacks in one AWS account. The AgentCore CLI deploys AgentCore-fleetsupervisor-default, which holds the supervisor Runtime. The Runtime runs the supervisor and both specialists. It reads the fleet graph and the memory database with direct Neo4j drivers. It calls Claude and Titan on Bedrock. It reads both Neo4j logins from Secrets Manager at startup. Before the deploy, fleet-supervisor-secrets creates the two secrets, fleet/neo4j-reader and fleet/memory-neo4j. Each secret holds a username and a password. When Neo4j rejects a password, the Runtime reads that secret again. The optional FleetUi stack, deployed by ui/deploy.sh, hosts the browser UI. The browser signs in on the Cognito managed login page and calls a public function URL that streams each answer. The URL invokes the UI function, a container image that Lambda Web Adapter runs. The function reads the app client ID from an SSM parameter, exchanges the sign-in code with Cognito, and calls the supervisor Runtime. It reads the fleet reader secret and looks up each answer's evidence in the fleet graph, read only. The Runtime writes its logs to CloudWatch Logs. Teardown removes the Runtime and its log groups, and ui/deploy.sh destroy removes the FleetUi stack. Two Neo4j Aura databases hold the fleet graph and agent memory.</desc>
