[project]
name = "neo4j-fleet-agent"
version = "0.1.0"
description = "Neo4j fleet agent — Strands, direct-to-Neo4j GraphRAG over an agent/ core"
requires-python = ">=3.10"
dependencies = [
    # Shared core — direct-to-Neo4j GraphRAG (no MCP, no Gateway)
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    "neo4j-graphrag[bedrock]>=1.16.0",
    "neo4j>=5.17.0",
    "boto3>=1.42.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Observability - ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.10.0",
    # Strands agent framework
    "strands-agents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install the `agent` core package into the venv so runtime_app.py can
# `from agent import ...` without any sys.path manipulation. `client/` is
# dev-only and runs via `python -m client.<mod>` from the project root, so
# it is intentionally not packaged (keeps the runtime image minimal).
[tool.hatch.build.targets.wheel]
packages = ["agent"]
