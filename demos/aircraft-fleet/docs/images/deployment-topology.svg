    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker>
  </defs>
  <rect width="1600" height="1090" fill="#F7F8FA"/>
  <text x="800" y="54" font-size="32" font-weight="700" fill="#16233A" text-anchor="middle">Fleet Deployment Topology</text>
  <text x="800" y="84" font-size="17" font-weight="400" fill="#5C6470" text-anchor="middle">Two stacks, two Neo4j databases. The Runtime and the UI function read their Neo4j logins from Secrets Manager.</text>
  <rect x="30" y="120" width="360" height="690" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="152" font-size="17" font-weight="700" fill="#344054" text-anchor="start">Developer machine, in order</text>
  <rect x="50" y="172" width="320" height="112" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="204" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">1  Load the graph</text>
  <text x="210.0" y="230" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">pipeline/setup.sh</text>
  <text x="210.0" y="252" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fleet graph, manual chunks,</text>
  <text x="210.0" y="274" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">vector + fulltext indexes</text>
  <rect x="50" y="298" width="320" height="112" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="330" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">2  Create the secrets</text>
  <text x="210.0" y="356" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">uv run fleet-supervisor-secrets</text>
  <text x="210.0" y="378" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">stores both Neo4j logins</text>
  <text x="210.0" y="400" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">prints the ARN lines for ../.env</text>
  <rect x="50" y="424" width="320" height="112" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="456" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">3  Supervisor agent</text>
  <text x="210.0" y="482" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor-agent/agent.sh deploy</text>
  <text x="210.0" y="504" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Neo4j settings and secret ARNs</text>
  <text x="210.0" y="526" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">from ../.env</text>
  <rect x="50" y="550" width="320" height="112" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="582" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">4  Hosted UI, optional</text>
  <text x="210.0" y="608" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">ui/deploy.sh deploy</text>
  <text x="210.0" y="630" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">AGENT_ARN and the secret ARN</text>
  <text x="210.0" y="652" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">ui/deploy.sh add-user EMAIL</text>
  <rect x="50" y="676" width="320" height="112" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="210.0" y="708" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Teardown</text>
  <text x="210.0" y="734" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">ui/deploy.sh destroy</text>
  <text x="210.0" y="756" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor-agent/agent.sh destroy</text>
  <text x="210.0" y="778" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">each removes its stack and logs</text>
  <rect x="30" y="840" width="360" height="220" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="872" font-size="17" font-weight="700" fill="#344054" text-anchor="start">User</text>
  <rect x="50" y="886" width="320" height="150" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="918" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Browser</text>
  <text x="210.0" y="944" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">opens the function URL</text>
  <text x="210.0" y="966" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">signs in on the Cognito page</text>
  <text x="210.0" y="988" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">gets each answer as it streams</text>
  <text x="210.0" y="1010" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">and the evidence graph</text>
  <rect x="410" y="120" width="830" height="940" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="430" y="152" font-size="17" font-weight="700" fill="#8A4B08" text-anchor="start">AWS account, us-east-1</text>
  <rect x="440" y="170" width="770" height="242" rx="14" fill="#FAFCFF" stroke="#2E6DB4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="460" y="198" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="start">AgentCore-fleetsupervisor-default stack, from the AgentCore CLI</text>
  <rect x="460" y="215" width="340" height="185" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="247" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Runtime settings</text>
  <text x="630.0" y="273" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">from agentcore/cdk/lib/cdk-stack.ts</text>
  <text x="630.0" y="295" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">NEO4J_* and MEM_NEO4J_* vars</text>
  <text x="630.0" y="317" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">copied from ../.env at deploy</text>
  <text x="630.0" y="339" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">role reads only the two secrets</text>
  <rect x="830" y="215" width="360" height="185" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010.0" y="247" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">supervisor Runtime</text>
  <text x="1010.0" y="273" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">CodeZip, Python 3.12, arm64</text>
  <text x="1010.0" y="295" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">supervisor and both specialists</text>
  <text x="1010.0" y="317" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">direct Neo4j drivers</text>
  <text x="1010.0" y="339" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">port 8080</text>
  <rect x="460" y="455" width="260" height="150" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="590.0" y="487" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">Secrets Manager</text>
  <text x="590.0" y="513" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">fleet/neo4j-reader</text>
  <text x="590.0" y="535" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">fleet/memory-neo4j</text>
  <text x="590.0" y="557" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">JSON with username and password</text>
  <text x="590.0" y="579" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">read at startup, again on rejection</text>
  <rect x="735" y="455" width="205" height="150" rx="14" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.5" y="487" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">CloudWatch Logs</text>
  <text x="837.5" y="513" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Runtime log groups</text>
  <text x="837.5" y="535" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">./agent.sh logs reads them</text>
  <text x="837.5" y="557" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">destroy deletes them</text>
  <rect x="990" y="455" width="200" height="150" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="487" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Amazon Bedrock</text>
  <text x="1090.0" y="513" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Claude Sonnet 5.5</text>
  <text x="1090.0" y="535" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Titan Text Embeddings v2</text>
  <text x="1090.0" y="557" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">1024 dimensions</text>
