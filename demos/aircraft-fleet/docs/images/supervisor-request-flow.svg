  <text x="1120.0" y="458" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Text2Cypher on Claude</text>
  <text x="1120.0" y="480" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">live schema, TTL cache</text>
  <text x="1120.0" y="502" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">EXPLAIN refuses writes</text>
  <text x="1120.0" y="524" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">query timeout, row cap</text>
