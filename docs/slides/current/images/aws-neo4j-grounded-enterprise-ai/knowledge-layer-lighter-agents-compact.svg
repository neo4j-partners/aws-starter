<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title description">
  <title id="title">Focused agents share an Enterprise Knowledge Layer</title>
  <desc id="description">Three focused agents use one shared Enterprise Knowledge Layer for common meaning, governed sources, policy, and memory.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .agent-title { fill: #0f172a; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .agent-copy { fill: #64748b; font-size: 15px; text-anchor: middle; }
      .layer-title { fill: #ffffff; font-size: 29px; font-weight: 700; text-anchor: middle; }
      .layer-copy { fill: #ccfbf1; font-size: 16px; text-anchor: middle; }
      .capability { fill: #0f172a; font-size: 19px; font-weight: 700; }
      .detail { fill: #475569; font-size: 15px; }
      .footer { fill: #0f766e; font-size: 18px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="700" height="760" fill="#ffffff"/>

  <!-- Focused agents -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="200" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="130" cy="61" r="15" fill="#14b8a6"/>
    <path d="M123 61h14M130 54v14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text class="agent-title" x="130" y="101">Research</text>
    <text class="agent-copy" x="130" y="126">Task + tools</text>

    <rect x="250" y="30" width="200" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="350" cy="61" r="15" fill="#14b8a6"/>
    <path d="M343 61h14M350 54v14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text class="agent-title" x="350" y="101">Service</text>
    <text class="agent-copy" x="350" y="126">Task + tools</text>

    <rect x="470" y="30" width="200" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="570" cy="61" r="15" fill="#14b8a6"/>
    <path d="M563 61h14M570 54v14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text class="agent-title" x="570" y="101">Risk</text>
    <text class="agent-copy" x="570" y="126">Task + tools</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M130 144v54"/>
    <path d="M350 144v54"/>
    <path d="M570 144v54"/>
  </g>

  <!-- Shared knowledge layer -->
  <g filter="url(#shadow)">
    <rect x="30" y="210" width="640" height="474" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <path d="M54 210h592a24 24 0 0 1 24 24v94H30v-94a24 24 0 0 1 24-24Z" fill="#0f766e"/>
  </g>
  <text class="layer-title" x="350" y="258">Enterprise Knowledge Layer</text>
  <text class="layer-copy" x="350" y="290">Shared context for every agent</text>

  <g>
    <rect x="58" y="360" width="278" height="120" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="91" cy="399" r="17" fill="#ccfbf1"/>
    <path d="M83 399h16M91 391v16" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <text class="capability" x="119" y="406">Common meaning</text>
    <text class="detail" x="82" y="443">Terms and relationships</text>

    <rect x="364" y="360" width="278" height="120" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="397" cy="399" r="17" fill="#ccfbf1"/>
    <path d="M389 394h16v12h-16Zm3-6h10" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
    <text class="capability" x="425" y="406">Governed sources</text>
    <text class="detail" x="388" y="443">Approved data and origin</text>

    <rect x="58" y="506" width="278" height="120" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="91" cy="545" r="17" fill="#ccfbf1"/>
    <path d="M84 545l5 5 9-11" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="capability" x="119" y="552">Policy</text>
    <text class="detail" x="82" y="589">Access rules and actions</text>

    <rect x="364" y="506" width="278" height="120" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="397" cy="545" r="17" fill="#ccfbf1"/>
    <path d="M390 541a9 9 0 1 1 1 11M390 541v8h8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="capability" x="425" y="552">Memory</text>
    <text class="detail" x="388" y="589">Past decisions and results</text>
  </g>

  <text class="footer" x="350" y="726">Build shared context once. Reuse it across every agent.</text>
</svg>
