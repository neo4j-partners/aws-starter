[project]
name = "aircraft-fleet-supervisor-agent"
version = "0.1.0"
description = "Strands supervisor with Maintenance and Operations specialists over direct Neo4j GraphRAG tools"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.65",
    "bedrock-agentcore[strands-agents]>=1.26",
    # Graph tools: direct-to-Neo4j Text2Cypher and hybrid search
    "neo4j>=6.3.1",
    "neo4j-graphrag[bedrock]>=1.24",
    "httpx>=0.28.0",
    "boto3>=1.43.127",
    # Observability: ADOT for automatic tracing to CloudWatch
    "aws-opentelemetry-distro>=0.23.0",
    # Supervisor memory in Neo4j. Pinned: the settings and session manager
    # APIs changed between minor releases. The fleet build of the
    # neo4j-partners fork adds the extractor's send_temperature and
    # tool_choice settings.
    "neo4j-agent-memory[strands]==0.8.0+fleet.9",
    "truststore>=0.10",
    # server.py and setup_secrets.py read ../.env with it, and agent.sh
    # parses ../.env with it for the deploy settings.
    "python-dotenv>=1.2.4",
    # Imported directly by core/memory.py and core/graph/text2cypher.py.
    "pydantic>=2.14.4",
    # ui/server.py runs from this project's environment
    # (uv run --project ../supervisor-agent).
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop). `fleet-supervisor-cli` asks the local server one
# question. `fleet-supervisor-invoke` is the cloud invocation and load-test
# client. `fleet-supervisor-secrets` creates or updates the two deploy
# secrets from ../.env.
[project.scripts]
fleet-supervisor-server = "fleet_supervisor.server:main"
fleet-supervisor-cli = "fleet_supervisor.client.cli:main"
fleet-supervisor-invoke = "fleet_supervisor.client.invoke:main"
fleet-supervisor-secrets = "fleet_supervisor.setup_secrets:main"

[dependency-groups]
dev = [
    # tests/test_server.py cancels a request through an anyio task group.
    "anyio>=4.16.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
neo4j-agent-memory = { url = "https://github.com/neo4j-partners/agent-memory/releases/download/python-v0.8.0%2Bfleet.9/neo4j_agent_memory-0.8.0%2Bfleet.9-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One uniquely named package holds all the code. CodeZip installs the
# dependencies but not this project, so in the runtime the package imports
# because its folder sits next to main.py. Locally, uv installs it for the
# console scripts. The runtime entrypoint is set in agentcore/agentcore.json.
[tool.hatch.build.targets.wheel]
packages = ["fleet_supervisor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
