  <rect x="357" y="217" width="86" height="21" rx="5" fill="#F7F8FA"/>
  <text x="400" y="232" font-size="12" font-weight="600" fill="#8A4B08" text-anchor="middle">ARRIVES_AT</text>
  <path d="M600,280 V426" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="561" y="345" width="79" height="21" rx="5" fill="#F7F8FA"/>
