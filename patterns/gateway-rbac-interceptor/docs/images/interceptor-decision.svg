<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Interceptor Decision</title>
  <desc>The interceptor parses the request body and decodes the JWT payload. A tools/call for an admin tool needs the admin group. Allowed requests get identity headers. Denied requests get a JSON-RPC result with isError set to true.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Interceptor Decision</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">AuthInterceptorLambda runs on every Gateway request and either rewrites it or answers it.</text>
  <rect x="620" y="120" width="360" height="100" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.0" y="152" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Gateway REQUEST event</text>
  <text x="800.0" y="178" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">mcp.gatewayRequest</text>
  <text x="800.0" y="200" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">headers and body</text>
  <rect x="620" y="270" width="360" height="100" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.0" y="302" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">1  Parse the body</text>
  <text x="800.0" y="328" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">a string body is parsed as JSON</text>
  <text x="800.0" y="350" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">reads method and id</text>
  <rect x="620" y="420" width="360" height="126" rx="14" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.0" y="452" font-size="18" font-weight="700" fill="#4A2EB0" text-anchor="middle">2  Read the identity</text>
  <text x="800.0" y="478" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">decodes the JWT payload only</text>
  <text x="800.0" y="500" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">user_id: sub or m2m:{client_id}</text>
  <text x="800.0" y="522" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">groups: cognito:groups</text>
  <path d="M800,220 V266" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <path d="M800,370 V416" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <path d="M800,546 V571" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <polygon points="800,575 1000,650 800,725 600,650" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="645" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="middle">tools/call for</text>
  <text x="800" y="667" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="middle">an admin tool?</text>
  <polygon points="800,787 1000,862 800,937 600,862" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="857" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="middle">admin in</text>
  <text x="800" y="879" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="middle">groups?</text>
  <path d="M800,725 V783" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="807" y="745" width="36" height="21" rx="5" fill="#F7F8FA"/>
  <text x="814" y="760" font-size="13" font-weight="600" fill="#8A4B08" text-anchor="start">yes</text>
  <rect x="60" y="590" width="400" height="340" rx="14" fill="#E8F6F2" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.0" y="622" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">Allow</text>
  <text x="260.0" y="648" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">transformedGatewayRequest</text>
  <text x="260.0" y="670" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Authorization</text>
  <text x="260.0" y="692" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Content-Type: application/json</text>
  <text x="260.0" y="714" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">X-User-Id, X-User-Groups, X-Client-Id</text>
  <text x="260.0" y="736" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">body as a JSON object</text>
  <text x="260.0" y="758" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle"></text>
  <text x="260.0" y="780" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">The Gateway forwards the request</text>
  <text x="260.0" y="802" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">to the Runtime.</text>
  <path d="M600,650 H464" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="516" y="625" width="28" height="21" rx="5" fill="#F7F8FA"/>
  <text x="530" y="640" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">no</text>
  <path d="M600,862 H464" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="512" y="837" width="36" height="21" rx="5" fill="#F7F8FA"/>
  <text x="530" y="852" font-size="13" font-weight="600" fill="#00594A" text-anchor="middle">yes</text>
  <rect x="1140" y="760" width="400" height="204" rx="14" fill="#FDF2FA" stroke="#C11574" stroke-width="2" filter="url(#shadow)"/>
  <text x="1340.0" y="792" font-size="18" font-weight="700" fill="#851651" text-anchor="middle">Deny</text>
  <text x="1340.0" y="818" font-size="13" font-weight="400" fill="#5C6470" text-anchor="middle" font-family="Menlo, Consolas, monospace">transformedGatewayResponse</text>
  <text x="1340.0" y="840" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">statusCode 200</text>
  <text x="1340.0" y="862" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">JSON-RPC result with isError true</text>
  <text x="1340.0" y="884" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">The Gateway returns it to the client.</text>
  <text x="1340.0" y="906" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">The Runtime is not called.</text>
  <path d="M1000,862 H1136" fill="none" stroke="#C11574" stroke-width="2.5" marker-end="url(#a-pink)"/>
  <rect x="1054" y="837" width="28" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1068" y="852" font-size="13" font-weight="600" fill="#851651" text-anchor="middle">no</text>
  <path d="M980,320 H1340 V756" fill="none" stroke="#C11574" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-pink)"/>
  <rect x="1232" y="545" width="216" height="21" rx="5" fill="#F7F8FA"/>
  <text x="1340" y="560" font-size="13" font-weight="600" fill="#851651" text-anchor="middle">invalid JSON or an exception</text>
</svg>
