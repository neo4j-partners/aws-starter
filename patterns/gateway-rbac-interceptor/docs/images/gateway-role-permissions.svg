<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="954" viewBox="0 0 1600 954" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Gateway Role Permissions</title>
  <desc>The GatewayRole inline policy has four statements: InvokeRuntime, CloudWatchLogs, OAuthProviderAccess, and BedrockModelAccess. grant_invoke adds lambda:InvokeFunction on the interceptor. The interceptor Lambda also has a resource policy for the AgentCore service principal.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/></filter>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2E6DB4"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#008C72"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7A5AF8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C11574"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
  </defs>
  <rect width="1600" height="954" fill="#F7F8FA"/>
  <text x="800" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#16233A">Gateway Role Permissions</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#5C6470">Each statement grants all of its actions on all of its resources.</text>
  <text x="360" y="134" font-size="15" font-weight="700" fill="#16233A" text-anchor="start">Statements on GatewayRole</text>
  <text x="1000" y="134" font-size="15" font-weight="700" fill="#16233A" text-anchor="start">Resources, ARN suffix only</text>
  <rect x="40" y="372.0" width="250" height="160" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.0" y="404.0" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">GatewayRole</text>
  <text x="165.0" y="430.0" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">assumed by the</text>
  <text x="165.0" y="452.0" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">AgentCore service</text>
  <text x="165.0" y="474.0" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">with SourceAccount and</text>
  <text x="165.0" y="496.0" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">SourceArn conditions</text>
  <path d="M290,452 H325 M325,197 V707" stroke="#667085" stroke-width="2.5" fill="none"/>
  <path d="M325,197 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <path d="M325,317 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <path d="M325,467 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <path d="M325,607 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <path d="M325,707 H356" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="150" width="560" height="94" rx="12" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="380" y="178" font-size="16" font-weight="700" fill="#8A4B08" text-anchor="start">InvokeRuntime</text>
  <text x="380" y="202" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:InvokeRuntime</text>
  <text x="380" y="222" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:InvokeRuntimeWithResponseStream</text>
  <rect x="1000" y="150" width="560" height="94" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="1020" y="180" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">runtime/*</text>
  <path d="M920,197 H996" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <rect x="360" y="260" width="560" height="114" rx="12" fill="#F2F4F7" stroke="#667085" stroke-width="1.5"/>
  <text x="380" y="288" font-size="16" font-weight="700" fill="#344054" text-anchor="start">CloudWatchLogs</text>
  <text x="380" y="312" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">logs:CreateLogGroup</text>
  <text x="380" y="332" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">logs:CreateLogStream</text>
  <text x="380" y="352" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">logs:PutLogEvents</text>
  <rect x="1000" y="260" width="560" height="114" rx="12" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/>
  <text x="1020" y="290" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">log-group:/aws/bedrock-agentcore/*</text>
  <path d="M920,317 H996" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <rect x="360" y="390" width="560" height="154" rx="12" fill="#E8F6F2" stroke="#008C72" stroke-width="1.5"/>
  <text x="380" y="418" font-size="16" font-weight="700" fill="#00594A" text-anchor="start">OAuthProviderAccess</text>
  <text x="380" y="442" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:GetOAuth2CredentialProvider</text>
  <text x="380" y="462" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:GetTokenVault</text>
  <text x="380" y="482" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:GetWorkloadAccessToken</text>
  <text x="380" y="502" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock-agentcore:GetResourceOauth2Token</text>
  <text x="380" y="522" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">secretsmanager:GetSecretValue</text>
  <rect x="1000" y="390" width="560" height="154" rx="12" fill="#FFFFFF" stroke="#008C72" stroke-width="1.5"/>
  <text x="1020" y="420" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">token-vault/*</text>
  <text x="1020" y="440" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">workload-identity-directory/*</text>
  <text x="1020" y="460" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">secret:bedrock-agentcore*</text>
  <path d="M920,467 H996" fill="none" stroke="#008C72" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <rect x="360" y="560" width="560" height="94" rx="12" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="380" y="588" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="start">BedrockModelAccess</text>
  <text x="380" y="612" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock:InvokeModel</text>
  <text x="380" y="632" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">bedrock:InvokeModelWithResponseStream</text>
  <rect x="1000" y="560" width="560" height="94" rx="12" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="1020" y="590" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">foundation-model/*</text>
  <text x="1020" y="610" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">inference-profile/*</text>
  <path d="M920,607 H996" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="360" y="670" width="560" height="74" rx="12" fill="#F3F0FF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="380" y="698" font-size="16" font-weight="700" fill="#4A2EB0" text-anchor="start">grant_invoke(gateway_role)</text>
  <text x="380" y="722" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">lambda:InvokeFunction</text>
  <rect x="1000" y="670" width="560" height="74" rx="12" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="1020" y="700" font-size="13" font-weight="400" fill="#344054" text-anchor="start" font-family="Menlo, Consolas, monospace">AuthInterceptorLambda</text>
  <path d="M920,707 H996" fill="none" stroke="#7A5AF8" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <rect x="40" y="784" width="1520" height="130" rx="16" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="64" y="818" font-size="17" font-weight="700" fill="#4A2EB0" text-anchor="start">Lambda resource policy on AuthInterceptorLambda</text>
  <text x="64" y="848" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">add_permission lets bedrock-agentcore.amazonaws.com invoke the function.</text>
  <text x="64" y="872" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">Its source_arn is gateway/* in this account and Region. The wildcard avoids a circular dependency on the Gateway.</text>
  <text x="64" y="896" font-size="14.5" font-weight="400" fill="#344054" text-anchor="start">The interceptor needs both this resource policy and the grant_invoke statement above.</text>
</svg>
