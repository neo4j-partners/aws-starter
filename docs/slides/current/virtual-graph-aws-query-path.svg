<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="title description">
  <title id="title">Planned AWS query path from Cypher to Amazon S3 Tables</title>
  <desc id="description">A Cypher caller sends a query to Neo4j Virtual Graph, which translates it to SQL for Amazon Athena. Athena resolves metadata in AWS Glue Data Catalog and reads Apache Iceberg data from Amazon S3 Tables. Results return through Virtual Graph as Cypher results without copying source data.</desc>

  <defs>
    <marker id="arrow-query" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-meta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B45309"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .card-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-detail { font-size: 11px; fill: #475569; }
      .arrow-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
      .step { font-size: 11px; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="680" height="360" rx="18" fill="#F8FAFC"/>

  <!-- Legend -->
  <g class="sans" transform="translate(20 18)">
    <line x1="0" y1="7" x2="28" y2="7" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-query)"/>
    <text x="38" y="11" font-size="10.5" fill="#475569">request and data access</text>
    <line x1="188" y1="7" x2="216" y2="7" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-meta)"/>
    <text x="226" y="11" font-size="10.5" fill="#475569">metadata lookup</text>
    <line x1="347" y1="7" x2="375" y2="7" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-return)"/>
    <text x="385" y="11" font-size="10.5" fill="#475569">response</text>
  </g>

  <!-- Main cards -->
  <g class="sans" filter="url(#shadow)">
    <rect x="20" y="64" width="112" height="112" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="40" cy="84" r="12" fill="#2563EB"/>
    <text class="step" x="40" y="88" text-anchor="middle">1</text>
    <text class="card-title" x="76" y="105" text-anchor="middle">Cypher</text>
    <text class="card-title" x="76" y="125" text-anchor="middle">caller</text>
    <text class="card-detail" x="76" y="149" text-anchor="middle">app, agent,</text>
    <text class="card-detail" x="76" y="164" text-anchor="middle">or analyst</text>

    <rect x="172" y="64" width="160" height="112" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2.5"/>
    <circle cx="192" cy="84" r="12" fill="#7C3AED"/>
    <text class="step" x="192" y="88" text-anchor="middle">2</text>
    <text class="card-title" x="252" y="106" text-anchor="middle">Neo4j</text>
    <text class="card-title" x="252" y="126" text-anchor="middle">Virtual Graph</text>
    <text class="card-detail" x="252" y="151" text-anchor="middle">translates Cypher</text>
    <text class="card-detail" x="252" y="166" text-anchor="middle">to SQL</text>

    <rect x="372" y="64" width="124" height="112" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
    <circle cx="392" cy="84" r="12" fill="#C2410C"/>
    <text class="step" x="392" y="88" text-anchor="middle">3</text>
    <text class="card-title" x="434" y="112" text-anchor="middle">Amazon</text>
    <text class="card-title" x="434" y="132" text-anchor="middle">Athena</text>
    <text class="card-detail" x="434" y="158" text-anchor="middle">executes SQL</text>

    <rect x="536" y="64" width="124" height="112" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
    <circle cx="556" cy="84" r="12" fill="#C2410C"/>
    <text class="step" x="556" y="88" text-anchor="middle">4</text>
    <text class="card-title" x="598" y="106" text-anchor="middle">Amazon</text>
    <text class="card-title" x="598" y="126" text-anchor="middle">S3 Tables</text>
    <text class="card-detail" x="598" y="151" text-anchor="middle">authoritative</text>
    <text class="card-detail" x="598" y="166" text-anchor="middle">Iceberg data</text>
  </g>

  <!-- Forward path -->
  <g class="sans">
    <line x1="134" y1="120" x2="168" y2="120" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-query)"/>
    <text class="arrow-label" x="151" y="108" text-anchor="middle" fill="#0F766E">CYPHER</text>

    <line x1="334" y1="120" x2="368" y2="120" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-query)"/>
    <text class="arrow-label" x="351" y="108" text-anchor="middle" fill="#0F766E">SQL</text>

    <line x1="498" y1="120" x2="532" y2="120" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-query)"/>
    <text class="arrow-label" x="515" y="108" text-anchor="middle" fill="#0F766E">READ</text>
  </g>

  <!-- Response lane -->
  <g class="sans">
    <path d="M598 181V207H434V181" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-return)"/>
    <text x="516" y="201" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563EB">QUERY ROWS</text>

    <path d="M434 181V222H252V181" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-return)"/>
    <text x="343" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563EB">RESULT MAPPING</text>

    <path d="M252 181V237H76V181" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-return)"/>
    <text x="164" y="231" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563EB">CYPHER RESULT</text>
  </g>

  <!-- Metadata plane -->
  <g class="sans">
    <rect x="360" y="267" width="300" height="86" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="378" y="292" font-size="15" font-weight="700" fill="#78350F">AWS Glue Data Catalog</text>
    <text x="378" y="314" font-size="11.5" fill="#475569">Maps S3 table buckets to federated child catalogs</text>
    <rect x="378" y="325" width="264" height="18" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text class="mono" x="510" y="338" text-anchor="middle" font-size="9.5" fill="#78350F">s3tablescatalog → table-bucket child catalog</text>

    <path d="M434 263V229" fill="none" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-meta)"/>
    <text x="447" y="250" font-size="10.5" font-weight="700" fill="#B45309">RESOLVE TABLE METADATA</text>
  </g>

</svg>
