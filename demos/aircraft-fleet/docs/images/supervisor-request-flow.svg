  <text x="150.0" y="470" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fleet-supervisor-cli</text>
  <text x="150.0" y="492" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">agent.sh invoke-cloud</text>
  <text x="150.0" y="514" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">ui/server.py</text>
  <rect x="320" y="360" width="270" height="200" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="455.0" y="392" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Supervisor</text>
  <text x="455.0" y="418" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Strands Agent on Claude</text>
  <text x="455.0" y="440" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Its two tools are</text>
  <text x="455.0" y="462" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">the specialists</text>
  <text x="455.0" y="484" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Port 7071 locally</text>
  <path d="M260,440 H316" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="266.5" y="412" width="43" height="21" rx="5" fill="#F7F8FA"/>
  <text x="288" y="427" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">POST</text>
  <path d="M320,490 H264" fill="none" stroke="#2E6DB4" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-blue)"/>
  <rect x="272.0" y="501" width="36" height="21" rx="5" fill="#F7F8FA"/>
  <text x="290" y="516" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">SSE</text>
  <rect x="660" y="230" width="260" height="170" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0" y="262" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Maintenance Agent</text>
  <text x="790.0" y="288" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">faults, components</text>
  <text x="790.0" y="310" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">sensors, manuals, limits</text>
  <text x="790.0" y="332" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">fresh Agent per call</text>
  <rect x="660" y="520" width="260" height="170" rx="14" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0" y="552" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">Operations Agent</text>
  <text x="790.0" y="578" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">flights, delays</text>
  <text x="790.0" y="600" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">routes, airports</text>
  <text x="790.0" y="622" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">schema and simple counts</text>
  <path d="M590,430 H625 V315 H656" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <path d="M590,490 H625 V605 H656" fill="none" stroke="#2E6DB4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="990" y="170" width="260" height="150" rx="14" fill="#FFFFFF" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="202" font-size="18" font-weight="700" fill="#00594A" text-anchor="middle">vector_search_tool</text>
  <text x="1120.0" y="228" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">hybrid search over chunks</text>
  <text x="1120.0" y="250" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">vector and fulltext indexes</text>
  <text x="1120.0" y="272" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">Titan v2 query embedding</text>
  <text x="1120.0" y="294" font-size="14" font-weight="400" fill="#5C6470" text-anchor="middle">optional aircraft type filter</text>
  <rect x="990" y="400" width="260" height="190" rx="14" fill="#FFFFFF" stroke="#008C72" stroke-width="2" filter="url(#shadow)"/>
