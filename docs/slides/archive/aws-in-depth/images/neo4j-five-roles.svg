<svg xmlns="http://www.w3.org/2000/svg" width="900" height="746" viewBox="0 0 900 746" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="746" fill="#ffffff"/>

  <!-- Main title -->
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">The Five Roles of Neo4j in Enterprise AI Agents</text>

  <!-- Subtitle -->
  <text x="450" y="74" text-anchor="middle" font-size="14" fill="#666666">Neo4j is an independent graph stack that delivers five complementary</text>
  <text x="450" y="93" text-anchor="middle" font-size="14" fill="#666666">capabilities, running on Bedrock and AgentCore.</text>

  <!-- Layer 1 -->
  <g>
    <rect x="40" y="120" width="820" height="108" rx="10" ry="10" fill="#E8F2F8" stroke="#d8e4ea" stroke-width="1"/>
    <rect x="40" y="120" width="8" height="108" rx="4" ry="4" fill="#1E73A8"/>
    <text x="72" y="160" font-size="17" font-weight="bold" fill="#1a1a1a">Layer 1: Knowledge Layer &#8212; GraphRAG &amp; Beyond GraphRAG</text>
    <text x="72" y="188" font-size="13" fill="#333333">A native graph knowledge store delivering schema-enforced entity extraction and</text>
    <text x="72" y="208" font-size="13" fill="#333333">multi-hop reasoning for enterprise agents running on Bedrock and AgentCore.</text>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="40" y="244" width="820" height="108" rx="10" ry="10" fill="#E9F3E5" stroke="#dce8d7" stroke-width="1"/>
    <rect x="40" y="244" width="8" height="108" rx="4" ry="4" fill="#4A8C3F"/>
    <text x="72" y="284" font-size="17" font-weight="bold" fill="#1a1a1a">Layer 2: Agent Brain &#8212; Goal, State &amp; Decision Graph</text>
    <text x="72" y="312" font-size="13" fill="#333333">Persistent cognitive architecture for Bedrock agents: a graph of goals, sub-goals,</text>
    <text x="72" y="332" font-size="13" fill="#333333">actions, dependencies, and outcomes.</text>
  </g>

  <!-- Layer 3 -->
  <g>
    <rect x="40" y="368" width="820" height="108" rx="10" ry="10" fill="#FCEFE0" stroke="#f0e0cc" stroke-width="1"/>
    <rect x="40" y="368" width="8" height="108" rx="4" ry="4" fill="#D08A3E"/>
    <text x="72" y="408" font-size="17" font-weight="bold" fill="#1a1a1a">Layer 3: Context Layer &#8212; Session &amp; Cross-Session Intelligence</text>
    <text x="72" y="436" font-size="13" fill="#333333">Replace AgentCore's flat memory store with a relational context graph.</text>
  </g>

  <!-- Layer 4 -->
  <g>
    <rect x="40" y="492" width="820" height="108" rx="10" ry="10" fill="#E8F2F8" stroke="#d8e4ea" stroke-width="1"/>
    <rect x="40" y="492" width="8" height="108" rx="4" ry="4" fill="#1E73A8"/>
    <text x="72" y="532" font-size="17" font-weight="bold" fill="#1a1a1a">Layer 4: Semantic Layer &#8212; Natural Language to Enterprise Data</text>
    <text x="72" y="560" font-size="13" fill="#333333">Neo4j as the semantic bridge between LLMs and enterprise data systems like Redshift,</text>
    <text x="72" y="580" font-size="13" fill="#333333">S3, SAP, and Salesforce.</text>
  </g>

  <!-- Layer 5 -->
  <g>
    <rect x="40" y="616" width="820" height="108" rx="10" ry="10" fill="#E9F3E5" stroke="#dce8d7" stroke-width="1"/>
    <rect x="40" y="616" width="8" height="108" rx="4" ry="4" fill="#4A8C3F"/>
    <text x="72" y="656" font-size="17" font-weight="bold" fill="#1a1a1a">Layer 5: Reasoning &amp; Data Layer &#8212; Real-Time Graph Analytics</text>
    <text x="72" y="684" font-size="13" fill="#333333">Expose Neo4j Graph Data Science (GDS) algorithms as first-class AgentCore tools.</text>
  </g>
</svg>
