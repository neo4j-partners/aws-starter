[project]
name = "fraud-memory-agent"
version = "0.1.0"
description = "Fraud Memory Agent (Strands) for Neo4j MCP via AgentCore Gateway over a shared core/ package"
requires-python = ">=3.10"
dependencies = [
    # Shared core
    "httpx>=0.28.1",
    "boto3>=1.43.9",
    # client/transport.py reads .bedrock_agentcore.yaml; declare pyyaml
    # explicitly rather than rely on it arriving transitively via the toolkit.
    "pyyaml>=6.0",
    # MCP 2 uses the streamable HTTP client configured in core/transport.py.
    # Pin the tested release so cloud and local dependency resolution match.
    "mcp==2.1.1",
    "bedrock-agentcore>=1.9.1",
    "bedrock-agentcore-starter-toolkit>=0.3.9",
    # Observability — ADOT auto-instrumentation for AgentCore CloudWatch traces
    "aws-opentelemetry-distro>=0.17.0",
    # Agent framework
    # NAMS-backed memory capture for the Strands runtime. NAMS captures
    # every agent turn without a direct Neo4j driver or embedding setup.
    "strands-agents>=1.52,<2",
    "neo4j-agent-memory[nams,strands]>=0.5.0",
    # server/runtime_app.py loads the local .env for development runs.
    "python-dotenv>=1.2.2",
]

# Supply-chain caution: hold these transitive deps below releases published
# within the last 48h (click 8.4.0 / python-multipart 0.0.29, 2026-05-17).
[tool.uv]
constraint-dependencies = [
    "click<=8.3.3",
    "python-multipart<=0.0.28",
]

# Console entry points. The server runs in the foreground of its own
# terminal (Ctrl+C to stop) — it is never backgrounded by a script. The
# clients are thin wire callers. `fraud-server` defaults to port 7020 for
# local dev; the cloud container uses runtime_app's __main__ (fixed 8080).
[project.scripts]
fraud-server = "server.runtime_app:main"
fraud-cli = "client.cli:main"
fraud-demo = "client.demo:main"
fraud-invoke = "client.invoke:main"
fraud-traffic = "client.traffic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package the shared `core` plus `client`/`server` into the venv so the
# console scripts resolve `client.*`/`server.*` and `from core import ...`
# works without any sys.path manipulation.
[tool.hatch.build.targets.wheel]
packages = ["core", "client", "server"]
