<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge-layer architecture</title>
  <desc id="desc">Data sources feed a Neo4j semantic layer, which exposes context and query MCP services to an agent layer, then to consumption interfaces and the user. Feedback and memory return to the semantic layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#303030"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #151515; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; }
      .panel { stroke: #202020; stroke-width: 1.7; }
      .flow { fill: none; stroke: #303030; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-both { fill: none; stroke: #303030; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .step { fill: #fff; stroke: #202020; stroke-width: 1.3; }
    </style>
  </defs>

  <!-- Data domain layer -->
  <text x="173" y="20" text-anchor="middle" class="label">Data Domain Layer</text>
  <g class="panel">
    <rect x="81" y="27" width="204" height="58" rx="13" fill="#e9f8e7"/>
    <rect x="81" y="89" width="204" height="58" rx="13" fill="#e9f8e7"/>
    <rect x="81" y="151" width="204" height="58" rx="13" fill="#e9f8e7"/>
    <rect x="81" y="214" width="204" height="153" rx="16" fill="#e9f8e7"/>
    <rect x="81" y="373" width="204" height="115" rx="16" fill="#e9f8e7"/>
  </g>
  <text x="71" y="59" text-anchor="end" class="label">Ontologies</text>
  <g stroke="#202020" stroke-width="1.5"><circle cx="115" cy="45" r="6" fill="#d9c6ff"/><circle cx="155" cy="45" r="6" fill="#d9c6ff"/><circle cx="202" cy="40" r="6" fill="#d9c6ff"/><circle cx="242" cy="45" r="6" fill="#d9c6ff"/><circle cx="130" cy="71" r="6" fill="#d9c6ff"/><circle cx="180" cy="62" r="6" fill="#d9c6ff"/><circle cx="214" cy="68" r="6" fill="#d9c6ff"/><circle cx="254" cy="73" r="6" fill="#d9c6ff"/><path d="M121 45h28m12 0h35m12-3h28m-116 25 54-5m12 1 23 4m12-2 22 6" fill="none"/></g>
  <text x="71" y="116" text-anchor="end" class="label">Supporting</text><text x="71" y="131" text-anchor="end" class="label">Documents</text>
  <g class="small"><text x="103" y="112">• Object storage</text><text x="103" y="130">• Documents</text></g>
  <text x="71" y="179" text-anchor="end" class="label">Query</text><text x="71" y="194" text-anchor="end" class="label">Logs</text>
  <g class="small"><text x="103" y="177">• Request logs</text><text x="103" y="195">• Query history</text></g>
  <text x="71" y="286" text-anchor="end" class="label">Data</text><text x="71" y="301" text-anchor="end" class="label">Catalogs</text>
  <g class="small"><text x="101" y="242">• Unity Catalog</text><text x="101" y="264">• Collibra</text><text x="101" y="286">• Informatica</text><text x="101" y="308">• Alation</text><text x="101" y="330">• AWS Glue (planned)</text></g>
  <text x="71" y="431" text-anchor="end" class="label">Lakes</text><text x="71" y="446" text-anchor="end" class="label">Databases</text><text x="71" y="461" text-anchor="end" class="label">Warehouses</text>
  <g class="small"><text x="96" y="395">• Google BigQuery</text><text x="96" y="409">• Databricks</text><text x="96" y="423">• Neo4j</text><text x="96" y="437">• Pinecone</text><text x="96" y="451">• Snowflake</text><text x="96" y="465">• MongoDB</text><text x="96" y="479">• Amazon SageMaker Lakehouse</text></g>

  <!-- Semantic layer -->
  <path class="flow" d="M286 250h51"/>
  <path class="flow" d="M286 431h29c18 0 27-7 27-25V369"/>
  <path d="M289 55h11c9 0 13 5 13 14v63" fill="none" stroke="#303030" stroke-width="1.4"/>
  <path d="M289 127h11c9 0 13 5 13 14v47" fill="none" stroke="#303030" stroke-width="1.4"/>
  <path d="M289 191h11c9 0 13 5 13 14v23" fill="none" stroke="#303030" stroke-width="1.4"/>
  <path d="M289 289h11c9 0 13-5 13-14v-23" fill="none" stroke="#303030" stroke-width="1.4"/>
  <rect x="340" y="174" width="134" height="194" rx="19" class="panel" fill="#eee6ff"/>
  <text x="407" y="202" text-anchor="middle" style="font-size:20px;font-weight:bold">neo4j</text>
  <g fill="#aee6c2" stroke="#222" stroke-width="1.2"><circle cx="356" cy="238" r="8"/><circle cx="388" cy="248" r="8"/><circle cx="428" cy="230" r="8"/><circle cx="457" cy="263" r="8"/><circle cx="425" cy="322" r="8"/></g>
  <g fill="#acdafa" stroke="#222" stroke-width="1.2"><circle cx="365" cy="268" r="8"/><circle cx="404" cy="211" r="8"/><circle cx="427" cy="267" r="8"/><circle cx="449" cy="293" r="8"/></g>
  <g fill="#fac4c4" stroke="#222" stroke-width="1.2"><circle cx="448" cy="218" r="8"/><circle cx="403" cy="288" r="8"/><circle cx="402" cy="350" r="8"/></g><g fill="#ffe787" stroke="#222" stroke-width="1.2"><circle cx="435" cy="350" r="8"/></g>
  <g stroke="#333" stroke-width="1.5"><path d="M356 238l32 10 16-37 24 19 20-12m-83 50 39-57m0 0 23 56 30-4m-30 4 22 26m-22-26-24 21m24 21-25 36m25-36 24 57m-24-57 22-27m-22 27-25 57m25-57 23 1" fill="none"/></g>
  <text x="407" y="386" text-anchor="middle" class="label">Semantic Layer</text>

  <!-- Retrieval and services -->
  <path class="flow" d="M474 271h20c0-3 0-21 0-29 0-16 4-23 20-23"/>
  <path class="flow" d="M474 333h20c0 0 0 38 0 38 0 12 7 15 23 15"/>
  <g class="panel"><path d="M570 82l51 37-51 37-51-37z" fill="#e8f3ff"/></g><text x="570" y="116" text-anchor="middle" class="label">Context</text><text x="570" y="132" text-anchor="middle" class="label">MCP</text>
  <rect x="522" y="208" width="97" height="66" rx="13" class="panel" fill="#dcf7f7"/><text x="570" y="238" text-anchor="middle" class="label">Embedding</text><text x="570" y="254" text-anchor="middle" class="label">Model</text>
  <path class="flow-both" d="M570 156v52"/><path class="flow-both" d="M570 274v47"/>
  <g class="panel" fill="#e8f3ff"><path d="M570 323l51 37-51 37-51-37z"/><path d="M570 328l51 37-51 37-51-37z"/><path d="M570 333l51 37-51 37-51-37z"/></g><text x="570" y="377" text-anchor="middle" class="label">Query</text><text x="570" y="393" text-anchor="middle" class="label">MCP</text><text x="570" y="442" text-anchor="middle" class="label">Retrieval Layer</text>
  <path class="flow" d="M621 119h35c0 0 0 179 0 179h25"/><text x="642" y="214" class="small">MCP</text>
  <path class="flow" d="M621 370h35c0 0 0-72 0-72h25"/><text x="642" y="350" class="small">MCP</text>

  <!-- Agent layer -->
  <rect x="704" y="67" width="69" height="67" rx="13" class="panel" fill="#dcf7f7"/><text x="738" y="104" text-anchor="middle" class="label">LLM</text>
  <rect x="689" y="168" width="102" height="248" rx="19" class="panel" fill="#ffcaca"/>
  <g class="panel" fill="#ffe9ee"><rect x="704" y="184" width="75" height="67" rx="14"/><rect x="698" y="178" width="75" height="67" rx="14"/><rect x="710" y="190" width="75" height="67" rx="14"/><rect x="704" y="337" width="75" height="67" rx="14"/><rect x="698" y="331" width="75" height="67" rx="14"/><rect x="710" y="343" width="75" height="67" rx="14"/></g>
  <text x="746" y="228" text-anchor="middle" class="label">Agent</text><text x="746" y="381" text-anchor="middle" class="label">Agent</text><text x="738" y="304" text-anchor="middle" class="small">A2A</text>
  <path class="flow-both" d="M738 134v35M738 257v74"/><text x="738" y="442" text-anchor="middle" class="label">Agent Layer</text>

  <!-- Consumption layer and user -->
  <rect x="826" y="169" width="89" height="247" rx="19" class="panel" fill="#ffdba1"/>
  <g class="panel" fill="#fff0d7"><rect x="837" y="180" width="67" height="63" rx="13"/><rect x="837" y="267" width="67" height="64" rx="13"/><rect x="837" y="354" width="67" height="51" rx="13"/></g>
  <text x="870" y="214" text-anchor="middle" class="label">UI</text><text x="870" y="303" text-anchor="middle" class="tiny">Dashboards</text><text x="870" y="385" text-anchor="middle" class="label">API</text><text x="870" y="442" text-anchor="middle" class="label">Consumption Layer</text>
  <path class="flow-both" d="M791 298h35M915 298h35"/>
  <rect x="951" y="264" width="66" height="67" rx="13" class="panel" fill="#eee6ff"/><text x="984" y="303" text-anchor="middle" class="label">User</text>

  <!-- Feedback loop and numbered callouts -->
  <path class="flow" d="M407 174V50c0-7 5-11 12-11h440c7 0 12 5 12 12v118"/>
  <text x="640" y="43" text-anchor="middle" class="label">Feedback + Memory</text>
  <g class="step"><circle cx="333" cy="148" r="15"/><circle cx="517" cy="153" r="15"/><circle cx="639" cy="149" r="15"/><circle cx="666" cy="325" r="15"/><circle cx="632" cy="372" r="15"/><circle cx="507" cy="382" r="15"/><circle cx="808" cy="262" r="15"/><circle cx="808" cy="325" r="15"/><circle cx="934" cy="326" r="15"/><circle cx="850" cy="62" r="15"/></g>
  <g text-anchor="middle" dominant-baseline="central" class="small"><text x="333" y="148">0</text><text x="517" y="153">4</text><text x="639" y="149">3</text><text x="666" y="325">5</text><text x="632" y="372">6</text><text x="507" y="382">6</text><text x="808" y="262">2</text><text x="808" y="325">7</text><text x="934" y="326">8</text><text x="850" y="62">9</text></g>
  <g class="step"><circle cx="934" cy="266" r="15"/></g><text x="934" y="266" text-anchor="middle" dominant-baseline="central" class="small">1</text>
</svg>
