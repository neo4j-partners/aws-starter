[project]
name = "aircraft-fleet-pipeline"
version = "0.1.0"
description = "A GraphRAG ingestion pipeline on Amazon Bedrock: generate an operational graph, enrich it from unstructured documents with Titan embeddings and Claude entity extraction, and fuse the two into a single Neo4j knowledge graph"
requires-python = ">=3.12"
dependencies = [
    # generator
    "faker>=40.0.0",
    "numpy>=2.4.0",
    # loader + GraphRAG enrichment
    "neo4j>=6.3.1",
    # Bedrock is the default provider; openai kept as a fallback extra
    "neo4j-graphrag[openai,bedrock]>=1.24.0",
    # boto3 is also imported directly (agent_samples.py Bedrock path)
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    # shared
    "typer>=0.25.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.17.0,<2",
    "neo4j-graphrag[anthropic]>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[project.scripts]
generate-data = "generator.main:app"
populate-aircraft-db = "populate_aircraft_db.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator", "src/populate_aircraft_db"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
